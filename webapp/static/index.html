<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BENCHEM</title>
<link rel="icon" href="/static/favicon.png">
<style>
html,body{-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
/* The iOS magnifier loupe fires on long-press over any selectable text and makes
   a dense tile grid unusable. Killed globally, then given back to the SMILES and
   InChI strings -- which are the whole reason a chemist opens the sheet, and the
   one thing they will want to select by hand rather than via Copy. */
body{user-select:none;-webkit-user-select:none}
.kv code,.note code,input,textarea{user-select:text;-webkit-user-select:text;
  -webkit-touch-callout:default}
:root{
  --bg:#0d1117; --panel:#161b22; --line:#26303d; --ink:#e6edf3; --dim:#8b98a5;
  --exact:#2ea043; --stereo:#d29922; --wrong:#da3633; --invalid:#6e7681; --acc:#388bfd;
  --tile:104px;
}
/* Kills the 300ms double-tap-to-zoom delay AND the zoom itself. On a grid of
   1,700 small tiles a stray second tap otherwise zooms the page instead of
   opening the next molecule. */
*{box-sizing:border-box;touch-action:manipulation}
/* A SMILES string is 200 characters with no space in it, which is exactly the
   input that pushes a grid child past its track and clips whatever sits beside
   it. Flex and grid children default to min-width:auto, i.e. "never shrink below
   my content"; these override that. */
.hrow>*,.wall>*,.pics>*,.doc>*,.shead>*{min-width:0}
/* NOT .bar>*. The filter bar is a horizontally SCROLLING strip, and min-width:0
   there lets every chip shrink to zero so they stack on top of one another --
   which is exactly what it did on a real phone. Children of a scroll strip must
   keep their natural width and let the container scroll; children of a grid track
   must shrink so they do not clip a neighbour. The two rules are opposites and
   applying one blanket rule to both broke the visible one. */
.bar>*{flex:0 0 auto}
.bar input[type=search]{flex:0 0 220px}
/* ---- Grid controls, shared by every tab ----
   .gbar: one compact row pinned under the header while you browse the grid: the active filter with its
   count (tap to open every filter), and search. position:sticky only, so sticking never moves layout;
   the shadow is toggled by an IntersectionObserver on a sentinel, never by a scroll handler. */
.gsent{height:1px;margin-bottom:-1px}
.gbar{position:sticky;top:var(--hh,57px);z-index:12;background:var(--bg);padding:8px 0;margin:0 0 6px;
  transition:box-shadow .15s}
.gbar.stuck{box-shadow:0 8px 10px -8px rgba(0,0,0,.8)}
.grow{display:flex;gap:8px;align-items:center;min-width:0}
.gchip{flex:0 0 auto;min-width:0;max-width:calc(100% - 128px);display:flex;align-items:center;gap:7px;min-height:44px;
  padding:8px 14px;border-radius:22px;background:var(--panel);border:1px solid var(--line);color:var(--ink);
  font:inherit;font-size:13.5px;cursor:pointer}
.gchip[aria-expanded=true]{border-color:var(--acc);background:#12233c}
.gchip .gl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.gchip .gn{color:var(--dim);font-style:normal;font-variant-numeric:tabular-nums;white-space:nowrap}
.gchip .car{color:var(--dim);font-weight:400;font-size:11px}
.grow input[type=search]{flex:1 1 0;min-width:120px;width:auto}
.gchip .dot{flex:0 0 7px}
.gpanel{position:absolute;left:0;right:0;top:calc(100% - 2px);background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:7px;max-height:60vh;overflow:auto;
  overscroll-behavior:contain;box-shadow:0 14px 28px rgba(0,0,0,.6)}
.gpanel[hidden]{display:none}
.fchips{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 4px}
.gpanel .chip{white-space:normal;text-align:left}
/* Floating to top / to bottom: appears once the grid's bar is pinned, bottom-right, above the home
   indicator (safe area). Opacity/transform only, so showing it never reflows anything. */
.fab{position:fixed;right:calc(12px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));
  z-index:15;display:flex;flex-direction:column;gap:8px;opacity:0;transform:translateY(10px);pointer-events:none;
  transition:opacity .18s ease-out,transform .18s ease-out}
.fab.on{opacity:1;transform:none;pointer-events:auto}
body.menuopen .fab{opacity:0;pointer-events:none}
.fab button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(22,27,34,.96);
  color:var(--ink);font-size:18px;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.55);
  -webkit-tap-highlight-color:transparent;display:grid;place-items:center}
.fab button:focus{outline:none} .fab button:focus-visible{box-shadow:0 0 0 2px var(--acc)}
@media (prefers-reduced-motion:reduce){.fab,.t img,.gbar{transition:none}}

html,body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
a{color:var(--acc)}
/* Opaque: at 94% the tiles scrolling underneath ghosted through the tab strip. */
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:12px;max-width:1400px;margin:0 auto;
  padding:6px calc(14px + env(safe-area-inset-right)) 6px calc(14px + env(safe-area-inset-left));
  padding-top:calc(6px + env(safe-area-inset-top))}
.brand{font-weight:700;letter-spacing:.3px;font-size:16px;white-space:nowrap}
.brand span{color:var(--dim);font-weight:400;font-size:13px}
.seg{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:2px;margin-left:auto}
.seg button{appearance:none;background:none;border:0;color:var(--dim);font:inherit;
  font-size:14px;padding:7px 13px;border-radius:6px;cursor:pointer;min-height:44px;
  white-space:nowrap}
/* #1f6feb, not the accent #388bfd: white 14px text on the accent is 3.3:1 and fails AA;
   on #1f6feb it is 4.6:1. */
.seg button[aria-selected=true]{background:#1f6feb;color:#fff;font-weight:600}
/* The Sonnet compare page is its own URL, so its tab is a link styled as a tab. */
.seg a.segl{color:var(--dim);font-size:14px;padding:0 13px;border-radius:6px;min-height:44px;
  display:flex;align-items:center;white-space:nowrap;text-decoration:none}
.seg a.segl:hover{color:var(--ink)}
.ghost{appearance:none;background:none;border:1px solid var(--line);color:var(--ink);
  font:inherit;font-size:13px;padding:8px 12px;border-radius:7px;cursor:pointer;min-height:44px}
main{max-width:1400px;margin:0 auto;
  padding:0 calc(14px + env(safe-area-inset-right)) calc(140px + env(safe-area-inset-bottom))
          calc(14px + env(safe-area-inset-left))}

/* hero */
.hero{padding:22px 0 14px;border-bottom:1px solid var(--line)}
/* Two readers, one denominator, at the SAME type size. A single big percentage
   with the other score in prose beneath reads as a headline plus a footnote; the
   point of this tab is that the two numbers are directly comparable. */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.cmp.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.cmp .side{background:var(--panel);border:1px solid var(--line);padding:13px 14px;min-width:0}
.cmp .who{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.6px;
  margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp .pc{font-size:34px;font-weight:800;line-height:1;letter-spacing:-1px}
.cmp .of{color:var(--dim);font-size:12px;margin-top:5px}
.cmp .track{height:7px;background:#0b0f14;margin-top:9px;overflow:hidden}
.cmp .track i{display:block;height:100%;background:var(--acc)}
.cmp .side.lead .track i{background:var(--exact)}
.cmp.cards{grid-template-columns:repeat(5,minmax(0,1fr))}
.cmp.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.cmp.topc{margin:4px 0 16px;max-width:980px}
.cmph{font-size:12.5px;color:var(--dim);margin:4px 0 7px;max-width:980px}
.cmph b{color:var(--ink);font-weight:600}
.cmph + .cmp.topc{margin-top:0}
@media (max-width:640px){.cmp.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cmp.cards .pc{font-size:26px}
@media (max-width:640px){.cmp.cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cmp.cards .side:first-child{grid-column:1 / -1}}
/* Four outcomes, one stacked bar. "Sonnet was wrong" and "Sonnet was wrong where
   the pipeline was right" are different facts and only the second is interesting
   here, so the tile colour and the bar both key on the OUTCOME, not on either
   reader's verdict alone. */
/* Outcome bars: label | bar | n | % on one grid, so every bar starts at the same x. */
.obars{display:grid;grid-template-columns:max-content minmax(0,1fr) auto auto;column-gap:10px;row-gap:7px;
  align-items:center;margin:4px 0 12px;font-size:12.5px;color:var(--dim)}
.obars .ol{display:flex;align-items:center;gap:6px;justify-content:flex-end;text-align:right;color:var(--ink)}
.obars .ol i{width:9px;height:9px;display:block;flex:0 0 9px;border-radius:2px}
.obars .otr{height:12px;background:#1c2128;border-radius:0 3px 3px 0;overflow:hidden}
.obars .otr i{display:block;height:100%;border-radius:0 3px 3px 0}
.obars b{color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.obars .op{text-align:right;font-variant-numeric:tabular-nums;min-width:3.4em}
.obars .o-unreadable{background:#4b535d;box-shadow:none}
/* Phone: the outcome labels are long, so each gets its own line above a full-width bar | n | % row. */
@media(max-width:560px){.obars{grid-template-columns:minmax(0,1fr) auto auto;row-gap:3px}
  .obars .ol{grid-column:1/-1;justify-content:flex-start;text-align:left;margin-top:5px}}
.mbar .lbl b{font-variant-numeric:tabular-nums}
.stack{display:flex;height:26px;overflow:hidden;margin:2px 0 9px;background:var(--panel);
  border:1px solid var(--line)}
.stack i{display:block;height:100%;position:relative;min-width:2px}
.stack i span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:#06090d}
/* Dark ink on the red segment is 4.33:1; white is 4.6:1. */
.stack i.o-neither span,.stack i.o-misread span,.stack i.o-noref span,.stack i.o-unreadable span{color:#fff}
/* Five states, three populations. Green and amber are CHECKED AND RIGHT, red is
   CHECKED AND WRONG, slate is NOT CHECKABLE, dark is NOTHING CAME OUT. The slate
   is deliberately not a warning colour: those structures are neither right nor
   wrong and colouring them red was the whole confusion. */
.o-matched{background:var(--exact)} .o-stereo{background:var(--stereo)}
.o-misread{background:var(--wrong)} .o-noref{background:#475569}
.o-unreadable{background:#1f242b;box-shadow:inset 0 0 0 1px #333b45}
.t.o-matched::after{background:var(--exact)} .t.o-stereo::after{background:var(--stereo)}
.t.o-misread::after{background:var(--wrong)} .t.o-noref::after{background:#475569}
.t.o-unreadable::after{background:#333b45}
/* One labelled bar per secondary measure, so a number and what it is are never
   more than a line apart. */
.mbar{margin-bottom:11px}
.mbar .lbl{display:flex;justify-content:space-between;gap:6px 10px;color:var(--dim);
  font-size:12.5px;margin-bottom:4px;flex-wrap:wrap}
.mbar .lbl>span{min-width:0}
/* nowrap on the VALUE only. A long label plus a nowrap value on one flex line
   cannot fit 320px, and the pair pushed the whole document 54px wide. The label
   wraps; the number never splits across lines. */
.mbar .lbl b{color:var(--ink);font-weight:700;white-space:nowrap;margin-left:auto}
.mbar .track{height:9px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.mbar .track i{display:block;height:100%;background:var(--acc);min-width:2px}
.mbar.good .track i{background:var(--exact)}
.o-both{background:var(--exact)} .o-sonnet{background:var(--acc)}
.o-cxms{background:var(--stereo)} .o-neither{background:var(--wrong)}
.key{display:flex;flex-wrap:wrap;gap:8px 14px;margin-bottom:14px}
.key b{display:flex;align-items:center;gap:6px;font-weight:400;color:var(--dim);font-size:12.5px}
.key b i{width:10px;height:10px;display:block}
.key b u{text-decoration:none;color:var(--ink);font-weight:700}
.t.o-both::after{background:var(--exact)} .t.o-sonnet::after{background:var(--acc)}
.t.o-cxms::after{background:var(--stereo)} .t.o-neither::after{background:var(--wrong)}
.prog{margin:0 0 14px}
.prog .lbl{display:flex;justify-content:space-between;gap:8px;color:var(--dim);
  font-size:12.5px;margin-bottom:5px}
.prog .track{height:8px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.prog .track i{display:block;height:100%;background:var(--acc);min-width:2px}
.pre{background:#0b0f14;border:1px solid var(--line);padding:12px;margin-top:10px;
  font:12px/1.55 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;
  color:var(--dim);user-select:text;-webkit-user-select:text;max-height:52vh;overflow-y:auto}
.big{font-size:52px;font-weight:800;line-height:1;letter-spacing:-1.5px}
.big small{font-size:17px;font-weight:500;color:var(--dim);letter-spacing:0;margin-left:8px}
.sub{color:var(--dim);font-size:14px;margin-top:8px}
.noteh{font-weight:700;font-size:12.5px;color:var(--ink);margin:12px 0 4px;
  text-transform:uppercase;letter-spacing:.5px}
.notelist{margin:0 0 4px 18px;padding:0}
.notelist li{font-size:12.5px;color:var(--dim);line-height:1.5;margin:3px 0}
/* Sticky jump bar so the lower sections are reachable without scrolling the wall. */
.jump{display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  background:var(--bg);border-bottom:1px solid var(--line);padding:8px 0;margin-bottom:4px}
.jump .jlbl{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.jump button{appearance:none;background:var(--panel);border:1px solid var(--line);color:var(--ink);
  font:inherit;font-size:12.5px;padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;min-height:44px}
.jump button:hover{border-color:var(--dim)}
.block{margin:26px 0 8px;border-top:1px solid var(--line);padding-top:18px}
.blockh{font-size:16px;font-weight:750;margin:0 0 8px}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:10px}
.excard{min-width:0;text-align:left;background:var(--panel);border:1px solid var(--line);
  border-left:3px solid var(--dim);border-radius:10px;padding:12px;cursor:pointer;color:var(--ink);font:inherit}
.excard.ok{border-left-color:#3fb950} .excard.miss{border-left-color:#d29922}
.excard:hover{border-color:var(--dim)}
.extag{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);margin-bottom:4px}
.extag.ok{color:#3fb950} .extag.miss{color:#d29922}
.extitle{font-weight:700;font-size:13.5px;margin-bottom:5px;line-height:1.3}
.exbody{font-size:12.5px;color:var(--dim);line-height:1.5}
.takeaway{background:var(--panel);border:1px solid var(--line);border-left:3px solid #d29922;
  border-radius:8px;padding:11px 13px;margin:10px 0;font-size:13.5px;line-height:1.5;color:var(--ink)}
.clswrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:10px;margin-top:12px}
.cls{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.clsh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:7px}
.clslab{font-size:12.5px;font-weight:650;color:var(--ink);min-width:0}
.clsn{color:var(--dim);font-weight:500;font-size:12px}
.clschip{flex:0 0 auto;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.clschip.s{background:rgba(63,185,80,.16);color:#3fb950}
.clschip.c{background:rgba(88,166,255,.16);color:#58a6ff}
.clschip.t{background:#1b222c;color:var(--dim)}
.clsbar{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12px;color:var(--dim)}
.cll{flex:0 0 84px}
.ctrack{flex:1 1 auto;min-width:0;height:7px;background:#0b0f14;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.ctrack i{display:block;height:100%}
.ctrack i.s{background:#3fb950} .ctrack i.c{background:#58a6ff}
.clsbar b{flex:0 0 36px;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.sub b{color:var(--ink);font-weight:600}
.xlink{display:block;margin-top:12px;background:var(--panel);border:1px solid var(--line);
  border-left:3px solid var(--acc);padding:11px 13px;min-height:44px;color:var(--dim);
  font-size:13.5px;line-height:1.45;text-decoration:none}
.xlink b{color:#58a6ff;font-weight:650}
.xlink:hover{border-color:var(--dim)}

/* filters */
.bar{display:flex;gap:7px;overflow-x:auto;padding:12px 0;position:sticky;top:var(--hh,57px);z-index:10;
  background:var(--bg);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.bar::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;background:var(--panel);border:1px solid var(--line);color:var(--dim);
  font:inherit;font-size:13px;padding:8px 14px;border-radius:20px;cursor:pointer;min-height:44px}
.chip[aria-pressed=true]{border-color:var(--acc);color:var(--ink);background:#12233c}
/* The count is dimmed by COLOUR, not opacity: opacity .65 over the chip put it at 3.25:1. */
.chip i{font-style:normal;color:var(--dim);margin-left:5px;white-space:nowrap}
.chipdiv{flex:0 0 1px;align-self:stretch;background:var(--line);margin:0 4px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
input[type=search]{flex:0 0 220px;background:var(--panel);border:1px solid var(--line);
  color:var(--ink);font:inherit;font-size:16px;padding:8px 16px;border-radius:20px;
  min-height:44px;min-width:0}

/* the wall */
.wall{min-height:calc(100dvh - 140px);align-content:start;display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(var(--tile),1fr));
  padding-top:4px}
.t{position:relative;background:#1c2128;overflow:hidden;cursor:pointer;contain-intrinsic-size:auto var(--th,var(--tile)) !important;
  border:0;padding:0;display:block;aspect-ratio:1;
  content-visibility:auto;contain-intrinsic-size:var(--tile)}
.t img{width:100%;height:100%;object-fit:contain;display:block;background:#1c2128}
/* White only once the drawing has arrived; until then the tile is a dark placeholder. */
.t img.ok{background:#fff}
/* Fade in over the dark placeholder instead of popping in. */
.t img{opacity:0;transition:opacity .22s ease-out} .t img.ok{opacity:1}
.t::after{content:"";position:absolute;inset:auto 0 0 0;height:4px;background:var(--invalid)}
.t.o-exact::after{background:var(--exact)} .t.o-stereo::after{background:var(--stereo)}
.t.o-wrong::after{background:var(--wrong)} .t.o-invalid::after{background:var(--invalid)}
.t b{position:absolute;top:0;right:0;background:rgba(13,17,23,.88);color:#fff;
  font-size:12px;font-weight:600;padding:1px 5px}
.t em{position:absolute;top:0;left:0;background:rgba(13,17,23,.88);color:#fff;
  font-size:12px;font-style:normal;font-weight:600;padding:1px 5px}
.t u{position:absolute;left:0;right:0;bottom:4px;background:rgba(13,17,23,.82);color:#fff;
  font-size:12px;text-decoration:none;padding:1px 4px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;display:block}
/* Superatoms tab: two readers side by side per row, and tiles that carry the truth and both
   answers under the image. Scoped by payload flags (DATA.c2, DATA.tileText). */
.c2{margin:4px 0 12px;max-width:760px}
.c2k{display:flex;gap:14px;font-size:12.5px;color:var(--dim);margin-bottom:10px}
.c2k i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px;border-radius:2px}
/* One grid for the whole chart (rows are display:contents), so every bar starts at the same x and the
   label column is only as wide as the widest label, right-aligned against the bars. */
.c2g{display:grid;grid-template-columns:max-content minmax(0,1fr) auto auto;column-gap:10px;row-gap:6px;
  align-items:center;font-size:12.5px;color:var(--dim)}
.c2r,.c2b{display:contents}
.c2l{grid-column:1/-1;font-size:13px;color:var(--ink);margin-top:8px} .c2l span{color:var(--dim)}
.c2l:first-child{margin-top:0}
.c2b .who{text-align:right;white-space:nowrap}
.c2b b{color:var(--ink);font-size:13.5px;text-align:right;font-variant-numeric:tabular-nums;min-width:3.6em}
.c2b .kn{text-align:right;font-variant-numeric:tabular-nums}
.c2b .tr{height:12px;background:#1c2128;overflow:hidden;min-width:0;border-radius:0 3px 3px 0}
.c2b .tr i{display:block;height:100%;border-radius:0 3px 3px 0}
.c2 .s, .c2k .s{background:#14652f} .c2 .c, .c2k .c{background:#3987e5}
.wall.tx{grid-template-columns:repeat(auto-fill,minmax(148px,1fr))}
.t.tx{aspect-ratio:auto;contain-intrinsic-size:auto 260px;text-align:left;background:var(--panel)}
.t.tx img{height:auto;aspect-ratio:1;background:#1c2128}
.t.tx img.ok{background:#fff}
.t.tx::after{display:none}
.t .tl{display:block;padding:4px 6px 6px;font-size:11px;line-height:1.45;color:var(--ink)}

/* Headline cards (LLM vs OCR, Superatoms): reader, big exact %, a thin bar in the reader's
   colour, and "exact of n". xs: [{who, pct, exact, n, color}]. */
function bigCards(xs){
  return '<div class="cmp topc' + (xs.length === 4 ? ' four' : '') + '">' + xs.map(function(x){
    return '<div class="side"><div class="who">' + esc(x.who) + '</div><div class="pc">' + (+x.pct).toFixed(1)
      + '%</div><div class="of">' + (+x.exact).toLocaleString("en-US") + ' of ' + (+x.n).toLocaleString("en-US")
      + '</div><div class="track"><i style="width:' + Math.min(100, x.pct) + '%;background:' + x.color + '"></i></div></div>';
  }).join("") + '</div>';
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

/* A tile's colour is its verdict. `exact` and `stereo` are the two that mean the
   reader got the right molecule; everything else is a miss of some kind. */
/* One place that turns a scored verdict into a display state, so the tiles, the
   chips and the stacked bar cannot drift apart the way they did. */
var STATE = {exact:"matched", stereo:"stereo", misread:"misread", wrong:"misread",
             unmatched:"noref", "no-truth":"noref", invalid:"unreadable"};
/* Anything unrecognised used to fall through to "invalid", which quietly counted
   1,026 no-ground-truth rows as Unparseable in the chips while the legend beside
   them said 231. An unknown verdict gets its own bucket now instead of borrowing
   somebody else's. */
function cls(r){ return STATE[r.v] || "noref"; }
/* On the Sonnet tab a tile is coloured by WHO got it right, which is the question
   the tab exists to answer. Everywhere else it falls back to the verdict. */
function tileCls(r){ return r.o ? "o-" + r.o : "o-" + cls(r); }

function match(r){
  if (DOC && r.d !== DOC) return false;
  if (Q && (r.n||"").toLowerCase().indexOf(Q) < 0) return false;
  if (FILTER === "all") return true;
  if (FILTER === "high") return (r.c||0) >= DATA.threshold;
  if (FILTER === "cx") return !!r.cx;
  if (r.o) return r.o === FILTER;
  return cls(r) === FILTER;
}

function counts(rows){
  /* Buckets are seeded from the payload's own breakdown rather than a hard-coded
     list. The hard-coded list is exactly what broke when the state names changed:
     cls() returned "matched" while the counter only knew "exact", so every chip
     read undefined and the whole bar disappeared except All. */
  var c = {all: rows.length, high: 0};
  ((DATA.breakdown || []).concat(
    (DATA.compare && DATA.compare.breakdown) || [])).forEach(function(x){ c[x.key] = 0; });
  rows.forEach(function(r){
    var k = r.o || cls(r);
    c[k] = (c[k] || 0) + 1;
    if ((r.c || 0) >= DATA.threshold) c.high++;
  });
  return c;
}

/* Prefetch the read-back drawing the moment its tile's own thumbnail has landed.
   Without this the detail sheet opens on a blank frame and fills in afterwards,
   because the sheet is the FIRST time that URL is requested. Keyed to the tile's
   load event rather than page load, so it stays bounded to tiles that actually
   rendered. */
function prefetchPred(r){
  if ((!r.p && !r.po) || r._pf) return;
  r._pf = true;
  var i = new Image();
  i.decoding = "async";
  i.src = "/wall/" + DATA.dir + "_pred/" + encodeURIComponent(r.k) + ".png";
  if (r.po) { var j = new Image(); j.decoding = "async";
    j.src = "/wall/" + DATA.dir + "_ocr/" + encodeURIComponent(r.k) + ".png"; }
}

/* Tile images load two screens ahead of the viewport (the browser's own loading=lazy waits until
   a tile is nearly on screen, so a fast scroll showed blank tiles), and keep a dark placeholder
   until the drawing arrives. */
var IMGIO = new IntersectionObserver(function(es){
  es.forEach(function(e){ if (!e.isIntersecting) return; var i = e.target; IMGIO.unobserve(i); i.src = i.dataset.src; });
}, {rootMargin: "300% 0px"});
function lazyImg(img, cb){
  img.addEventListener("load", function(){ img.classList.add("ok"); if (cb) cb(); }, {once: true});
  IMGIO.observe(img);
}
window.lazyImg = lazyImg;

function tile(r){
  if (DATA.tileText) return tileText(r);
  var b = el("button", "t " + tileCls(r));
  b.innerHTML = '<img decoding="async" data-src="/wall/' + DATA.dir + '/'
    + encodeURIComponent(r.k) + '.png" alt="">'
    + (r.c != null ? "<b>" + r.c + "</b>" : "")
    + (r.dup > 1 ? '<em>&times;' + r.dup + '</em>' : "")
    + (r.rf ? '<em title="' + esc(r.rf) + '">&#8635;</em>' : "")
    + "<u>" + esc(r.n) + "</u>";
  lazyImg(b.firstChild, function(){ prefetchPred(r); });
  b.onclick = function(){ openSheet(r); };
  return b;
}

/* Superatoms tab tile: the image, then the truth, then each reader's answer with its verdict mark. */
function tileText(r){
  var b = el("button", "t tx");
  var M = {exact:"\u2713", stereo:"\u2248", wrong:"\u2717", invalid:"\u2013"};
  function line(who, sm, v){ return '<span>' + (v ? '<i class="m ' + v + '">' + M[v] + '</i>' : '')
    + '<small>' + esc(who) + '</small>' + esc(sm || "(none)") + '</span>'; }
  b.innerHTML = '<img decoding="async" data-src="/wall/' + DATA.dir + '/'
    + encodeURIComponent(r.k) + '.png" alt="">'
    + '<span class="tl">' + line("Truth", r.tw ? "withheld" : r.t, null)
    + (r.tl || []).map(function(x){ return line(x[0], x[1], x[2]); }).join("") + '</span>';
  lazyImg(b.firstChild);
  b.onclick = function(){ openSheet(r); };
  return b;
}

/* Say what RDKit actually found, per row, rather than leaving the reader to diff
   two strings. The three cases are genuinely different and must not share wording:
   an exact match really does canonicalise to ONE identical string; a close match
   never will, and only agrees once something is discarded; and that something is
   not always stereochemistry -- Acetone-D6 is graded the same way because the
   reference carries six deuteriums and the reader saw three. */
/* CXSMILES is the whole reason this fork exists, and it was being printed
   unlabelled. `Chem.MolToSmiles` silently drops the |$...$| block; CXMolScribe
   calls MolToCXSmiles and keeps it, which is what preserves an abbreviation the
   drawing spelled as text. Shown without a name it reads as line noise. */
function cxLabels(sm){
  var m = /\|\$(.*?)\$\|/.exec(sm || "");
  if (!m) return null;
  var seen = {}, out = [];
  m[1].split(";").forEach(function(x){
    x = x.trim();
    if (x && !seen[x]) { seen[x] = 1; out.push(x); }
  });
  return out;
}

function smilesField(label, sm, extra){
  var labs = cxLabels(sm);
  return '<div class="kv"><label>' + esc(label)
    + (labs ? ' <span class="dim">&mdash; CXSMILES</span>' : '')
    + (extra || '') + '</label><code>' + esc(sm) + '</code>'
    /* `*` in that block is an attachment point, not something the drawing spelled
       out. Listing it beside a real abbreviation implies the reader saw a glyph
       that was never there. */
    + (function(){
        if (!labs) return '';
        var real = labs.filter(function(x){ return x !== '*'; });
        var star = labs.length !== real.length;
        if (!real.length && !star) return '';
        return '<p class="cxnote">The <code>|$…$|</code> block is the CXSMILES extension, '
          + 'which plain SMILES drops silently. '
          + (real.length
              ? 'Abbreviation' + (real.length > 1 ? 's' : '') + ' the drawing spelled out as '
                + 'text rather than as structure, kept verbatim: <b>'
                + real.map(esc).join('</b>, <b>') + '</b>. '
              : '')
          + (star ? 'The <code>*</code> entries are attachment points, not labels.' : '')
          + '</p>';
      })()
    + '</div>';
}

function verdictNote(r){
  var x = r.r;
  if (!x) return "";
  if (x.how === "identical")
    return '<div class="note"><b>RDKit: identical.</b> Both strings parse to the same '
      + 'molecule and the same canonical form — they are two ways of writing it.'
      + '<code>' + esc(x.canon) + '</code></div>';
  if (x.how === "different") return "";
  var bits = [];
  if (x.stereo) bits.push(x.stereo[0] + " of " + x.stereo[1] + " stereocentre"
    + (x.stereo[1] === 1 ? "" : "s") + " disagree");
  if (x.geom) bits.push(x.geom + " double-bond geometr" + (x.geom === 1 ? "y" : "ies") + " disagree");
  if (x.iso) bits.push("isotope labels differ — " + x.iso[0] + " read against " + x.iso[1] + " expected");
  return '<div class="note"><b>RDKit: same skeleton, not the same molecule.</b> '
    + (bits.length ? bits.join("; ") + "." : "They differ only in stereochemistry.")
    + ' Identical once that is discarded:<code>' + esc(x.canon || "") + '</code></div>';
}

function fmtdur(s){ s = Math.round(s || 0);
  if (s < 60) return s + "s";
  var m = Math.floor(s / 60), ss = s % 60;
  if (m < 60) return ss ? m + "m " + ss + "s" : m + "m";
  return Math.floor(m / 60) + "h " + (m % 60) + "m"; }
function openSheet(r){
  var v = cls(r);
  var VERD = {matched:"matched the reference", stereo:"matched, stereochemistry differs",
              misread:"a reference exists and this is not it",
              noref:"no reference to check against", unreadable:"nothing usable produced"};
  /* Name the reader on every single line. "PREDICTED" and "EXPECTED" do not say
     WHOSE, and on a tab that shows two readers side by side that is the one thing
     the labels have to carry. */
  var twoReaders = !!r.ocr;
  /* The API tabs (DATA.cards) have one reader and it is never CXMolScribe. */
  var meLabel = twoReaders || DATA.cards ? (DATA.reader || "Sonnet") : "CXMolScribe";
  var s5State = r.s5 ? ({exact:"matched", stereo:"stereo", invalid:"unreadable"}[r.s5.v] || "misread") : null;
  var ocrState = r.ocrv === "exact" ? "matched" : r.ocrv === "stereo" ? "stereo"
               : r.ocrv === "invalid" ? "unreadable" : "misread";
  function badge(who, state){
    return '<span class="badge ' + state + '">' + esc(who) + ' &middot; '
      + esc(VERD[state] || state) + '</span>';
  }
  $("#sheetHead").innerHTML =
      '<button class="sclose" aria-label="Close" onclick="document.getElementById(\'sheet\').close()">&times;</button>'
    + '<h3>' + esc(r.n) + '</h3>'
    + '<div class="meta">' + badge(meLabel, v)
    + (twoReaders ? " " + badge("CXMolScribe", ocrState) : "")
    + (s5State ? " " + badge("Sonnet 5", s5State) : "")
    + (r.rf ? ' <span class="badge noref">' + esc(r.rf) + '</span>' : "")
    + (r.alt ? " " + badge(DATA.altShort || "Other reader", {exact:"matched", stereo:"stereo", invalid:"unreadable"}[r.alt.v] || "misread") : "")
    + (r.d ? '<div style="margin-top:6px">' + esc(r.d)
        + (r.dup > 1 ? ' &middot; drawn ' + r.dup + ' times in this document' : '') + '</div>' : '')
    + '</div>';

  var pics = '<figure><img decoding="sync" src="/wall/' + DATA.dir + '/'
    + encodeURIComponent(r.k) + '.png" alt=""><figcaption>Input</figcaption></figure>'
    + (r.p ? '<figure><img decoding="sync" src="/wall/' + DATA.dir + '_pred/'
      + encodeURIComponent(r.k) + '.png" alt=""><figcaption>' + esc(meLabel)
      + ' read</figcaption></figure>' : '')
    + (r.po ? '<figure><img decoding="sync" src="/wall/' + DATA.dir + '_ocr/'
      + encodeURIComponent(r.k) + '.png" alt=""><figcaption>CXMolScribe read'
      + '</figcaption></figure>' : '');
  var npics = (pics.match(/<figure/g) || []).length;

  /* Confidence belongs to whoever produced it, and the two are not the same kind
     of thing: CXMolScribe emits a calibrated score, Sonnet states a self-rating.
     "model said high" said neither whose nor which. */
  /* On the Sonnet tab the pipeline's confidence lives in `ocrc`, because `c` is
     the row's own reader. Reading only `c` there left CXMolScribe's score off the
     one page built to compare the two. */
  var ocrConf = (r.ocrc != null ? r.ocrc : r.c);
  var conf = ocrConf != null ? ' <span class="dim">confidence ' + ocrConf + '%</span>' : '';
  var sconf = r.sconf ? ' <span class="dim">rated itself ' + esc(r.sconf) + '</span>' : '';

  $("#sheetBody").innerHTML =
      '<div class="pics pics' + npics + '">' + pics + '</div>'
    + smilesField(meLabel + " read", r.s || "(nothing emitted)",
                  twoReaders ? sconf : conf)
    + (r.ocr ? smilesField("CXMolScribe read", r.ocr, conf) : "")
    /* The 5.5 tab shows the Sonnet 5 arm's reading of the same drawing where there is one. The
       Sonnet 5 arm stopped, so rows past it have none: say so (text from the payload) instead of
       leaving the reader to wonder where the third reading went. */
    + (r.s5 ? smilesField("Sonnet 5 read (Sonnet 5 tab)", r.s5.s || "(nothing emitted)",
        r.s5.conf != null && r.s5.conf !== "" ? ' <span class="dim">rated itself ' + esc(r.s5.conf) + '</span>' : '')
      : DATA.noS5 ? '<div class="kv"><label>Sonnet 5 read</label><code>' + esc(DATA.noS5) + '</code></div>' : "")
    + (r.alt ? smilesField(DATA.altLabel || "Other reader", r.alt.s || "(nothing emitted)",
        r.alt.conf != null && r.alt.conf !== "" ? ' <span class="dim">rated itself ' + esc(r.alt.conf) + '</span>' : '')
      : DATA.noAlt ? '<div class="kv"><label>' + esc(DATA.altLabel || "Other reader") + '</label><code>' + esc(DATA.noAlt) + '</code></div>' : "")
    + (r.t ? smilesField("Reference — what the ground truth says", r.t, "")
      /* Withheld, not missing: the verdict above was scored against it. The served payload
         carries a reference only once a tool-using reader has read the image. */
      : r.tw ? '<div class="kv"><label>Reference</label><p class="sub" style="margin:0">' + esc((DATA.withheld && DATA.withheld.note)
        || "Withheld until a tool-using reader has read this image") + '</p></div>'
      : '<div class="kv"><label>Reference</label><code>none — nobody catalogued this '
        + 'structure, so neither reading can be called right or wrong</code></div>')
    + (r.rc != null ? '<div class="kv"><label>This run <span class="dim">' + esc(DATA.runNote || ((DATA.reader || "Sonnet") + ' API, at list price')) + '</span></label>'
        + '<code>$' + (r.rnote ? r.rc.toFixed(3) : r.rc.toFixed(2)) + ' / image · ~' + fmtdur(r.rt) + ' / image'
        + (r.rnote ? '<br><span class="dim">' + esc(r.rnote) + '</span>' : r.bn === 1 ? '<br><span class="dim">read alone: one image per reader (single-image readers)</span>'
          : '<br><span class="dim">a batch of ' + r.bn + ' read in one shared context: $'
            + r.bc.toFixed(2) + ' · ' + fmtdur(r.bs) + '</span>') + '</code></div>' : '')
    + verdictNote(r)
    + (r.tx ? '<details class="fold" id="replyfold"><summary>The full reply</summary><div class="pre">Loading…</div></details>' : '')
    + '<button class="ghost" onclick="navigator.clipboard.writeText('
    + JSON.stringify(r.s || "") + ')">Copy ' + esc(meLabel) + '\u2019s reading</button>';
  /* The reply text is fetched only when its fold is opened (it is not in the tab payload). */
  var rf = $("#replyfold");
  if (rf) rf.addEventListener("toggle", function(){
    if (!rf.open || rf.dataset.got) return;
    rf.dataset.got = "1";
    fetch("/wall/" + DATA.dir + "_txt/" + encodeURIComponent(r.k) + ".txt").then(function(x){
      if (!x.ok) throw new Error("HTTP " + x.status); return x.text();
    }).then(function(t){ rf.querySelector(".pre").textContent = t; },
            function(e){ rf.querySelector(".pre").textContent = "Could not load the reply (" + e.message + ")"; });
  });
  $("#sheetBody").scrollTop = 0;
  $("#sheet").showModal();
}

/* ---- An incremental tile wall, shared by every tab (llmocr.js uses it too) ----
   makeWall(el, rows, tileFn, opts) renders the first batch and APPENDS the next batch when a sentinel
   3,000 px ahead comes into view; it never rebuilds tiles it already drew (the old paint() re-created
   every tile on every batch). end() appends the rest in chunks, one frame each, then calls back, so
   "to bottom" never blocks a frame for long. Tile heights are measured once and fed back as the
   intrinsic size for content-visibility, so tiles that were never rendered have the right height and
   scrolling back up does not drift. */
function makeWall(wall, rows, tileFn, o){
  o = o || {};
  var shown = 0, step = o.step || 300, sentinel = null, busy = false;
  var obs = new IntersectionObserver(function(es){
    if (es.some(function(e){ return e.isIntersecting; })) more(step);
  }, {rootMargin: "3000px"});
  function more(n){
    if (sentinel){ obs.unobserve(sentinel); sentinel.remove(); sentinel = null; }
    var frag = document.createDocumentFragment(), to = Math.min(rows.length, shown + n);
    for (var i = shown; i < to; i++) frag.appendChild(tileFn(rows[i]));
    wall.appendChild(frag); shown = to;
    if (shown < rows.length){
      sentinel = el("div", "more", (rows.length - shown).toLocaleString("en-US") + " more below");
      wall.appendChild(sentinel); obs.observe(sentinel);
    }
    measure();
  }
  var measured = false;
  function measure(){
    if (measured || !wall.firstElementChild || !wall.firstElementChild.classList.contains("t")) return;
    measured = true;
    requestAnimationFrame(function(){
      /* Measure a tile that is really laid out: an off-screen content-visibility:auto tile reports its
         placeholder height, which would feed the estimate back into itself. The probe stays visible. */
      var t = wall.firstElementChild; t.style.contentVisibility = "visible";
      var h = t.offsetHeight;
      if (h) wall.style.setProperty("--th", h + "px");
    });
  }
  if (window.ResizeObserver) new ResizeObserver(function(){ measured = false; measure(); }).observe(wall);
  wall.innerHTML = "";
  if (!rows.length) wall.appendChild(el("div", "more", o.empty || "Nothing matches."));
  else more(o.first || step);
  return {
    /* follow: keep the view pinned to the growing end while chunks land, so "to bottom" moves at once
       instead of sitting still until the last chunk. */
    end: function(cb, follow){
      if (busy) return; busy = true;
      (function chunk(){
        if (shown < rows.length){
          more(250);
          if (follow && FOLLOW) window.scrollTo(0, document.documentElement.scrollHeight);
          requestAnimationFrame(chunk);
        } else { busy = false; if (cb) cb(); }
      })();
    },
    disconnect: function(){ obs.disconnect(); }
  };
}
window.makeWall = makeWall;

var WALLCTL = null;
function paint(){
  var rows = DATA.rows.filter(match);
  if (WALLCTL) WALLCTL.disconnect();
  WALLCTL = makeWall($("#wall"), rows, tile, {step: STEP, empty: "Nothing matches that filter."});
  if (GBAR) GBAR.setCount(rows.length);
}

/* ---- Grid controls shared by every tab (CSS: .gbar, .fab) ----
   gridBar({items:[{key,label,n,color}], current, onPick, query, onSearch}) returns {sent, bar, setCount,
   setCurrent}. Append sent then bar straight into the page column (sticky needs the long container). */
var REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function gridBar(o){
  var sent = el("div", "gsent"), bar = el("div", "gbar"), row = el("div", "grow");
  var btn = el("button", "gchip"); btn.type = "button";
  btn.setAttribute("aria-haspopup", "true"); btn.setAttribute("aria-expanded", "false");
  var s = el("input"); s.type = "search"; s.placeholder = "Search name"; s.value = o.query || "";
  s.setAttribute("aria-label", "Search by name");
  s.oninput = function(){ o.onSearch(s.value.trim().toLowerCase()); };
  var panel = el("div", "gpanel"); panel.hidden = true; panel.setAttribute("role", "menu");
  var cur = o.current, count = 0;
  function dot(c){ return '<span class="dot" style="background:' + (c || "#8b98a5") + '"></span>'; }
  function label(){
    var it = o.items.filter(function(x){ return x.key === cur; })[0] || o.items[0];
    btn.innerHTML = (it.key === "all" ? "" : dot(it.color)) + '<span class="gl">' + esc(it.label) + '</span>'
      + '<i class="gn">' + count.toLocaleString("en-US") + '</i><b class="car">\u25BE</b>';
  }
  o.items.forEach(function(it){
    var b = el("button", "chip"); b.type = "button"; b.setAttribute("role", "menuitemradio");
    b.innerHTML = (it.key === "all" ? "" : dot(it.color)) + esc(it.label) + '<i>' + (it.n == null ? "" : it.n.toLocaleString("en-US")) + '</i>';
    b.setAttribute("aria-checked", it.key === cur);
    b.onclick = function(){ close(); o.onPick(it.key); };
    panel.appendChild(b);
  });
  function close(){ panel.hidden = true; btn.setAttribute("aria-expanded", "false"); document.body.classList.remove("menuopen"); }
  btn.onclick = function(e){ e.stopPropagation(); var open = panel.hidden; panel.hidden = !open;
    btn.setAttribute("aria-expanded", String(open)); document.body.classList.toggle("menuopen", open); };
  row.appendChild(btn); row.appendChild(s); bar.appendChild(row); bar.appendChild(panel);
  bar._close = close;
  ACTIVE = {sent: sent, bar: bar, stuck: null};
  requestAnimationFrame(syncStuck);
  label();
  return {sent: sent, bar: bar,
          setCount: function(n){ count = n; label(); },
          setCurrent: function(k){ cur = k; label();
            [].forEach.call(panel.children, function(b, i){ b.setAttribute("aria-checked", o.items[i].key === k); }); }};
}
window.gridBar = gridBar;
/* Stuck = the sentinel above the bar has gone under the header; it drives the bar's shadow and the
   floating to-top / to-bottom buttons. An IntersectionObserver misses programmatic jumps (a scrollTo
   from below the viewport to above it never intersects), so this is one passive scroll listener,
   throttled to one rAF, that READS one rect and WRITES two classes only when the state flips. */
var ACTIVE = null, SYNC_PENDING = false;
function syncStuck(){
  SYNC_PENDING = false;
  if (!ACTIVE || !ACTIVE.sent.isConnected) return;
  var hh = HH || 57, stuck = ACTIVE.sent.getBoundingClientRect().top < hh;
  if (stuck === ACTIVE.stuck) return;
  ACTIVE.stuck = stuck;
  ACTIVE.bar.classList.toggle("stuck", stuck); FAB.classList.toggle("on", stuck);
}
window.addEventListener("scroll", function(){
  if (!SYNC_PENDING){ SYNC_PENDING = true; requestAnimationFrame(syncStuck); }
}, {passive: true});
/* One menu open at a time; a tap outside, or Escape, closes it. */
document.addEventListener("click", function(e){
  [].forEach.call(document.querySelectorAll(".gbar"), function(b){ if (!b.contains(e.target) && b._close) b._close(); });
});
document.addEventListener("keydown", function(e){ if (e.key === "Escape")
  [].forEach.call(document.querySelectorAll(".gbar"), function(b){ if (b._close) b._close(); }); });

/* Scroll the grid's start to just under the header (after a filter change from the pinned bar). */
function gridTop(sent){
  var hh = ($("header") || {offsetHeight: 57}).offsetHeight;
  window.scrollTo(0, sent.getBoundingClientRect().top + window.scrollY - hh + 2);   // +2: past the sentinel, so the bar reads as pinned
}
window.gridTop = gridTop;

/* Floating to top / to bottom. GRID_END (set by each tab) renders every remaining tile first, so
   "bottom" is the true end; the jump is re-checked after layout in case anything still grew. Smooth
   only for short distances and never under reduced motion: a smooth scroll across thousands of tiles
   would start every image on the way. */
var FAB = el("div", "fab");
FAB.innerHTML = '<button type="button" data-d="top" aria-label="Back to top">\u2191</button>'
  + '<button type="button" data-d="end" aria-label="To the bottom">\u2193</button>';
document.body.appendChild(FAB);
function glide(y){
  var far = Math.abs(y - window.scrollY) > 6 * window.innerHeight;
  window.scrollTo({top: y, behavior: REDUCED || far ? "auto" : "smooth"});
}
/* FOLLOW: "to bottom" keeps the view at the growing end until the rest has rendered, unless the reader
   takes over (touch, wheel, a key, or "to top"). */
var FOLLOW = false;
["touchstart", "wheel", "keydown"].forEach(function(ev){
  window.addEventListener(ev, function(){ FOLLOW = false; }, {passive: true});

FAB.addEventListener("click", function(e){
  var b = e.target.closest("button[data-d]"); if (!b) return;
  if (b.dataset.d === "top"){ FOLLOW = false; glide(0); return; }
  FOLLOW = true;
  var go = function(){ if (!FOLLOW) return; requestAnimationFrame(function(){ requestAnimationFrame(function(){
    var end = function(){ return document.documentElement.scrollHeight - window.innerHeight; };
    glide(end());
    setTimeout(function(){ if (FOLLOW && window.scrollY < end() - 2) window.scrollTo(0, end()); FOLLOW = false; }, 450);

function chipItems(rows){
  var c = counts(rows);
  /* Chips are built from the SAME breakdown that draws the stacked bar, so the
     two can never name different buckets or different totals. */
  var set = (DATA.compare && DATA.compare.breakdown) ? [["all","All"]].concat(
      DATA.compare.breakdown.map(function(x){ return [x.key, x.label]; }))
    : (DATA.breakdown ? [["all","All"]].concat(DATA.breakdown.map(function(x){
        return [x.key, x.label]; })) : VERDICTS);
  var colour = {matched:"var(--exact)",stereo:"var(--stereo)",misread:"var(--wrong)",
                noref:"#475569",unreadable:"#333b45",both:"var(--exact)",
                sonnet:"var(--acc)",cxms:"var(--stereo)",neither:"var(--wrong)"};
  /* A chip reading "Stereo only 0" is a filter guaranteed to show nothing. Hide empty buckets, but
     never "All" and never the one currently selected. */
  var items = set.filter(function(p){ return p[0] === "all" || c[p[0]] || FILTER === p[0]; })
    .map(function(p){ return {key: p[0], label: p[1], n: c[p[0]] || 0, color: colour[p[0]]}; });
  /* A different axis from the scoring states: what the OUTPUT carries, not whether it was right. */
  if (DATA.cx) items.push({key: "cx", label: DATA.cxLabel || "Has CXSMILES labels", n: DATA.cx, color: "var(--acc)"});
  return items;
}

/* Every tab's grid controls: the full filter set (wrapping, not pinned) and the compact pinned bar. */

function chipbar(rows, v){

    var stuck = GBAR && GBAR.bar.classList.contains("stuck");

    var b = el("button", "chip"); b.type = "button";
    b.innerHTML = (it.color ? '<span class="dot" style="background:' + it.color + '"></span>' : "")

/* 135 document rows ahead of the wall means 135 rows of scrolling before a single

  if (!DATA.docs || !DATA.docs.length) return null;

  var sum = el("summary", null, DOC
    ? "Showing only " + DOC + " — tap to change or clear"

    + DATA.rows.length + "</span>";

    var fd = d.found_exact != null ? d.found_exact : d.found;

    b.innerHTML = '<span class="nm">' + esc(d.name) + "</span>"

      + '<span class="n">' + (d.nogt ? (d.read || 0) + " read" : fd + "/" + d.expected)

/* Shared by all three tabs so they read the same way. Segment order is fixed by
   the payload, never sorted by size -- a bar that reorders itself between builds
   cannot be compared with the one you looked at yesterday. */
/* Where every structure landed: one plain left-aligned bar per outcome on a shared 0-100% scale
   (Sam, 9 Oct: no stacked, diverging or centred bars). Order is fixed by the payload. */
function stackOf(parts, total){
  if (!parts || !parts.length || !total) return "";
  return '<div class="obars">' + parts.map(function(x){
      var p = x.n / total * 100;
      return '<span class="ol"><i class="o-' + x.key + '"></i>' + esc(x.label) + '</span>'
        + '<span class="otr"><i class="o-' + x.key + '" style="width:' + Math.max(x.n ? 0.6 : 0, p) + '%"></i></span>'
        + '<b>' + x.n.toLocaleString("en-US") + '</b><span class="op">' + p.toFixed(1) + '%</span>';
    }).join("") + '</div>'
    + (parts.some(function(x){ return x.key === "noref"; })
        ? '<p class="sub" style="margin:-2px 0 14px">Slate had no reference to check against: neither right nor wrong.</p>' : '');
}

function tqTimeline(r){
  var v = {}; r.img.forEach(function(x){ if (x[0]) v[x[0]] = x[1]; });
  var groups = [], cur = null;
  for (var i = 0; i < r.seq.length; i++){
    var im = r.si[i];
    if (!cur || cur.im !== im){ cur = {im: im, cells: []}; groups.push(cur); }
    var c = r.seq[i], g = TQ_G[c] || "other";
    cur.cells.push('<i class="kg-' + g + (c === "c" || c === "d" ? " v" : "") + '" style="--c:var(--k-' + g + ')" data-tip="'
      + esc("Step " + (i + 1) + " · " + TQ_K[c] + (im > 0 ? " · image " + im : im < 0 ? " · several images" : "")
      + " · " + tqMS(r.st[i]) + " in") + '"></i>');
  }
  var m55 = r.lane.indexOf("s55") === 0 || r.lane === "nov";
  return '<div class="tlh"><b>' + r.aid + '</b> · Sonnet ' + esc(TQ_LANE[r.lane] || r.lane) + (r.batch != null ? ' · batch ' + r.batch : '')
    + ' · ' + r.calls + ' calls in ' + r.min + ' min · $' + tqN(r.cost, 2) + ' · ' + r.exact + '/' + r.n + ' exact. '
    + 'Left to right; each block is a run of steps on one image (#n, green if read exactly), '
    + '“all” is a step over several images. Hollow = looking at a crop or render.</div>'
    + '<div class="tqleg">' + TQ.data.groups.map(function(g){ return '<b><i class="kg-' + g.key + '"></i>' + esc(g.label) + '</b>'; }).join("")
    + '<b><i class="hollow"></i>looked at the result</b></div>'
    + '<div class="tline">' + groups.map(function(g){
      var lab = g.im > 0 ? "#" + g.im + (v[g.im] ? (v[g.im] === "exact" ? " ✓" : " ✗") : "") : g.im < 0 ? "all" : "–";
      var cls = g.im > 0 && v[g.im] ? (v[g.im] === "exact" ? " ok" : " no") : "";
      return '<div class="tg"><span class="gl' + cls + '">' + lab + '</span><div class="cells">' + g.cells.join("") + '</div></div>';
    }).join("") + '</div>';
}
function tqWire(sec){
  sec.addEventListener("click", function(e){
    var b = e.target.closest("[data-lane]");
    if (b){ TQ.lane = b.dataset.lane; TQ.all = false; TQ.open = null; tqTable(); return; }
    var th = e.target.closest("th[data-sort]");
    if (th){ var k = th.dataset.sort; TQ.dir = TQ.sort === k ? -TQ.dir : (k === "t0" ? 1 : -1); TQ.sort = k; tqTable(); return; }
    if (e.target.closest("#tqAll")){ TQ.all = !TQ.all; tqTable(); return; }
    var tr = e.target.closest("tr.r");
    if (tr){ TQ.open = TQ.open === tr.dataset.aid ? null : tr.dataset.aid; tqTable(); }
  });
  var tip = $(".tqtip");
  if (!tip){ tip = el("div", "tqtip"); document.body.appendChild(tip); }
  function show(e){
    var t = e.target.closest && e.target.closest("[data-tip]");
    if (!t || !sec.contains(t)){ tip.style.display = "none"; return; }
    tip.textContent = t.getAttribute("data-tip"); tip.style.display = "block";
    var x = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8);
    var y = e.clientY + 16; if (y + tip.offsetHeight > window.innerHeight - 8) y = e.clientY - tip.offsetHeight - 12;
    tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
  }
  sec.addEventListener("mousemove", show);
  sec.addEventListener("mouseleave", function(){ tip.style.display = "none"; });
  sec.addEventListener("touchstart", function(e){ if (e.touches[0]) show({target: e.target, clientX: e.touches[0].clientX, clientY: e.touches[0].clientY}); }, {passive: true});
  if (!TQ.wired){ TQ.wired = true;
    window.addEventListener("scroll", function(){ var t = $(".tqtip"); if (t) t.style.display = "none"; }, {passive: true}); }
}
function tqSection(v){
  var sec = el("section", "tq"); sec.id = "sec-technique";

/* Every jump target except Top sits below the wall, and the wall grows as you scroll, so a plain
   scrollIntoView landed short (the target moved down as tiles appended under it). Render the whole
   wall first, wait for layout, then scroll with the sticky header's height taken off. Instant, not
   smooth: a smooth scroll over 2,500 tiles would start every image on the way. */
function jumpTo(id){
  var after = function(f){ if (id !== "sec-top" && WALLCTL) WALLCTL.end(f); else f(); };
  after(function(){ requestAnimationFrame(function(){ requestAnimationFrame(function(){
    if (id === "sec-top"){ window.scrollTo(0, 0); return; }
    if (id === "sec-bottom"){ window.scrollTo(0, document.documentElement.scrollHeight); return; }
    var t = document.getElementById(id); if (!t) return;
    if (t.tagName === "DETAILS") t.open = true;
    var off = ($("header") ? $("header").offsetHeight : 0) + 8;
    window.scrollTo(0, t.getBoundingClientRect().top + window.scrollY - off);
  }); }); });
}

/* Each tab's payload is downloaded once and kept. The first tab loads as before, and the
   other two follow in the background as soon as it is on screen. Switching tabs then
   renders from memory instead of showing "Loading…" while the same JSON downloads
   again. Rendering never mutates a payload beyond the idempotent threshold default, so a
   kept one renders again as-is. */
var READY = {}, PENDING = {};
function fetchTab(tab){
  if (READY[tab]) return Promise.resolve(READY[tab]);
  if (!PENDING[tab]) PENDING[tab] = fetch("/wall/" + tab + ".json").then(function(r){
    if (!r.ok) throw new Error("no data for this tab yet (HTTP " + r.status + ")");
    return r.json();
  }).then(function(d){ READY[tab] = d; delete PENDING[tab]; return d; },
          function(e){ delete PENDING[tab]; throw e; });
  return PENDING[tab];
}

function load(tab){
  if (typeof FAB !== "undefined") FAB.classList.remove("on");
  ACTIVE = null;
  if (TAB && TAB !== tab) window.scrollTo(0, 0);
  window.GRID_END = null;
  TAB = tab; FILTER = "all"; DOC = null; Q = ""; SHOWN = STEP;
  ["llmocr","superatoms","images","pdfs"].forEach(function(t){
    $("#tab-" + t).setAttribute("aria-selected", tab === t); });
  showTab($("#tab-" + tab));
  if (!READY[tab]) $("#view").innerHTML = '<div class="sub" style="padding:40px 0">Loading…</div>';
  fetchTab(tab).then(function(d){
    if (TAB !== tab) return;          // the user moved to another tab while this downloaded
    DATA = d; DATA.threshold = d.threshold || 84; render();
    history.replaceState(null, "", "?tab=" + tab);
  }).catch(function(e){
    if (TAB !== tab) return;
    DATA = {error: "This tab has no results yet — " + e.message, rows: [], stats: {}};
    render();
  });
}

$("#tab-pdfs").onclick = function(){ load("pdfs"); };
$("#tab-llmocr").onclick = function(){ load("llmocr"); };
$("#tab-superatoms").onclick = function(){ load("superatoms"); };
/* On a phone the tab strip scrolls; keep the active tab in view and drop the edge fade
   once the strip is scrolled to its end. */
function showTab(b){
  var seg = b && b.parentNode; if (!seg || seg.scrollWidth <= seg.clientWidth) return;
  var l = b.offsetLeft - seg.offsetLeft, r = l + b.offsetWidth;
  if (l < seg.scrollLeft || r > seg.scrollLeft + seg.clientWidth)
    seg.scrollLeft = Math.max(0, r - seg.clientWidth + 24);
  segEnd();
}
function segEnd(){ var seg = $(".seg");
  seg.classList.toggle("at-end", seg.scrollLeft + seg.clientWidth >= seg.scrollWidth - 2); }
$(".seg").addEventListener("scroll", segEnd, {passive: true});
window.addEventListener("resize", segEnd);
$("#tab-images").onclick = function(){ load("images"); };
/* Sticky rows sit under the header; its height differs by width (63px desktop, 69px phone). */
var HH = 57;
function setHH(){ var h = $("header"); if (h){ HH = h.offsetHeight; document.documentElement.style.setProperty("--hh", HH + "px"); } }
setHH(); window.addEventListener("resize", setHH);
$("#try").onclick = function(){ location.href = "/upload"; };
$("#sheet").onclick = function(e){ if (e.target.id === "sheet") $("#sheet").close(); };
/* Every tab opens the same #sheet, so its behaviour lives here once.
   Scroll lock: iOS Safari scrolls the page behind a modal dialog unless the body is pinned. Pin it at
   the current offset on open, put the page back where it was on close. */
(function(){
  var dlg = $("#sheet"), show = dlg.showModal.bind(dlg), y = 0, b = document.body;
  dlg.showModal = function(){
    if (!dlg.open){
      y = window.scrollY;
      b.style.position = "fixed"; b.style.top = -y + "px"; b.style.left = "0"; b.style.right = "0"; b.style.width = "100%";
    }
    /* Only the title and the close button stay pinned; badges and the document line scroll with the body. */
    var meta = $("#sheetHead .meta");
    if (meta){ meta.classList.add("smeta"); $("#sheetBody").insertBefore(meta, $("#sheetBody").firstChild); }
    show();
    $("#sheetBody").scrollTop = 0;
    clampLong();
  };
  dlg.addEventListener("close", function(){
    b.style.position = b.style.top = b.style.left = b.style.right = b.style.width = "";
    window.scrollTo(0, y);
  });
  /* A very long string (a 6,000-character CXSMILES) is clamped to a few lines with a "Show all". Runs on
     open and whenever a sheet fills in later (the LLM vs OCR sheet loads its answers after opening). */
  function clampLong(){
    [].forEach.call($("#sheetBody").querySelectorAll("code"), function(c){
      if (c.dataset.cl) return;
      var txt = c.textContent || "";
      /* A note written in a code box ("$0.010 / image · ~4s ...") is prose: break it at spaces. */
      if ((txt.match(/ /g) || []).length >= 3){ c.dataset.cl = "1"; c.classList.add("prose"); return; }
      if (txt.length < 400) return;
      c.dataset.cl = "1"; c.classList.add("clamp");
      var m = el("button", "moreb", "Show all " + c.textContent.length.toLocaleString("en-US") + " characters");
      m.onclick = function(){ var on = c.classList.toggle("clamp"); m.textContent = on
        ? "Show all " + c.textContent.length.toLocaleString("en-US") + " characters" : "Show less"; };
      c.insertAdjacentElement("afterend", m);
    });
  }
  new MutationObserver(function(){ if (dlg.open) clampLong(); }).observe($("#sheetBody"), {childList: true, subtree: true});
})();
/* The loupe is triggered by the contextmenu event on iOS, not by selection alone,
   so the CSS above is necessary and not sufficient. Allowed on the strings. */
document.addEventListener("contextmenu", function(e){
  if (!e.target.closest("code, input, textarea")) e.preventDefault();
});
document.addEventListener("selectstart", function(e){
  if (!e.target.closest("code, input, textarea")) e.preventDefault();
});
/* LLM vs OCR is the default tab. Any other ?tab= value, including the retired
   sonnet / sonnet55 / sonnet55api tabs, lands on it. */
/* The first data fetch waits for window load: iOS Safari's progress bar waits on
   every request begun before it. */
function start(){ var t = new URLSearchParams(location.search).get("tab");
  var first = t === "images" || t === "pdfs" || t === "superatoms" ? t : "llmocr";
  load(first);
  var warm = function(){ ["llmocr","superatoms","images","pdfs"].forEach(function(x){
    if (x !== first) fetchTab(x).catch(function(){}); }); };
  fetchTab(first).then(warm, warm); }
if (document.readyState === "complete") start(); else window.addEventListener("load", start, {once: true});
</script>
