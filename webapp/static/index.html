<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C-MAGE benchmark</title>
<link rel="icon" href="/static/favicon.png">
<style>
html,body{-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
/* The iOS magnifier loupe fires on long-press over any selectable text and makes
   a dense tile grid unusable. Killed globally, then given back to the SMILES and
   InChI strings -- which are the whole reason a chemist opens the sheet, and the
   one thing they will want to select by hand rather than via Copy. */
body{user-select:none;-webkit-user-select:none}
.kv code,.note code,input,textarea{user-select:text;-webkit-user-select:text;
  -webkit-touch-callout:default}
:root{
  --bg:#0d1117; --panel:#161b22; --line:#26303d; --ink:#e6edf3; --dim:#8b98a5;
  --exact:#2ea043; --stereo:#d29922; --wrong:#da3633; --invalid:#6e7681; --acc:#388bfd;
  --tile:104px;
}
/* Kills the 300ms double-tap-to-zoom delay AND the zoom itself. On a grid of
   1,700 small tiles a stray second tap otherwise zooms the page instead of
   opening the next molecule. */
*{box-sizing:border-box;touch-action:manipulation}
/* A SMILES string is 200 characters with no space in it, which is exactly the
   input that pushes a grid child past its track and clips whatever sits beside
   it. Flex and grid children default to min-width:auto, i.e. "never shrink below
   my content"; these override that. */
.hrow>*,.wall>*,.pics>*,.doc>*,.shead>*{min-width:0}
/* NOT .bar>*. The filter bar is a horizontally SCROLLING strip, and min-width:0
   there lets every chip shrink to zero so they stack on top of one another --
   which is exactly what it did on a real phone. Children of a scroll strip must
   keep their natural width and let the container scroll; children of a grid track
   must shrink so they do not clip a neighbour. The two rules are opposites and
   applying one blanket rule to both broke the visible one. */
.bar>*{flex:0 0 auto}
.bar input[type=search]{flex:0 0 180px}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
a{color:var(--acc)}
header{position:sticky;top:0;z-index:20;background:rgba(13,17,23,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:12px;max-width:1400px;margin:0 auto;
  padding:6px calc(14px + env(safe-area-inset-right)) 6px calc(14px + env(safe-area-inset-left));
  padding-top:calc(6px + env(safe-area-inset-top))}
.brand{font-weight:700;letter-spacing:.3px;font-size:16px;white-space:nowrap}
.brand span{color:var(--dim);font-weight:400;font-size:13px}
.seg{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:2px;margin-left:auto}
.seg button{appearance:none;background:none;border:0;color:var(--dim);font:inherit;
  font-size:14px;padding:7px 13px;border-radius:6px;cursor:pointer;min-height:44px;
  white-space:nowrap}
/* #1f6feb, not the accent #388bfd: white 14px text on the accent is 3.3:1 and fails AA;
   on #1f6feb it is 4.6:1. */
.seg button[aria-selected=true]{background:#1f6feb;color:#fff;font-weight:600}
/* The Sonnet compare page is its own URL, so its tab is a link styled as a tab. */
.seg a.segl{color:var(--dim);font-size:14px;padding:0 13px;border-radius:6px;min-height:44px;
  display:flex;align-items:center;white-space:nowrap;text-decoration:none}
.seg a.segl:hover{color:var(--ink)}
.ghost{appearance:none;background:none;border:1px solid var(--line);color:var(--ink);
  font:inherit;font-size:13px;padding:8px 12px;border-radius:7px;cursor:pointer;min-height:44px}
main{max-width:1400px;margin:0 auto;
  padding:0 calc(14px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom))
          calc(14px + env(safe-area-inset-left))}

/* hero */
.hero{padding:22px 0 14px;border-bottom:1px solid var(--line)}
/* Two readers, one denominator, at the SAME type size. A single big percentage
   with the other score in prose beneath reads as a headline plus a footnote; the
   point of this tab is that the two numbers are directly comparable. */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.cmp.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.cmp .side{background:var(--panel);border:1px solid var(--line);padding:13px 14px;min-width:0}
.cmp .who{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.6px;
  margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp .pc{font-size:34px;font-weight:800;line-height:1;letter-spacing:-1px}
.cmp .of{color:var(--dim);font-size:12px;margin-top:5px}
.cmp .track{height:7px;background:#0b0f14;margin-top:9px;overflow:hidden}
.cmp .track i{display:block;height:100%;background:var(--acc)}
.cmp .side.lead .track i{background:var(--exact)}
/* Four outcomes, one stacked bar. "Sonnet was wrong" and "Sonnet was wrong where
   the pipeline was right" are different facts and only the second is interesting
   here, so the tile colour and the bar both key on the OUTCOME, not on either
   reader's verdict alone. */
.stack{display:flex;height:26px;overflow:hidden;margin:2px 0 9px;background:var(--panel);
  border:1px solid var(--line)}
.stack i{display:block;height:100%;position:relative;min-width:2px}
.stack i span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:#06090d}
/* Dark ink on the red segment is 4.33:1; white is 4.6:1. */
.stack i.o-neither span,.stack i.o-misread span{color:#fff}
/* Five states, three populations. Green and amber are CHECKED AND RIGHT, red is
   CHECKED AND WRONG, slate is NOT CHECKABLE, dark is NOTHING CAME OUT. The slate
   is deliberately not a warning colour: those structures are neither right nor
   wrong and colouring them red was the whole confusion. */
.o-matched{background:var(--exact)} .o-stereo{background:var(--stereo)}
.o-misread{background:var(--wrong)} .o-noref{background:#475569}
.o-unreadable{background:#1f242b;box-shadow:inset 0 0 0 1px #333b45}
.t.o-matched::after{background:var(--exact)} .t.o-stereo::after{background:var(--stereo)}
.t.o-misread::after{background:var(--wrong)} .t.o-noref::after{background:#475569}
.t.o-unreadable::after{background:#333b45}
/* One labelled bar per secondary measure, so a number and what it is are never
   more than a line apart. */
.mbar{margin-bottom:11px}
.mbar .lbl{display:flex;justify-content:space-between;gap:6px 10px;color:var(--dim);
  font-size:12.5px;margin-bottom:4px;flex-wrap:wrap}
.mbar .lbl>span{min-width:0}
/* nowrap on the VALUE only. A long label plus a nowrap value on one flex line
   cannot fit 320px, and the pair pushed the whole document 54px wide. The label
   wraps; the number never splits across lines. */
.mbar .lbl b{color:var(--ink);font-weight:700;white-space:nowrap;margin-left:auto}
.mbar .track{height:9px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.mbar .track i{display:block;height:100%;background:var(--acc);min-width:2px}
.mbar.good .track i{background:var(--exact)}
.o-both{background:var(--exact)} .o-sonnet{background:var(--acc)}
.o-cxms{background:var(--stereo)} .o-neither{background:var(--wrong)}
.key{display:flex;flex-wrap:wrap;gap:8px 14px;margin-bottom:14px}
.key b{display:flex;align-items:center;gap:6px;font-weight:400;color:var(--dim);font-size:12.5px}
.key b i{width:10px;height:10px;display:block}
.key b u{text-decoration:none;color:var(--ink);font-weight:700}
.t.o-both::after{background:var(--exact)} .t.o-sonnet::after{background:var(--acc)}
.t.o-cxms::after{background:var(--stereo)} .t.o-neither::after{background:var(--wrong)}
.prog{margin:0 0 14px}
.prog .lbl{display:flex;justify-content:space-between;gap:8px;color:var(--dim);
  font-size:12.5px;margin-bottom:5px}
.prog .track{height:8px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.prog .track i{display:block;height:100%;background:var(--acc);min-width:2px}
.pre{background:#0b0f14;border:1px solid var(--line);padding:12px;margin-top:10px;
  font:12px/1.55 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;
  color:var(--dim);user-select:text;-webkit-user-select:text;max-height:52vh;overflow-y:auto}
.big{font-size:52px;font-weight:800;line-height:1;letter-spacing:-1.5px}
.big small{font-size:17px;font-weight:500;color:var(--dim);letter-spacing:0;margin-left:8px}
.sub{color:var(--dim);font-size:14px;margin-top:8px}
.noteh{font-weight:700;font-size:12.5px;color:var(--ink);margin:12px 0 4px;
  text-transform:uppercase;letter-spacing:.5px}
.notelist{margin:0 0 4px 18px;padding:0}
.notelist li{font-size:12.5px;color:var(--dim);line-height:1.5;margin:3px 0}
/* Sticky jump bar so the lower sections are reachable without scrolling the wall. */
.jump{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  background:var(--bg);border-bottom:1px solid var(--line);padding:8px 0;margin-bottom:4px}
.jump .jlbl{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.jump button{appearance:none;background:var(--panel);border:1px solid var(--line);color:var(--ink);
  font:inherit;font-size:12.5px;padding:6px 11px;border-radius:999px;cursor:pointer;white-space:nowrap;min-height:44px}
.jump button:hover{border-color:var(--dim)}
.block{margin:26px 0 8px;border-top:1px solid var(--line);padding-top:18px}
.blockh{font-size:16px;font-weight:750;margin:0 0 8px}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:10px}
.excard{min-width:0;text-align:left;background:var(--panel);border:1px solid var(--line);
  border-left:3px solid var(--dim);border-radius:10px;padding:12px;cursor:pointer;color:var(--ink);font:inherit}
.excard.ok{border-left-color:#3fb950} .excard.miss{border-left-color:#d29922}
.excard:hover{border-color:var(--dim)}
.extag{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);margin-bottom:4px}
.extag.ok{color:#3fb950} .extag.miss{color:#d29922}
.extitle{font-weight:700;font-size:13.5px;margin-bottom:5px;line-height:1.3}
.exbody{font-size:12.5px;color:var(--dim);line-height:1.5}
.takeaway{background:var(--panel);border:1px solid var(--line);border-left:3px solid #d29922;
  border-radius:8px;padding:11px 13px;margin:10px 0;font-size:13.5px;line-height:1.5;color:var(--ink)}
.clswrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-top:12px}
.cls{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.clsh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:7px}
.clslab{font-size:12.5px;font-weight:650;color:var(--ink);min-width:0}
.clsn{color:var(--dim);font-weight:500;font-size:12px}
.clschip{flex:0 0 auto;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.clschip.s{background:rgba(63,185,80,.16);color:#3fb950}
.clschip.c{background:rgba(88,166,255,.16);color:#58a6ff}
.clschip.t{background:#1b222c;color:var(--dim)}
.clsbar{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12px;color:var(--dim)}
.cll{flex:0 0 84px}
.ctrack{flex:1 1 auto;min-width:0;height:7px;background:#0b0f14;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.ctrack i{display:block;height:100%}
.ctrack i.s{background:#3fb950} .ctrack i.c{background:#58a6ff}
.clsbar b{flex:0 0 36px;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.sub b{color:var(--ink);font-weight:600}
.xlink{display:block;margin-top:12px;background:var(--panel);border:1px solid var(--line);
  border-left:3px solid var(--acc);padding:11px 13px;min-height:44px;color:var(--dim);
  font-size:13.5px;line-height:1.45;text-decoration:none}
.xlink b{color:#58a6ff;font-weight:650}
.xlink:hover{border-color:var(--dim)}

/* filters */
.bar{display:flex;gap:7px;overflow-x:auto;padding:12px 0;position:sticky;top:57px;z-index:10;
  background:var(--bg);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.bar::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;background:var(--panel);border:1px solid var(--line);color:var(--dim);
  font:inherit;font-size:13px;padding:7px 12px;border-radius:20px;cursor:pointer;min-height:44px}
.chip[aria-pressed=true]{border-color:var(--acc);color:var(--ink);background:#12233c}
/* The count is dimmed by COLOUR, not opacity: opacity .65 over the chip put it at 3.25:1. */
.chip i{font-style:normal;color:var(--dim);margin-left:5px}
.chipdiv{flex:0 0 1px;align-self:stretch;background:var(--line);margin:0 4px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
input[type=search]{flex:0 0 190px;background:var(--panel);border:1px solid var(--line);
  color:var(--ink);font:inherit;font-size:16px;padding:6px 13px;border-radius:20px;
  min-height:44px;min-width:0}

/* the wall */
.wall{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(var(--tile),1fr));
  padding-top:4px}
.t{position:relative;background:#fff;overflow:hidden;cursor:pointer;
  border:0;padding:0;display:block;aspect-ratio:1;
  content-visibility:auto;contain-intrinsic-size:var(--tile)}
.t img{width:100%;height:100%;object-fit:contain;display:block}
.t::after{content:"";position:absolute;inset:auto 0 0 0;height:4px;background:var(--invalid)}
.t.o-exact::after{background:var(--exact)} .t.o-stereo::after{background:var(--stereo)}
.t.o-wrong::after{background:var(--wrong)} .t.o-invalid::after{background:var(--invalid)}
.t b{position:absolute;top:0;right:0;background:rgba(13,17,23,.88);color:#fff;
  font-size:12px;font-weight:600;padding:1px 5px}
.t em{position:absolute;top:0;left:0;background:rgba(13,17,23,.88);color:#fff;
  font-size:12px;font-style:normal;font-weight:600;padding:1px 5px}
.t u{position:absolute;left:0;right:0;bottom:4px;background:rgba(13,17,23,.82);color:#fff;
  font-size:12px;text-decoration:none;padding:1px 4px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;display:block}
.more{grid-column:1/-1;text-align:center;color:var(--dim);padding:18px;font-size:13px}

/* detail sheet */
/* display MUST NOT be set on the bare `dialog` selector. The UA stylesheet hides a
   closed dialog with `dialog:not([open]){display:none}`, but author styles beat the
   UA stylesheet regardless of specificity -- so `dialog{display:flex}` un-hid every
   closed dialog and it rendered inline at the foot of the page. Scope it to [open]
   and restate the closed case explicitly rather than relying on the UA rule. */
dialog{border:0;padding:0;background:var(--panel);color:var(--ink);border-radius:4px;
  max-width:620px;width:calc(100% - 24px);max-height:86dvh;overflow:hidden}
dialog:not([open]){display:none}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:rgba(0,0,0,.72)}
/* Header stays put. The molecule's name and its verdict are the two things you
   opened this for; scrolled off the top they are worse than absent, because the
   page looks like it is showing you something else. */
.shead{position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:1px solid var(--line);
  padding:12px 46px 10px 16px;flex:0 0 auto}
.shead h3{margin:0 0 5px;font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.shead .meta{color:var(--dim);font-size:12.5px}
.sclose{position:absolute;top:3px;right:3px;width:44px;height:44px;border:0;border-radius:3px;
  background:none;color:var(--dim);font-size:22px;line-height:1;cursor:pointer}
.sclose:hover{color:var(--ink);background:#0b0f14}
.sheet{padding:14px 16px calc(18px + env(safe-area-inset-bottom));overflow-y:auto;
  -webkit-overflow-scrolling:touch;flex:1 1 auto}
/* Two pictures side by side at EVERY width. They are square and the comparison
   is the point -- stacked, the second one is below the fold and the reader has to
   remember the first. */
.pics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.pics3{grid-template-columns:repeat(3,1fr)}
.pics1{grid-template-columns:1fr}
.pics figure{margin:0;background:#fff;overflow:hidden}
.pics img{width:100%;display:block;max-height:34dvh;object-fit:contain}
.pics figcaption{background:var(--panel);color:var(--dim);font-size:12px;padding:4px 6px;text-align:center}
.kv{margin-bottom:11px}
.kv label{display:block;color:var(--dim);font-size:12px;text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:4px}
.kv code{display:block;background:#0b0f14;border:1px solid var(--line);border-radius:6px;
  padding:9px 10px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
  word-break:break-all;user-select:text;-webkit-user-select:text}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;
  text-transform:uppercase;letter-spacing:.4px}
.badge.exact{background:#0f3d20;color:#4ade80} .badge.stereo{background:#3d3010;color:#fbbf24}
.note{background:#0b0f14;border:1px solid var(--line);border-left:3px solid var(--acc);
  padding:10px 12px;margin:12px 0;font-size:13px;color:var(--dim);line-height:1.45}
.note b{color:var(--ink)}
.note code{display:block;margin-top:7px;background:none;border:0;padding:0;
  font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--ink);word-break:break-all;
  user-select:text;-webkit-user-select:text}
.badge.matched{background:#0f3d20;color:#4ade80}
.badge.misread{background:#4a1513;color:#f87171}
.badge.noref{background:#2a323d;color:#cbd5e1}
.badge.unreadable{background:#1b1f25;color:var(--dim)}
.cxnote{margin:7px 0 0;font-size:12px;line-height:1.5;color:var(--dim)}
.cxnote code{display:inline;background:#161b22;border:0;padding:1px 4px;font-size:12px}
.cxnote b{color:var(--ink);font-family:ui-monospace,Menlo,monospace;font-size:12px}
.kv label .dim{color:var(--dim);text-transform:none;letter-spacing:0;font-weight:400}
.meta .badge{margin-right:6px;margin-bottom:4px;display:inline-block}
.badge.wrong{background:#4a1513;color:#f87171} .badge.invalid{background:#21262d;color:var(--dim)}

/* docs strip + arms */
.docs{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:8px;overflow:hidden;margin:8px 0 4px}
.doc{display:flex;align-items:center;gap:10px;background:var(--panel);padding:9px 12px;
  cursor:pointer;font-size:13px;border:0;color:var(--ink);text-align:left;width:100%;min-height:44px}
.doc[aria-pressed=true]{background:#12233c}
.doc .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc .rb{flex:0 0 74px;height:5px;background:#21262d;border-radius:3px;overflow:hidden}
.doc .rb i{display:block;height:100%;background:var(--exact)}
.doc .n{flex:0 0 58px;text-align:right;color:var(--dim);font-size:12px;
  font-variant-numeric:tabular-nums}
details{margin-top:34px;border-top:1px solid var(--line);padding-top:14px}
details.docsfold{margin-top:14px;border-top:0;padding-top:0}
details.docsfold .docs{max-height:60vh;overflow-y:auto}
details.docsfold summary{color:var(--acc)}
summary{cursor:pointer;color:var(--dim);font-size:14px;padding:8px 0;min-height:44px;display:flex;align-items:center}
/* A fold inside a section: the long version of a note, one tap away, without the section-level rule. */
details.fold{margin-top:8px;border-top:0;padding-top:0}
details.fold>summary{color:var(--acc);font-size:13.5px;list-style:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"\25B8";display:inline-block;width:1.1em;color:var(--dim);transition:transform .15s}
details.fold[open]>summary::before{transform:rotate(90deg)}
table{border-collapse:collapse;width:100%;font-size:12.5px;margin-top:10px;display:block;
  overflow-x:auto;white-space:nowrap}
th,td{text-align:left;padding:7px 11px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:600}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tr.lead td{background:#12233c}
footer{color:var(--dim);font-size:12px;padding:26px 0 0;border-top:1px solid var(--line);margin-top:30px}
.err{background:#4a1513;color:#f87171;padding:12px 14px;border-radius:8px;margin:16px 0}
/* "How the readers work" (Sonnet 5.5 tab, wall/technique.json). Seven technique hues, the
   validated dark categorical order (validate_palette.js --mode dark on #0d1117: all checks
   pass), plus neutral grey for "other". Models are the page's own identity: 5.5 in the accent,
   Sonnet 5 in the dim grey, so the subject of the tab is the coloured one. */
.vtog{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:2px;margin:12px 0 4px}
.vtog button{flex:1 1 0;appearance:none;background:none;border:0;color:var(--dim);font:inherit;font-size:14px;
  padding:8px 10px;border-radius:6px;cursor:pointer;min-height:44px}
.vtog button[aria-pressed=true]{background:#1f6feb;color:#fff;font-weight:600}
.tq .blockh{margin-top:14px}
.tq{--k-read:#3987e5;--k-crop:#d95926;--k-rdkit:#199e70;--k-draw:#c98500;--k-osra:#d55181;

<dialog id="sheet">
  <div class="shead" id="sheetHead"></div>
  <div class="sheet" id="sheetBody"></div>
</dialog>

<script>
"use strict";
var TAB = "pdfs", DATA = {}, FILTER = "all", DOC = null, SHOWN = 0, STEP = 300, Q = "";
var VERDICTS = [["all","All"],["exact","Exact"],["stereo","Stereo only"],
                ["wrong","Wrong"],["invalid","Unparseable"],["high","High confidence"]];
/* The Sonnet tab filters by who got it right, not by Sonnet's verdict -- the
   interesting subsets are "only one of them managed it". */
var OUTCOMES = [["all","All"],["both","Both right"],["sonnet","Sonnet only"],
                ["cxms","CXMolScribe only"],["neither","Neither"]];
var $ = function(s){ return document.querySelector(s); };
function el(tag, cls, txt){ var n=document.createElement(tag); if(cls)n.className=cls;
  if(txt!=null)n.textContent=txt; return n; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

/* A tile's colour is its verdict. `exact` and `stereo` are the two that mean the
   reader got the right molecule; everything else is a miss of some kind. */
/* One place that turns a scored verdict into a display state, so the tiles, the
   chips and the stacked bar cannot drift apart the way they did. */
var STATE = {exact:"matched", stereo:"stereo", misread:"misread", wrong:"misread",
             unmatched:"noref", "no-truth":"noref", invalid:"unreadable"};
/* Anything unrecognised used to fall through to "invalid", which quietly counted
   1,026 no-ground-truth rows as Unparseable in the chips while the legend beside
   them said 231. An unknown verdict gets its own bucket now instead of borrowing
   somebody else's. */
function cls(r){ return STATE[r.v] || "noref"; }
/* On the Sonnet tab a tile is coloured by WHO got it right, which is the question
   the tab exists to answer. Everywhere else it falls back to the verdict. */
function tileCls(r){ return r.o ? "o-" + r.o : "o-" + cls(r); }

function match(r){
  if (DOC && r.d !== DOC) return false;
  if (Q && (r.n||"").toLowerCase().indexOf(Q) < 0) return false;
  if (FILTER === "all") return true;
  if (FILTER === "high") return (r.c||0) >= DATA.threshold;
  if (FILTER === "cx") return !!r.cx;
  if (r.o) return r.o === FILTER;
  return cls(r) === FILTER;
}

function counts(rows){
  /* Buckets are seeded from the payload's own breakdown rather than a hard-coded
     list. The hard-coded list is exactly what broke when the state names changed:
     cls() returned "matched" while the counter only knew "exact", so every chip
     read undefined and the whole bar disappeared except All. */
  var c = {all: rows.length, high: 0};
  ((DATA.breakdown || []).concat(
    (DATA.compare && DATA.compare.breakdown) || [])).forEach(function(x){ c[x.key] = 0; });
  rows.forEach(function(r){
    var k = r.o || cls(r);
    c[k] = (c[k] || 0) + 1;
    if ((r.c || 0) >= DATA.threshold) c.high++;
  });
  return c;
}

/* Prefetch the read-back drawing the moment its tile's own thumbnail has landed.
   Without this the detail sheet opens on a blank frame and fills in afterwards,
   because the sheet is the FIRST time that URL is requested. Keyed to the tile's
   load event rather than page load, so it stays bounded to tiles that actually
   rendered. */
function prefetchPred(r){
  if ((!r.p && !r.po) || r._pf) return;
  r._pf = true;
  var i = new Image();
  i.decoding = "async";
  i.src = "/wall/" + DATA.dir + "_pred/" + encodeURIComponent(r.k) + ".png";
  if (r.po) { var j = new Image(); j.decoding = "async";
    j.src = "/wall/" + DATA.dir + "_ocr/" + encodeURIComponent(r.k) + ".png"; }
}

function tile(r){
  var b = el("button", "t " + tileCls(r));
  b.innerHTML = '<img loading="lazy" decoding="async" src="/wall/' + DATA.dir + '/'
    + encodeURIComponent(r.k) + '.png" alt="">'
    + (r.c != null ? "<b>" + r.c + "</b>" : "")
    + (r.dup > 1 ? '<em>&times;' + r.dup + '</em>' : "")
    + "<u>" + esc(r.n) + "</u>";
  var im = b.firstChild;
  if (im.complete) prefetchPred(r);
  else im.addEventListener("load", function(){ prefetchPred(r); }, {once: true});
  b.onclick = function(){ openSheet(r); };
  return b;
}

/* Say what RDKit actually found, per row, rather than leaving the reader to diff
   two strings. The three cases are genuinely different and must not share wording:
   an exact match really does canonicalise to ONE identical string; a close match
   never will, and only agrees once something is discarded; and that something is
   not always stereochemistry -- Acetone-D6 is graded the same way because the
   reference carries six deuteriums and the reader saw three. */
/* CXSMILES is the whole reason this fork exists, and it was being printed
   unlabelled. `Chem.MolToSmiles` silently drops the |$...$| block; CXMolScribe
   calls MolToCXSmiles and keeps it, which is what preserves an abbreviation the
   drawing spelled as text. Shown without a name it reads as line noise. */
function cxLabels(sm){
  var m = /\|\$(.*?)\$\|/.exec(sm || "");
  if (!m) return null;
  var seen = {}, out = [];
  m[1].split(";").forEach(function(x){
    x = x.trim();
    if (x && !seen[x]) { seen[x] = 1; out.push(x); }
  });
  return out;
}

function smilesField(label, sm, extra){
  var labs = cxLabels(sm);
  return '<div class="kv"><label>' + esc(label)
    + (labs ? ' <span class="dim">&mdash; CXSMILES</span>' : '')
    + (extra || '') + '</label><code>' + esc(sm) + '</code>'
    /* `*` in that block is an attachment point, not something the drawing spelled
       out. Listing it beside a real abbreviation implies the reader saw a glyph
       that was never there. */
    + (function(){
        if (!labs) return '';
        var real = labs.filter(function(x){ return x !== '*'; });
        var star = labs.length !== real.length;
        if (!real.length && !star) return '';
        return '<p class="cxnote">The <code>|$…$|</code> block is the CXSMILES extension, '
          + 'which plain SMILES drops silently. '
          + (real.length
              ? 'Abbreviation' + (real.length > 1 ? 's' : '') + ' the drawing spelled out as '
                + 'text rather than as structure, kept verbatim: <b>'
                + real.map(esc).join('</b>, <b>') + '</b>. '
              : '')
          + (star ? 'The <code>*</code> entries are attachment points, not labels.' : '')
          + '</p>';
      })()
    + '</div>';
}

function verdictNote(r){
  var x = r.r;
  if (!x) return "";
  if (x.how === "identical")
    return '<div class="note"><b>RDKit: identical.</b> Both strings parse to the same '
      + 'molecule and the same canonical form — they are two ways of writing it.'
      + '<code>' + esc(x.canon) + '</code></div>';
  if (x.how === "different") return "";
  var bits = [];
  if (x.stereo) bits.push(x.stereo[0] + " of " + x.stereo[1] + " stereocentre"
    + (x.stereo[1] === 1 ? "" : "s") + " disagree");
  if (x.geom) bits.push(x.geom + " double-bond geometr" + (x.geom === 1 ? "y" : "ies") + " disagree");
  if (x.iso) bits.push("isotope labels differ — " + x.iso[0] + " read against " + x.iso[1] + " expected");
  return '<div class="note"><b>RDKit: same skeleton, not the same molecule.</b> '
    + (bits.length ? bits.join("; ") + "." : "They differ only in stereochemistry.")
    + ' Identical once that is discarded:<code>' + esc(x.canon || "") + '</code></div>';
}

function fmtdur(s){ s = Math.round(s || 0);
  if (s < 60) return s + "s";
  var m = Math.floor(s / 60), ss = s % 60;
  if (m < 60) return ss ? m + "m " + ss + "s" : m + "m";
  return Math.floor(m / 60) + "h " + (m % 60) + "m"; }
function openSheet(r){
  var v = cls(r);
  var VERD = {matched:"matched the reference", stereo:"matched, stereochemistry differs",
              misread:"a reference exists and this is not it",
              noref:"no reference to check against", unreadable:"nothing usable produced"};
  /* Name the reader on every single line. "PREDICTED" and "EXPECTED" do not say
     WHOSE, and on a tab that shows two readers side by side that is the one thing
     the labels have to carry. */
  var twoReaders = !!r.ocr;
  var meLabel = twoReaders ? (DATA.reader || "Sonnet") : "CXMolScribe";
  var s5State = r.s5 ? ({exact:"matched", stereo:"stereo", invalid:"unreadable"}[r.s5.v] || "misread") : null;
  var ocrState = r.ocrv === "exact" ? "matched" : r.ocrv === "stereo" ? "stereo"
               : r.ocrv === "invalid" ? "unreadable" : "misread";
  function badge(who, state){
    return '<span class="badge ' + state + '">' + esc(who) + ' &middot; '
      + esc(VERD[state] || state) + '</span>';
  }
  $("#sheetHead").innerHTML =
      '<button class="sclose" aria-label="Close" onclick="document.getElementById(\'sheet\').close()">&times;</button>'
    + '<h3>' + esc(r.n) + '</h3>'
    + '<div class="meta">' + badge(meLabel, v)
    + (twoReaders ? " " + badge("CXMolScribe", ocrState) : "")
    + (s5State ? " " + badge("Sonnet 5", s5State) : "")
    + (r.d ? '<div style="margin-top:6px">' + esc(r.d)
        + (r.dup > 1 ? ' &middot; drawn ' + r.dup + ' times in this document' : '') + '</div>' : '')
    + '</div>';

  var pics = '<figure><img decoding="sync" src="/wall/' + DATA.dir + '/'
    + encodeURIComponent(r.k) + '.png" alt=""><figcaption>Input</figcaption></figure>'
    + (r.p ? '<figure><img decoding="sync" src="/wall/' + DATA.dir + '_pred/'
      + encodeURIComponent(r.k) + '.png" alt=""><figcaption>' + esc(meLabel)
      + ' read</figcaption></figure>' : '')
    + (r.po ? '<figure><img decoding="sync" src="/wall/' + DATA.dir + '_ocr/'
      + encodeURIComponent(r.k) + '.png" alt=""><figcaption>CXMolScribe read'
      + '</figcaption></figure>' : '');
  var npics = (pics.match(/<figure/g) || []).length;

  /* Confidence belongs to whoever produced it, and the two are not the same kind
     of thing: CXMolScribe emits a calibrated score, Sonnet states a self-rating.
     "model said high" said neither whose nor which. */
  /* On the Sonnet tab the pipeline's confidence lives in `ocrc`, because `c` is
     the row's own reader. Reading only `c` there left CXMolScribe's score off the
     one page built to compare the two. */
  var ocrConf = (r.ocrc != null ? r.ocrc : r.c);
  var conf = ocrConf != null ? ' <span class="dim">confidence ' + ocrConf + '%</span>' : '';
  var sconf = r.sconf ? ' <span class="dim">rated itself ' + esc(r.sconf) + '</span>' : '';

  $("#sheetBody").innerHTML =
      '<div class="pics pics' + npics + '">' + pics + '</div>'
    + smilesField(meLabel + " read", r.s || "(nothing emitted)",
                  twoReaders ? sconf : conf)
    + (r.ocr ? smilesField("CXMolScribe read", r.ocr, conf) : "")
    /* The 5.5 tab pairs every image with the Sonnet 5 arm's reading of the same drawing. */
    + (r.s5 ? smilesField("Sonnet 5 read (Sonnet 5 tab)", r.s5.s || "(nothing emitted)",
        r.s5.conf != null && r.s5.conf !== "" ? ' <span class="dim">rated itself ' + esc(r.s5.conf) + '</span>' : '') : "")
    + (r.t ? smilesField("Reference — what the ground truth says", r.t, "")
      : '<div class="kv"><label>Reference</label><code>none — nobody catalogued this '
        + 'structure, so neither reading can be called right or wrong</code></div>')
    + (r.rc != null ? '<div class="kv"><label>This run <span class="dim">' + esc(DATA.reader || "Sonnet") + ' API, at list price</span></label>'
        + '<code>$' + r.rc.toFixed(2) + ' / image · ~' + fmtdur(r.rt) + ' / image'
        + (r.bn === 1 ? '<br><span class="dim">read alone: one image per reader (single-image readers)</span>'
          : '<br><span class="dim">a batch of ' + r.bn + ' read in one shared context: $'
            + r.bc.toFixed(2) + ' · ' + fmtdur(r.bs) + '</span>') + '</code></div>' : '')
    + verdictNote(r)
    + '<button class="ghost" onclick="navigator.clipboard.writeText('
    + JSON.stringify(r.s || "") + ')">Copy ' + esc(meLabel) + '\u2019s reading</button>';
  $("#sheetBody").scrollTop = 0;
  $("#sheet").showModal();
}

function paint(){
  var rows = DATA.rows.filter(match);
  var wall = $("#wall");
  wall.innerHTML = "";
  var slice = rows.slice(0, SHOWN);
  var frag = document.createDocumentFragment();
  slice.forEach(function(r){ frag.appendChild(tile(r)); });
  wall.appendChild(frag);
  if (rows.length > SHOWN){
    var m = el("div", "more", rows.length - SHOWN + " more below — keep scrolling");
    wall.appendChild(m);
    io.observe(m);
  } else if (rows.length === 0){
    wall.appendChild(el("div", "more", "Nothing matches that filter."));
  }
  $("#count").textContent = rows.length + (rows.length === 1 ? " structure" : " structures");
}

/* Continuous scroll: tiles are appended as the sentinel comes into view, so the
   reader never presses anything. There is no page size the reader can hit. */
var io = new IntersectionObserver(function(es){
  if (es.some(function(e){ return e.isIntersecting; })){ SHOWN += STEP; paint(); }
}, {rootMargin: "1200px"});

function chipbar(rows){
  var c = counts(rows), bar = el("div", "bar");
  /* Chips are built from the SAME breakdown that draws the stacked bar, so the
     two can never name different buckets or different totals. */
  /* Labels come from the payload's own breakdown, so the 5.5 tab says "Sonnet 5.5 only"
     where the Sonnet 5 tab says "Sonnet only". OUTCOMES is the fallback for an old payload. */
  var set = (DATA.compare && DATA.compare.breakdown) ? [["all","All"]].concat(
      DATA.compare.breakdown.map(function(x){ return [x.key, x.label]; }))
    : (DATA.breakdown ? [["all","All"]].concat(DATA.breakdown.map(function(x){
        return [x.key, x.label]; })) : VERDICTS);
  set.forEach(function(p){
    /* A chip reading "Stereo only 0" is a filter guaranteed to show nothing.
       Hide empty buckets, but never "All" and never the one currently selected,
       or the active filter vanishes from the bar you used to set it. */
    if (p[0] !== "all" && !c[p[0]] && FILTER !== p[0]) return;
    var b = el("button", "chip");
    var colour = {matched:"var(--exact)",stereo:"var(--stereo)",misread:"var(--wrong)",

                  sonnet:"var(--acc)",cxms:"var(--stereo)",neither:"var(--wrong)"}[p[0]];

     carries, not whether it was right. Separated by a rule so it does not read as

  if (DATA.cx) {

    }).join("") + '</div>'

    }).join("") + '</div>'

        ? '<p class="sub" style="margin:-4px 0 14px">Green and amber were checked '

      var tools = (r.used.crop_viewed ? "crop " : "") + (r.used.drawback_viewed ? "draw " : "") + (r.used.osra ? "osra" : "");
      var row = '<tr class="r" data-aid="' + r.aid + '" aria-expanded="' + (TQ.open === r.aid) + '">'
        + '<td><span class="mk ' + (m55 ? "m55" : "m5") + '"></span>' + r.aid.slice(0, 7)
        + ' <span class="tl">' + esc(TQ_LANE[r.lane] || r.lane) + (r.batch != null ? " · b" + r.batch : "") + '</span></td>'
        + '<td class="num">' + r.exact + '/' + r.n + '</td><td class="num">' + tqN(r.calls / r.n) + '</td>'
        + '<td class="num">' + tqN(r.crops / r.n) + '</td><td class="num hm">' + tqN(r.min / r.n) + '</td>'
        + '<td class="num hm">' + tqN(r.cost / r.n, 2) + '</td><td class="hm"><span class="tl">' + tools + '</span></td></tr>';
      if (TQ.open === r.aid) row += '<tr class="tlrow"><td colspan="7">' + tqTimeline(r) + '</td></tr>';
      return row;
    }).join("") + '</tbody>';
  more.innerHTML = rows.length > 25 ? '<button class="ghost tqmore" id="tqAll">' + (TQ.all ? "Show the first 25" : "Show all " + rows.length + " readers") + '</button>' : "";
}
function tqTimeline(r){
  var v = {}; r.img.forEach(function(x){ if (x[0]) v[x[0]] = x[1]; });
  var groups = [], cur = null;
  for (var i = 0; i < r.seq.length; i++){
    var im = r.si[i];
    if (!cur || cur.im !== im){ cur = {im: im, cells: []}; groups.push(cur); }
    var c = r.seq[i], g = TQ_G[c] || "other";
    cur.cells.push('<i class="kg-' + g + (c === "c" || c === "d" ? " v" : "") + '" style="--c:var(--k-' + g + ')" data-tip="'
      + esc("Step " + (i + 1) + " · " + TQ_K[c] + (im > 0 ? " · image " + im : im < 0 ? " · several images" : "")
      + " · " + tqMS(r.st[i]) + " in") + '"></i>');
  }
  var m55 = r.lane.indexOf("s55") === 0 || r.lane === "nov";
  return '<div class="tlh"><b>' + r.aid + '</b> · Sonnet ' + esc(TQ_LANE[r.lane] || r.lane) + (r.batch != null ? ' · batch ' + r.batch : '')
    + ' · ' + r.calls + ' calls in ' + r.min + ' min · $' + tqN(r.cost, 2) + ' · ' + r.exact + '/' + r.n + ' exact. '
    + 'Left to right; each block is a run of steps on one image (#n, green if read exactly), '
    + '“all” is a step over several images. Hollow = looking at a crop or render.</div>'
    + '<div class="tqleg">' + TQ.data.groups.map(function(g){ return '<b><i class="kg-' + g.key + '"></i>' + esc(g.label) + '</b>'; }).join("")
    + '<b><i class="hollow"></i>looked at the result</b></div>'
    + '<div class="tline">' + groups.map(function(g){
      var lab = g.im > 0 ? "#" + g.im + (v[g.im] ? (v[g.im] === "exact" ? " ✓" : " ✗") : "") : g.im < 0 ? "all" : "–";
      var cls = g.im > 0 && v[g.im] ? (v[g.im] === "exact" ? " ok" : " no") : "";
      return '<div class="tg"><span class="gl' + cls + '">' + lab + '</span><div class="cells">' + g.cells.join("") + '</div></div>';
    }).join("") + '</div>';
}
function tqWire(sec){
  sec.addEventListener("click", function(e){
    var b = e.target.closest("[data-lane]");
    if (b){ TQ.lane = b.dataset.lane; TQ.all = false; TQ.open = null; tqTable(); return; }
    var th = e.target.closest("th[data-sort]");
    if (th){ var k = th.dataset.sort; TQ.dir = TQ.sort === k ? -TQ.dir : (k === "t0" ? 1 : -1); TQ.sort = k; tqTable(); return; }
    if (e.target.closest("#tqAll")){ TQ.all = !TQ.all; tqTable(); return; }
    var tr = e.target.closest("tr.r");
    if (tr){ TQ.open = TQ.open === tr.dataset.aid ? null : tr.dataset.aid; tqTable(); }
  });
  var tip = $(".tqtip");
  if (!tip){ tip = el("div", "tqtip"); document.body.appendChild(tip); }
  function show(e){
    var t = e.target.closest && e.target.closest("[data-tip]");
    if (!t || !sec.contains(t)){ tip.style.display = "none"; return; }
    tip.textContent = t.getAttribute("data-tip"); tip.style.display = "block";
    var x = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8);
    var y = e.clientY + 16; if (y + tip.offsetHeight > window.innerHeight - 8) y = e.clientY - tip.offsetHeight - 12;
    tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
  }
  sec.addEventListener("mousemove", show);
  sec.addEventListener("mouseleave", function(){ tip.style.display = "none"; });
  sec.addEventListener("touchstart", function(e){ if (e.touches[0]) show({target: e.target, clientX: e.touches[0].clientX, clientY: e.touches[0].clientY}); }, {passive: true});
  if (!TQ.wired){ TQ.wired = true;
    window.addEventListener("scroll", function(){ var t = $(".tqtip"); if (t) t.style.display = "none"; }, {passive: true}); }
}
function tqSection(v){
  var sec = el("section", "tq"); sec.id = "sec-technique";
  sec.innerHTML = '<h2 class="blockh">How the readers work</h2><p class="sub">Loading…</p>';
  v.appendChild(sec);
  tqWire(sec);
  tqFetch().then(function(d){
    if (!sec.isConnected) return;
    tqRender(sec, d);
  }).catch(function(e){ sec.innerHTML = '<h2 class="blockh">How the readers work</h2><p class="sub">Could not load the technique data (' + esc(e.message) + ').</p>'; });
}

function render(){
  var v = $("#view");
  v.innerHTML = "";
  if (DATA.error){ v.appendChild(el("div", "err", DATA.error)); return; }
  var s = DATA.stats;
  var hero = el("div", "hero");
  /* The two tabs measure different things and must not share a caption. The
     images tab reports accuracy over structures read; the PDFs tab reports
     RECALL over compounds catalogued, because those documents draw six times
     more than they list. The label ships with the payload. */
  var c = DATA.compare;
  if (c) {
    var best = Math.max.apply(null, c.sides.map(function(x){ return x.pct; }));
    hero.innerHTML =
      '<div class="cmp' + (c.sides.length === 3 ? ' three' : '') + '">' + c.sides.map(function(x){
        return '<div class="side' + (x.pct === best ? ' lead' : '') + '">'
          + '<div class="who">' + esc(x.label) + '</div>'
          + '<div class="pc">' + x.pct + '%</div>'
          /* A side carries its own n when it can differ (Sonnet 5 on the 5.5 tab covers
             only the images the Sonnet 5 arm has also read). */
          + '<div class="of">' + x.exact + ' of ' + (x.n != null ? x.n : c.n)
          + (c.sides.length === 3 ? '' : ' exactly right') + (x.note ? ', ' + esc(x.note) : '') + '</div>'
          + '<div class="track"><i style="width:' + x.pct + '%"></i></div></div>';
      }).join("") + '</div>'
      + stackOf(c.breakdown, c.n)
      + '<div class="prog"><div class="lbl"><span>Read so far</span><span>'
      + c.n + ' of ' + c.corpus + '</span></div><div class="track"><i style="width:'
      + Math.max(0.6, c.n / c.corpus * 100).toFixed(1) + '%"></i></div></div>'
      + (c.cost ? '<div class="sub">' + esc(c.cost.note) + '</div>' : '')
      + '<div class="sub">' + esc(DATA.headline) + '</div>'
      /* Say which model a tab is, where the link to the comparison lives. The 5.5 payload
         carries its own; the Sonnet 5 payload predates the field. */
      + (DATA.xlink ? '<a class="xlink" href="' + esc(DATA.xlink.href) + '">' + esc(DATA.xlink.text)
           + ' <b>' + esc(DATA.xlink.bold) + '</b></a>'
         : TAB === "sonnet" ? '<a class="xlink" href="/sonnet-compare">Every reading on this tab is Sonnet 5.'
           + ' <b>Sonnet 5 vs 5.5 compared →</b></a>' : '');
  } else {
    /* Same visual language as the Sonnet tab: one headline number, a stacked bar
       of where every structure landed, then one labelled bar per secondary
       measure. What used to be three sentences of prose is now the bars. */
    hero.innerHTML = '<div class="big">' + s.strict_pct + '%<small>'
      + esc(DATA.heroLabel || ("of " + s.n + " structures exactly right")) + '</small></div>'
      + stackOf(DATA.breakdown, (DATA.breakdown || []).reduce(function(a, x){ return a + x.n; }, 0))
      + (DATA.bars || []).map(function(x){
          return '<div class="mbar' + (x.good ? ' good' : '') + '">'
            + '<div class="lbl"><span>' + esc(x.label) + '</span><b>' + x.pct + '% <span style="color:var(--dim);font-weight:400">'
            + esc(x.text) + '</span></b></div>'
            + '<div class="track"><i style="width:' + Math.min(100, x.pct) + '%"></i></div></div>';
        }).join("")
      + '<div class="sub">' + esc(DATA.headline) + '</div>';
  }
  v.appendChild(hero);
  /* The Sonnet 5.5 tab has two views: the structures wall, and how the readers worked. A
     separate view, not a section under the wall: the wall grows as you scroll, so anything
     below it keeps moving away. */
  if (TAB === "sonnet55" && !DATA.error){
    var vt = el("div", "vtog");
    vt.innerHTML = '<button data-v="wall" aria-pressed="' + !TQVIEW + '">Structures</button>'
      + '<button data-v="tech" aria-pressed="' + TQVIEW + '">How the readers work</button>';
    vt.onclick = function(e){ var b = e.target.closest("button[data-v]"); if (!b) return;
      TQVIEW = b.dataset.v === "tech"; history.replaceState(null, "", "?tab=sonnet55" + (TQVIEW ? "&view=technique" : ""));
      render(); window.scrollTo(0, 0); };
    v.appendChild(vt);
    if (TQVIEW){ tqSection(v); var tf = el("footer"); tf.innerHTML = esc(DATA.footer || ""); v.appendChild(tf); return; }
  }
  /* Jump bar: reach the lower sections without scrolling the whole wall. Sticky, so it
     works from anywhere on the page. Only lists anchors that exist for this tab. */
  var jumps = [];
  if (DATA.workflow) jumps.push(["How it works", "sec-workflow"]);
  if (DATA.examples && DATA.examples.length) jumps.push(["Examples", "sec-examples"]);
  if (DATA.classes && DATA.classes.length) jumps.push(["By type", "sec-classes"]);
  if (DATA.prompt) jumps.push(["Prompt & method", "sec-method"]);
  jumps.push(["Bottom", "sec-bottom"], ["Top", "sec-top"]);
  if (jumps.length > 2) {
    var jb = el("div", "jump"); jb.id = "sec-top";
    jb.innerHTML = '<span class="jlbl">Jump to</span>' + jumps.map(function(j){
      return '<button data-to="' + j[1] + '">' + esc(j[0]) + (j[1] === "sec-top" ? " ↑" : " ↓") + '</button>';
    }).join("");
    jb.addEventListener("click", function(e){
      var b = e.target.closest("button[data-to]"); if (!b) return;
      var t = b.dataset.to === "sec-top" ? $("#view") : document.getElementById(b.dataset.to);
      if (t) t.scrollIntoView({behavior: "smooth", block: "start"});
    });
    v.appendChild(jb);
  }
  var ds = docsStrip(); if (ds) v.appendChild(ds);
  /* Count over the rows in SCOPE, not the whole corpus. With a document selected
     the chips read "All 4484 / Exact 795" beside a wall showing 42 tiles, which is
     two different questions answered on one line. */
  v.appendChild(chipbar(DATA.rows.filter(function(r){ return !DOC || r.d === DOC; })));
  var head = el("div", "sub"); head.id = "count"; v.appendChild(head);
  var wall = el("div", "wall"); wall.id = "wall"; v.appendChild(wall);
  if (DATA.workflow){
    var w = DATA.workflow, ws = el("section", "block"); ws.id = "sec-workflow";
    ws.innerHTML = '<h2 class="blockh">How this arm works</h2><p class="sub">' + esc(w.intro) + '</p>'
      + '<details class="fold"><summary>The tools it calls, and how it segments a drawing</summary>'
      + '<div class="noteh">The tools it calls</div><ul class="notelist">'
      + (w.tools || []).map(function(t){ return '<li><b>' + esc(t.t) + '</b> — ' + esc(t.d) + '</li>'; }).join("")
      + '</ul><div class="noteh">How it segments a drawing</div><ol class="notelist">'
      + (w.steps || []).map(function(s){ return '<li>' + esc(s) + '</li>'; }).join("") + '</ol></details>';
    v.appendChild(ws);
  }
  if (DATA.examples && DATA.examples.length){
    var es = el("section", "block"); es.id = "sec-examples";
    es.innerHTML = '<h2 class="blockh">Worked examples</h2>'
      + '<p class="sub">Real reads from the runs — tap one to open that molecule.</p>';
    var grid = el("div", "exgrid");
    DATA.examples.forEach(function(x){
      var ok = x.outcome === "success", card = el("button", "excard " + (ok ? "ok" : "miss"));
      card.setAttribute("data-k", x.k);
      card.innerHTML = '<div class="extag ' + (ok ? "ok" : "miss") + '">' + (ok ? "✓ success" : "✗ miss")
        + '</div><div class="extitle">' + esc(x.title) + '</div><div class="exbody">' + esc(x.body) + '</div>';
      grid.appendChild(card);
    });
    grid.addEventListener("click", function(e){
      var b = e.target.closest(".excard[data-k]"); if (!b) return;
      var row = (DATA.rows || []).filter(function(r){ return r.k === b.dataset.k; })[0];
      if (row) openSheet(row);
    });
    es.appendChild(grid); v.appendChild(es);
  }
  if (DATA.classes && DATA.classes.length){
    var cs = el("section", "block"); cs.id = "sec-classes";
    cs.innerHTML = '<h2 class="blockh">By structure type</h2>'
      + (TAB === "sonnet" ? '<div class="takeaway">Short version: the language model reads small, odd and inorganic '
      + 'drawings better; the specialised OCR model reads large, ring-heavy and peptide drawings '
      + 'better.</div>' : '')
      + '<p class="sub">Every reference bucketed by shape and size with RDKit — not by its name — and '
      + 'how often each reader got the whole string right. A structure can sit in several buckets.</p>';
    var wrap = el("div", "clswrap");
    wrap.innerHTML = DATA.classes.map(function(c){
      var dlt = c.sonnet - c.cxms;
      var lead = c.lead === "sonnet" ? '<span class="clschip s">Sonnet +' + dlt + '</span>'
        : c.lead === "cxms" ? '<span class="clschip c">CXMolScribe +' + (-dlt) + '</span>'
        : '<span class="clschip t">≈ even</span>';
      function bar(who, pct, k){ return '<div class="clsbar"><span class="cll">' + who
        + '</span><div class="ctrack"><i class="' + k + '" style="width:' + pct + '%"></i></div><b>'
        + pct + '%</b></div>'; }
      return '<div class="cls"><div class="clsh"><span class="clslab">' + esc(c.label)
        + ' <b class="clsn">n=' + c.n + '</b></span>' + lead + '</div>'
        + bar("Sonnet", c.sonnet, "s") + bar("CXMolScribe", c.cxms, "c") + '</div>';
    }).join("");
    cs.appendChild(wrap); v.appendChild(cs);
  }
  if (DATA.prompt){
    var pd = el("details"); pd.id = "sec-method";
    pd.appendChild(el("summary", null, "The prompt the model was given"));
    if (DATA.method && DATA.method.length){
      DATA.method.forEach(function(sec){
        pd.appendChild(el("div", "noteh", sec.h));
        var ul = el("ul", "notelist");
        (sec.points || []).forEach(function(p){ ul.appendChild(el("li", null, p)); });
        pd.appendChild(ul);
      });
    } else if (DATA.promptNote) pd.appendChild(el("p", "sub", DATA.promptNote));
    pd.appendChild(el("div", "pre", DATA.prompt));
    v.appendChild(pd);
  }
  /* The render-arms table answers "which way of DRAWING the molecule works best".
     That question does not exist on the Sonnet tab, which holds one arm read two
     ways, so the fold was an invitation to an answer about something else. */
  if (DATA.arms && DATA.arms.length) v.appendChild(armsTable());
  var f = el("footer"); f.id = "sec-bottom";
  f.innerHTML = esc(DATA.footer || "");
  v.appendChild(f);
  paint();
}

/* Each tab's payload is downloaded once and kept. The first tab loads as before, and the
   other two follow in the background as soon as it is on screen. Switching tabs then
   renders from memory instead of showing "Loading…" while the same JSON downloads
   again. Rendering never mutates a payload beyond the idempotent threshold default, so a
   kept one renders again as-is. */
var READY = {}, PENDING = {};
function fetchTab(tab){
  if (READY[tab]) return Promise.resolve(READY[tab]);
  if (!PENDING[tab]) PENDING[tab] = fetch("/wall/" + tab + ".json").then(function(r){
    if (!r.ok) throw new Error("no data for this tab yet (HTTP " + r.status + ")");
    return r.json();
  }).then(function(d){ READY[tab] = d; delete PENDING[tab]; return d; },
          function(e){ delete PENDING[tab]; throw e; });
  return PENDING[tab];
}

function load(tab){
  TAB = tab; FILTER = "all"; DOC = null; Q = ""; SHOWN = STEP;
  ["pdfs","images","sonnet","sonnet55"].forEach(function(t){
    $("#tab-" + t).setAttribute("aria-selected", tab === t); });
  showTab($("#tab-" + tab));
  if (!READY[tab]) $("#view").innerHTML = '<div class="sub" style="padding:40px 0">Loading…</div>';
  fetchTab(tab).then(function(d){
    if (TAB !== tab) return;          // the user moved to another tab while this downloaded
    DATA = d; DATA.threshold = d.threshold || 84; render();
    history.replaceState(null, "", "?tab=" + tab + (tab === "sonnet55" && TQVIEW ? "&view=technique" : ""));
  }).catch(function(e){
    if (TAB !== tab) return;
    DATA = {error: "This tab has no results yet — " + e.message, rows: [], stats: {}};
    render();
  });
}

$("#tab-pdfs").onclick = function(){ load("pdfs"); };
$("#tab-sonnet").onclick = function(){ load("sonnet"); };
$("#tab-sonnet55").onclick = function(){ load("sonnet55"); };
/* On a phone the tab strip scrolls; keep the active tab in view and drop the edge fade
   once the strip is scrolled to its end. */
function showTab(b){
  var seg = b && b.parentNode; if (!seg || seg.scrollWidth <= seg.clientWidth) return;
  var l = b.offsetLeft - seg.offsetLeft, r = l + b.offsetWidth;
  if (l < seg.scrollLeft || r > seg.scrollLeft + seg.clientWidth)
    seg.scrollLeft = Math.max(0, r - seg.clientWidth + 24);
  segEnd();
}
function segEnd(){ var seg = $(".seg");
  seg.classList.toggle("at-end", seg.scrollLeft + seg.clientWidth >= seg.scrollWidth - 2); }
$(".seg").addEventListener("scroll", segEnd, {passive: true});
window.addEventListener("resize", segEnd);
$("#tab-images").onclick = function(){ load("images"); };
$("#try").onclick = function(){ location.href = "/upload"; };
$("#sheet").onclick = function(e){ if (e.target.id === "sheet") $("#sheet").close(); };
/* The loupe is triggered by the contextmenu event on iOS, not by selection alone,
   so the CSS above is necessary and not sufficient. Allowed on the strings. */
document.addEventListener("contextmenu", function(e){
  if (!e.target.closest("code, input, textarea")) e.preventDefault();
});
document.addEventListener("selectstart", function(e){
  if (!e.target.closest("code, input, textarea")) e.preventDefault();
});
/* Raw images is the default: it is the cleaner measurement (one already-cropped
   depiction per image, no figure extraction to go wrong) and the bigger corpus.
   ?tab=pdfs still deep-links to the document run. */
(function(){ var t = new URLSearchParams(location.search).get("tab");
  var first = t === "pdfs" || t === "sonnet" || t === "sonnet55" ? t : "images";
  load(first);
  var warm = function(){ ["images","pdfs","sonnet","sonnet55"].forEach(function(x){
    if (x !== first) fetchTab(x).catch(function(){}); }); };
  fetchTab(first).then(warm, warm); })();
</script>
