<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C-MAGE: Sonnet 5.5 vs Sonnet 5</title>
<meta name="description" content="Sonnet 5.5 re-reading chemical structure drawings Sonnet 5 got wrong, through the same blind pipeline and scorer.">
<link rel="icon" href="/static/favicon.png">
<style>
/* Same palette, type and header as the benchmark page (index.html), so this reads as
   another view of one site rather than a separate app. */
:root{
  --bg:#0d1117; --panel:#161b22; --line:#26303d; --ink:#e6edf3; --dim:#8b98a5;
  --exact:#2ea043; --stereo:#d29922; --wrong:#da3633; --invalid:#6e7681; --acc:#388bfd;
}
*{box-sizing:border-box;touch-action:manipulation}
/* Same loupe policy as index.html: killed globally, given back to the SMILES strings,
   which are the one thing a chemist wants to select and copy. */
html,body{-webkit-touch-callout:none}
body{user-select:none;-webkit-user-select:none}
code,.pre{user-select:text;-webkit-user-select:text;-webkit-touch-callout:default}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
a{color:#58a6ff}
header{position:sticky;top:0;z-index:20;background:rgba(13,17,23,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:12px;max-width:1400px;margin:0 auto;
  padding:10px calc(14px + env(safe-area-inset-right)) 10px calc(14px + env(safe-area-inset-left));
  padding-top:calc(10px + env(safe-area-inset-top))}
.hrow>*{min-width:0}
.brand{font-weight:700;letter-spacing:.3px;font-size:16px;white-space:nowrap;color:var(--ink);text-decoration:none}
.seg{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:2px;margin-left:auto}
.seg a{color:var(--dim);font-size:14px;padding:0 13px;border-radius:6px;min-height:38px;
  display:flex;align-items:center;white-space:nowrap;text-decoration:none}
.seg a:hover{color:var(--ink)}
.ghost{border:1px solid var(--line);color:var(--ink);font-size:13px;padding:0 12px;border-radius:7px;
  min-height:38px;display:flex;align-items:center;white-space:nowrap;text-decoration:none;flex:0 0 auto}
/* #1f6feb, not the accent #388bfd: white 12.5px text on the accent is 3.3:1 and fails AA. */
.seg a[aria-current=page]{background:#1f6feb;color:#fff;font-weight:600}
main{max-width:1400px;margin:0 auto;
  padding:0 calc(14px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom))
          calc(14px + env(safe-area-inset-left))}

/* hero */
.hero{padding:20px 0 16px;border-bottom:1px solid var(--line)}
h1{font-size:24px;line-height:1.2;margin:0 0 6px;letter-spacing:-.3px}
.lede{color:var(--dim);font-size:14.5px;margin:0 0 16px;max-width:760px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.cmp .side{background:var(--panel);border:1px solid var(--line);padding:13px 14px;min-width:0;
  display:flex;flex-direction:column}
.cmp .track{margin-top:auto !important}
.cmp .of{margin-bottom:9px}
.cmp .who{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.cmp .pc{font-size:34px;font-weight:800;line-height:1;letter-spacing:-1px}
.cmp .pc small{font-size:16px;font-weight:600;color:var(--dim);letter-spacing:0;margin-left:3px}
.cmp .of{color:var(--dim);font-size:12.5px;margin-top:6px}
.cmpnote{color:var(--dim);font-size:12.5px;margin:-4px 0 12px}
.cmpnote b{color:var(--ink)}
.verdict{background:var(--panel);border:1px solid var(--line);border-left:3px solid #d29922;
  padding:11px 13px;margin:0 0 12px;font-size:14px;line-height:1.5;color:var(--ink)}
.cmp .track{height:7px;background:#0b0f14;margin-top:9px;overflow:hidden}
.cmp .track i{display:block;height:100%;background:var(--acc)}
.cmp .side.lead .track i{background:var(--exact)}
/* Outcome tally: one line per outcome, number first, so the three facts that answer
   "is 5.5 better on these" are readable without decoding a chart. */
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);margin-bottom:14px}
.tally div{background:var(--panel);padding:10px 12px;min-width:0}
.tally b{display:block;font-size:22px;font-weight:800;line-height:1.1}
.tally span{color:var(--dim);font-size:12.5px;line-height:1.35;display:block;margin-top:3px}
.tally .up b{color:#3fb950} .tally .down b{color:#f87171}
.facts{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.facts li{font-size:13.5px;color:var(--dim);line-height:1.5}
.facts li b{color:var(--ink);font-weight:650}
.caveat{background:var(--panel);border:1px solid var(--line);border-left:3px solid #d29922;
  padding:11px 13px;margin:14px 0 0;font-size:13.5px;line-height:1.5;color:var(--ink)}

/* cards */
.secth{font-size:16px;font-weight:750;margin:24px 0 4px}
.sectsub{color:var(--dim);font-size:13px;margin:0 0 12px}
.cards{display:grid;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);
  padding:12px;min-width:0}
.card.up{border-left-color:#3fb950} .card.down{border-left-color:#f87171}
.chead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.chead h3{margin:0;font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.ctype{color:var(--dim);font-size:12.5px;margin:3px 0 10px}
.delta{flex:0 0 auto;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.delta.up{background:#0f3d20;color:#4ade80}
.delta.down{background:#4a1513;color:#f87171}
.delta.same{background:#21262d;color:#c9d1d9}
/* Square corners on every white surface over the dark page: a radius leaves a pale
   fringe at each corner (SKILL, "the webapp"). */
figure{margin:0;background:#fff}
figure img{width:100%;display:block;aspect-ratio:1;object-fit:contain}
.src figure img{max-height:230px}
.src .cap,.arm .cap{color:var(--dim);font-size:11.5px;margin:5px 0 0}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.arm{min-width:0}
/* Label on one line, verdict on the next, in BOTH columns. Side by side on one line, a
   long badge ("stereo only") wrapped in one column and not the other, and the two
   drawings stopped lining up -- the one thing this layout is for. */
.alab{display:grid;gap:4px;justify-items:start;margin-bottom:6px;font-size:12.5px;font-weight:650}
.nofig{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:#0b0f14;
  border:1px dashed var(--line);color:var(--dim);font-size:12px;text-align:center;padding:8px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;
  text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
.badge.exact{background:#0f3d20;color:#4ade80} .badge.stereo{background:#3d3010;color:#fbbf24}
.badge.wrong{background:#4a1513;color:#f87171} .badge.invalid{background:#21262d;color:#c9d1d9}
.badge.truth{background:#12233c;color:#79b8ff}
.side-read{margin-top:8px;font-size:12.5px;color:var(--dim)}
.side-read b{color:var(--ink);font-weight:600}
details{margin-top:10px;border-top:1px solid var(--line)}
summary{cursor:pointer;color:#58a6ff;font-size:13.5px;padding:10px 0 4px;min-height:44px;
  display:flex;align-items:center}
.kv{margin:8px 0}
.kv label{display:block;color:var(--dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.kv code{display:block;background:#0b0f14;border:1px solid var(--line);padding:8px 9px;
  font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;color:var(--ink)}
.kv .note{color:var(--dim);font-size:12px;margin-top:3px}

/* runs + method */
table{border-collapse:collapse;width:100%;font-size:12.5px;display:block;overflow-x:auto;white-space:nowrap}
th,td{text-align:left;padding:7px 11px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.pre{background:#0b0f14;border:1px solid var(--line);padding:12px;margin-top:8px;
  font:11.5px/1.55 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;
  color:#c9d1d9;max-height:52vh;overflow-y:auto}
.notes{margin:8px 0 0 18px;padding:0}
.notes li{font-size:13px;color:var(--dim);line-height:1.5;margin:5px 0}
.notes li b{color:var(--ink)}
/* breakdown + calibration tables: fit 390 px without sideways scroll */
table.bd{display:table;white-space:normal;margin-top:6px}
table.bd th,table.bd td{padding:7px 7px}
table.bd td:first-child{min-width:0}
table.bd tr.tot td{font-weight:650;color:var(--ink)}
table.bd .dim,.dim{color:var(--dim)}
table.bd td b{color:#4ade80}
.tnote{color:var(--dim);font-size:12px;margin:8px 0 0;line-height:1.45}
.tnote b{color:var(--ink)}
.secth.first{margin-top:6px}
.bt{display:inline-block;font-size:11px;font-weight:700;color:#c9d1d9;background:#21262d;padding:1px 7px;
  border-radius:20px;margin-right:4px;letter-spacing:.3px}
footer{color:var(--dim);font-size:12.5px;padding:22px 0 0;border-top:1px solid var(--line);margin-top:28px}
.err{background:#4a1513;color:#f87171;padding:12px 14px;margin:16px 0}

@media(max-width:560px){
  /* Same header as index.html at this width: four tabs plus the upload button, no wordmark. */
  .hrow{gap:8px;padding:9px 12px}
  .brand{display:none}
  .seg{margin-left:0;flex:1 1 auto;justify-content:center;min-width:0}
  .seg a{padding:0 8px;font-size:12.5px}
  .ghost{padding:0 9px;font-size:12px}
  h1{font-size:21px}
  .cmp .pc{font-size:28px}
  .cmp .side{padding:11px 10px}
  /* Three boxes at 390px: a label may take two lines, so every label reserves two and the
     numbers stay on one baseline across the row. */
  .cmp .who{font-size:11px;letter-spacing:.4px;line-height:1.35;min-height:2.7em}
  .tally b{font-size:20px}
}
@media(max-width:359px){ .seg a{padding:0 6px;font-size:12px} }
/* Desktop: two cards per row, and inside each card the drawing and both readings sit
   side by side, so the whole comparison is one glance. */
@media(min-width:900px){
  h1{font-size:28px}
  .hero-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
  .cards{grid-template-columns:1fr 1fr}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
  .body{display:grid;grid-template-columns:1fr 2fr;gap:10px;align-items:start}
  .pair{margin-top:0}
  .src figure img{max-height:none}
}
</style>

<header>
  <div class="hrow">
    <a class="brand" href="/">C-MAGE</a>
    <nav class="seg" aria-label="Benchmark views">
      <a href="/?tab=images">Images</a>
      <a href="/?tab=pdfs">PDFs</a>
      <a href="/?tab=sonnet">Sonnet 5</a>
      <a href="/sonnet-5-5" aria-current="page">Sonnet 5.5</a>
    </nav>
    <a class="ghost" href="/upload">Try a file</a>
  </div>
</header>

<main id="view"><div class="lede" style="padding:40px 0">Loading…</div></main>

<script>
"use strict";
var $ = function(s){ return document.querySelector(s); };
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
var VLABEL = {exact: "exact", stereo: "stereo only", wrong: "wrong", invalid: "unparseable"};
function badge(v){ return '<span class="badge ' + esc(v) + '">' + esc(VLABEL[v] || v) + '</span>'; }
function mins(s){ return s >= 90 ? Math.round(s / 60) + " min" : Math.round(s) + " s"; }
function money(x){ return "$" + Number(x).toFixed(2); }

/* What the reading got wrong, in words, computed from the payload rather than asserted:
   the relation build_wall.relate() found and the graded ladder's formula check. */
function detail(a){
  if (a.v === "exact") return "Identical to the reference after RDKit canonicalisation.";
  if (a.v === "invalid") return "RDKit cannot parse this SMILES.";
  var bits = [];
  if (a.r && a.r.stereo) bits.push(a.r.stereo[0] + " of " + a.r.stereo[1] + " stereocentres disagree");
  if (a.r && a.r.geom) bits.push(a.r.geom + " double-bond geometr" + (a.r.geom === 1 ? "y differs" : "ies differ"));
  if (a.formula === false) bits.push("formula differs (" + (a.heavy > 0 ? "+" : "") + a.heavy + " heavy atoms)");
  else if (a.v === "wrong") bits.push("same formula, different connectivity");
  return bits.join("; ") + ".";
}

function arm(label, a, dir, k){
  var img = a.p
    ? '<figure><img loading="lazy" decoding="async" src="/wall/' + dir + '/' + encodeURIComponent(k)
      + '.png" alt="' + esc(label) + ' reading, drawn back with RDKit"></figure>'
    : '<div class="nofig">no drawable SMILES</div>';
  var conf = a.conf != null && a.conf !== "" ? "confidence " + esc(a.conf) : "no confidence given";
  return '<div class="arm"><div class="alab"><span>' + esc(label) + '</span>' + badge(a.v) + '</div>'
    + img + '<p class="cap">' + conf + '</p></div>';
}

/* The badge compares 5.5 with the SAME-PROMPT re-run when one exists, not with the published
   run: the published run is why an image was picked, so it flatters any second attempt. */
function baseRead(r, D){
  var lab = D.stats && D.stats.base;
  return (r.side || []).filter(function(x){ return x.label === lab; })[0] || null;
}
function card(r, D){
  var base = baseRead(r, D), bv = base ? base.v : r.s5.v, who = base ? "re-run" : "Sonnet 5";
  var up = r.s55.v === "exact" && bv !== "exact", down = r.s55.v !== "exact" && bv === "exact";
  var d = up ? ["up", "5.5 ahead of " + who] : down ? ["down", "5.5 behind " + who]
        : ["same", r.s55.v === "exact" ? "both right" : "both miss"];
  var side = (r.side || []).map(function(x){
    return '<div class="side-read">' + esc(x.label) + ' (same prompt as 5.5): ' + badge(x.v)
      + (x.conf != null ? ' confidence ' + esc(x.conf) : '') + '</div>'; }).join("");
  var kv = function(lab, smi, note){
    return '<div class="kv"><label>' + esc(lab) + '</label><code>' + esc(smi || "(none)") + '</code>'
      + (note ? '<div class="note">' + esc(note) + '</div>' : '') + '</div>'; };
  var why = r.role === "control" ? "Sonnet 5 read it exactly, at confidence " + (r.s5.conf == null ? "?" : r.s5.conf)
                                 : "Sonnet 5 miss: " + r.type;
  return '<article class="card ' + (d[0] === "same" ? "" : d[0]) + '" id="' + esc(r.k) + '">'
    + '<div class="chead"><h3>' + esc(r.n) + '</h3><span class="delta ' + d[0] + '">' + d[1] + '</span></div>'
    + '<div class="ctype"><span class="bt">Batch ' + esc(r.batch) + '</span> ' + esc(why) + '</div>'
    + '<div class="body"><div class="src"><div class="alab"><span>The drawing</span>'
    + '<span class="badge truth">what all read</span></div>'
    + '<figure><img loading="lazy" decoding="async" src="/wall/sonnet55/'
    + encodeURIComponent(r.k) + '.png" alt="The drawing the models read: ' + esc(r.n) + '"></figure></div>'
    + '<div class="pair">' + arm("Sonnet 5, published", r.s5, "sonnet55_s5", r.k) + arm("Sonnet 5.5", r.s55, "sonnet55_pred", r.k) + '</div></div>'
    + side
    + '<details><summary>SMILES and what differs</summary>'
    + kv("Ground truth", r.t)
    + kv("Sonnet 5, published", r.s5.s, detail(r.s5))
    + (r.side || []).map(function(x){ return kv(x.label, x.s, x.v === "exact" ? "Identical to the reference after RDKit canonicalisation." : "Verdict: " + (VLABEL[x.v] || x.v) + "."); }).join("")
    + kv("Sonnet 5.5", r.s55.s, detail(r.s55))
    + kv("CXMolScribe (pipeline), " + (VLABEL[r.cx.v] || r.cx.v), r.cx.s)
    + '</details></article>';
}

function pfmt(p){
  if (p >= 0.995) return "1.0";
  if (p < 0.001) { var e = p.toExponential(1).split("e"); return e[0] + "&times;10<sup>" + e[1].replace("-", "&minus;") + "</sup>"; }
  return p.toFixed(p < 0.1 ? 3 : 2);
}
function perReader(xs){ return xs.map(function(x){ return x.exact + "/" + x.n; }).join(", "); }
/* Name the images only while the list is short; past six it buries the verdict on a phone,
   and every card below carries its own "ahead"/"behind" badge. */
function names(xs){ return xs.length && xs.length <= 6 ? ' (' + esc(xs.join(", ")) + ')' : ''; }

function render(D){
  var S = D.summary, T = D.stats, v = $("#view");
  var O = T ? T.overall : null;
  var sideOf = function(lab){ return (D.side || []).filter(function(x){ return x.label === lab; })[0]; };
  var B = T ? sideOf(T.base) : null;
  var runs = D.runs || [];
  var verdict, cmp = "", tally = "";
  if (O) {
    var N = T.noise;
    verdict = 'On the identical prompt, over ' + O.n + ' images: Sonnet 5.5 <b>' + O.s55 + '/' + O.n + '</b>, '
      + 'Sonnet 5 re-run <b>' + O.base + '/' + O.n + '</b>. 5.5 is ahead on ' + O.ahead + names(O.ahead_names)
      + ' and behind on ' + O.behind + names(O.behind_names) + '. '
      + 'Exact McNemar test on those ' + (O.ahead + O.behind) + ' discordant images: <b>p = ' + pfmt(O.p) + '</b>'
      + (O.p < 0.05 ? '. Not run-to-run noise at any usual threshold.'
                    : ', not significant: a gap this size is compatible with run-to-run noise.')
      + (T.readers ? ' The test treats images as independent, but each reader reads ten in one context; per reader, '
        + 'Sonnet 5.5 scored ' + perReader(T.readers["Sonnet 5.5"]) + ' and the Sonnet 5 re-run '
        + perReader(T.readers[T.base])
        + (Math.min.apply(null, T.readers["Sonnet 5.5"].map(function(x){ return x.exact / x.n; }))
             > Math.max.apply(null, T.readers[T.base].map(function(x){ return x.exact / x.n; }))
           ? ', so every 5.5 reader beat every re-run reader.' : ', so the reader-level picture is mixed.') : '')
      + ' Sonnet 5 on its own is noisy here: the re-run fixed ' + N.published_miss_rerun_right + ' of the ' + N.published_miss_n
      + ' published misses and lost ' + N.published_right_rerun_miss + ' of the ' + N.published_right_n + ' published rights.';
    var sides = [["Sonnet 5, re-run", O.base, "same prompt as 5.5"], ["Sonnet 5.5", O.s55, "same prompt"]];
    var best = Math.max(O.base, O.s55);
    cmp = sides.map(function(x){
      return '<div class="side' + (x[1] === best ? " lead" : "") + '"><div class="who">' + esc(x[0]) + '</div>'
        + '<div class="pc">' + x[1] + '<small>/ ' + O.n + '</small></div>'
        + '<div class="of">' + esc(x[2]) + '</div>'
        + '<div class="track"><i style="width:' + Math.round(x[1] / O.n * 100) + '%"></i></div></div>'; }).join("");
    tally = '<div class="tally"><div class="' + (O.ahead ? 'up' : '') + '"><b>' + O.ahead + '</b><span>5.5 right, re-run wrong</span></div>'
      + '<div class="' + (O.behind ? 'down' : '') + '"><b>' + O.behind + '</b><span>re-run right, 5.5 wrong</span></div>'
      + '<div><b>' + (O.n - O.ahead - O.behind) + '</b><span>same result</span></div></div>';
  } else {
    verdict = 'No same-prompt Sonnet 5 re-run yet, so this cannot separate a model difference from noise.';
  }
  if (T && T.rerun_vs_rerun) verdict += ' On batch 1, two independent Sonnet 5 re-runs agreed on '
    + T.rerun_vs_rerun.agree + ' of ' + T.rerun_vs_rerun.n + '.';

  /* Breakdown: one row per slice, the published run shown only for context. */
  var bd = T ? '<table class="bd"><thead><tr><th>Slice</th><th class="num">n</th><th class="num">Pub&shy;lished</th>'
      + '<th class="num">Re-run</th><th class="num">5.5</th><th class="num">p</th></tr></thead><tbody>'
      + T.groups.map(function(g){
          return '<tr' + (g.label === "All images" ? ' class="tot"' : '') + '><td>' + esc(g.label) + '</td><td class="num">' + g.n + '</td><td class="num dim">' + g.published
            + '</td><td class="num">' + g.base + '</td><td class="num"><b>' + g.s55 + '</b></td><td class="num">' + pfmt(g.p) + '</td></tr>'; }).join("")
      + '</tbody></table>'
      + '<p class="tnote">Counts are exact reads. <b>p</b> is the two-sided exact McNemar test, 5.5 against the re-run, on the images where exactly one of them was right. '
      + 'Published is the Sonnet 5 run the images were picked from, so it is low or high by construction.</p>' : '';

  /* Calibration: is 5.5 surer when right than when wrong? */
  var cal = "";
  if (T) {
    var cm = T.calibration, labs = ["Sonnet 5.5", T.base];
    var line = function(lab){
      var c = cm[lab];
      return '<li><b>' + esc(lab === T.base ? "Sonnet 5 re-run" : lab) + ':</b> right ' + c.right_n + '&times;, mean confidence '
        + (c.right_mean == null ? "n/a" : c.right_mean) + (c.right_min != null ? ' (lowest ' + c.right_min + ')' : '')
        + '; wrong ' + c.wrong_n + '&times;, mean ' + (c.wrong_mean == null ? "n/a" : c.wrong_mean)
        + (c.wrong_max != null ? ' (highest ' + c.wrong_max + ')' : '') + '. Brier score ' + (c.brier == null ? "n/a" : c.brier.toFixed(3)) + '.</li>'; };
    var c55 = cm["Sonnet 5.5"], lowest = D.rows.slice().sort(function(a, b){ return (+a.s55.conf) - (+b.s55.conf); })[0];
    var untestable = c55.wrong_n === 0
      ? '<p class="tnote" style="margin:10px 0 10px">Sonnet 5.5 was never wrong here, so whether it is less sure when wrong '
        + 'cannot be tested on this sample. Its least confident answer (' + esc(lowest.s55.conf) + ', ' + esc(lowest.n) + ') was right.</p>' : '';
    cal = '<ul class="facts">' + labs.map(line).join("") + '</ul>' + untestable
      + '<table class="bd cal"><thead><tr><th>Stated confidence</th>' + labs.map(function(l){ return '<th class="num">' + esc(l === T.base ? "Re-run" : "5.5") + ' exact</th>'; }).join("") + '</tr></thead><tbody>'
      + cm[labs[0]].bins.map(function(b, i){
          return '<tr><td>' + esc(b.bin) + '</td>' + labs.map(function(l){ var x = cm[l].bins[i];
            return '<td class="num">' + (x.n ? x.exact + ' of ' + x.n : '<span class="dim">none</span>') + '</td>'; }).join("") + '</tr>'; }).join("")
      + '</tbody></table>'
      + '<p class="tnote">Brier score is the mean squared gap between stated confidence (as a probability) and the outcome; lower is better, 0 is perfect. '
      + 'Confidence is what each reader wrote for itself, 0-100, asked to be its probability of an exact match.</p>';
  }

  var costs = '<li><b>Sonnet 5.5:</b> ' + money(S.s55_cost_per_image) + ' and ' + mins(S.s55_time_per_image) + ' per image ('
      + money(S.s55_cost) + ', ' + mins(S.s55_seconds) + ' of reader time over ' + runs.length + (runs.length === 1 ? ' run' : ' runs') + ').</li>'
    + (D.side || []).map(function(x){ return '<li><b>' + esc(x.label) + ':</b> ' + money(x.cost / x.n) + ' and '
        + mins(x.seconds / x.n) + ' per image (' + money(x.cost) + ' over ' + x.n + ' images).</li>'; }).join("")
    + '<li><b>Published Sonnet 5 batches</b> these came from: ' + money(S.s5_cost_per_image) + ' and ' + mins(S.s5_time_per_image) + ' per image.</li>';

  var bnotes = Object.keys(D.batches || {}).map(function(b){
    return '<li><b>Batch ' + esc(b) + ':</b> ' + esc(D.batches[b]) + '</li>'; }).join("");

  v.innerHTML =
    '<section class="hero"><div class="hero-grid"><div>'
    + '<h1>Sonnet 5.5 vs Sonnet 5</h1>'
    + '<p class="lede">' + S.n + ' images from the blind benchmark, mostly ones Sonnet 5 read <b>wrong</b>, given to Sonnet 5.5 '
    + 'and to Sonnet 5 again through the same pipeline: same images, same reader prompt, same max effort, same scorer.</p>'
    + '<div class="verdict">' + verdict + '</div>'
    + (cmp ? '<div class="cmp">' + cmp + '</div>' + tally : '')
    + '<p class="cmpnote">Published Sonnet 5 run on these images: <b>' + S.s5_exact + '/' + S.n + '</b>. '
    + 'That is why they were picked, not a baseline: ' + S.failures + ' are its misses, ' + S.controls + ' it read right.</p>'
    + '</div><div>'
    + '<h2 class="secth first">By batch and by kind</h2>' + bd
    + '</div></div></section>'
    + '<div class="two"><div><h2 class="secth">Confidence</h2><p class="sectsub">Is each model surer when it is right?</p>' + cal + '</div>'
    + '<div><h2 class="secth">Cost and time</h2><p class="sectsub">API list price of the tokens each reader used; the same per-token price for both models.</p>'
    + '<ul class="facts">' + costs + '</ul>'
    + '<ul class="facts" style="margin-top:12px"><li><b>Reading or recall?</b> Every image is a known drug. Sonnet 5.5 named ' + S.s55_named + ' of ' + S.n
    + ', published Sonnet 5 named ' + S.s5_named + ' and still drew ' + S.s5_named_wrong + ' of those wrong. The prompt allows '
    + 'recognising a molecule and cross-checking it, so this measures reading plus recall.</li></ul>'
    + '<div class="caveat"><b>Small, hand-picked sample.</b> ' + S.n + ' images, one reading per model per image, '
    + S.failures + ' of them chosen because Sonnet 5 had missed them. Picking on failure favours any second attempt, which is why the '
    + 'comparison is with a same-prompt re-run and not with the published score. It is not an accuracy figure for 5.5 and should not '
    + 'be set against the Sonnet tab’s corpus percentage.</div></div></div>'
    + '<h2 class="secth">Per image</h2><p class="sectsub">Misses first, then images Sonnet 5 read right. Each reading is drawn back with RDKit, so a wrong atom shows up against the drawing at a glance.</p>'
    + '<div class="cards">' + D.rows.map(function(r){ return card(r, D); }).join("") + '</div>'
    + '<h2 class="secth" id="runs">Runs</h2><p class="sectsub">Every reader, with the model the API says served it. The page renders from <a href="/wall/sonnet55.json">sonnet55.json</a>, rebuilt by <code>tools/build_sonnet55.py</code>.</p>'
    + '<table><thead><tr><th>Run</th><th>Batch</th><th>Started (UTC)</th><th>Model served</th><th>Effort</th><th>CLI</th><th class="num">Images</th><th class="num">Cost</th><th class="num">Wall-clock</th></tr></thead><tbody>'
    + runs.map(function(r){ return '<tr><td>Sonnet 5.5</td><td>' + esc(r.batch) + '</td><td>' + esc(r.started.replace("T", " ").slice(0, 16)) + '</td><td>' + esc(r.models.join(", "))
        + '</td><td>' + esc(r.effort.join(", ")) + '</td><td>' + esc(r.cli) + '</td><td class="num">' + r.images + '</td><td class="num">' + money(r.cost_usd)
        + '</td><td class="num">' + mins(r.duration_s) + '</td></tr>'; }).join("")
    + (D.side || []).map(function(x){ return (x.runs || []).map(function(r){ return '<tr><td>' + esc(x.label) + '</td><td>' + esc(r.batch) + '</td><td>' + esc(r.started.replace("T", " ").slice(0, 16)) + '</td><td>' + esc(r.models.join(", "))
        + '</td><td>' + esc(r.effort.join(", ")) + '</td><td>' + esc(r.cli) + '</td><td class="num">' + r.images + '</td><td class="num">' + money(r.cost_usd)
        + '</td><td class="num">' + mins(r.duration_s) + '</td></tr>'; }).join(""); }).join("")
    + (D.s5runs || []).map(function(r){ return '<tr><td>Sonnet 5, published: ' + esc((r["for"] || []).join(", ")) + '</td><td>—</td><td>' + esc((r.started || "").replace("T", " ").slice(0, 16)) + '</td><td>' + esc((r.models || []).join(", "))
        + '</td><td>' + esc((r.effort || []).join(", ")) + '</td><td>' + esc(r.cli) + '</td><td class="num">' + r.images + '</td><td class="num">' + money(r.cost_usd)
        + '</td><td class="num">' + mins(r.duration_s) + '</td></tr>'; }).join("")
    + '</tbody></table>'
    + '<h2 class="secth">Method</h2>'
    + '<ul class="notes">' + bnotes
    + '<li><b>Same images.</b> Byte-identical copies of the corpus drawings Sonnet 5 read, handed over under anonymised names (fig01…), because the corpus files are named after their compounds.</li>'
    + '<li><b>Same prompt.</b> The Sonnet 5 batches’ reader prompt, word for word, with only the image count, paths and answers file changed. Shown below.</li>'
    + '<li><b>Same agent and effort.</b> A Claude Code subagent with a shell, Python and RDKit, at max effort, spawned on an exact model id. The model is read from the API’s stamp on every response in the transcript, not from what the model says.</li>'
    + '<li><b>Same scorer.</b> RDKit canonical SMILES: exact, stereo-only, wrong or unparseable. Every run passed the same gate as the Sonnet 5 batches: no lookups in its transcript, every answer present in it.</li>'
    + '<li><b>What differs.</b> Batch size (published Sonnet 5 runs read ten per reader; in batch 1 the 5.5 run and the re-run read all eight together, in batch 2 each read ten per reader, two readers each), the Claude Code release, and the image names. The re-run and 5.5 share the prompt exactly.</li>'
    + '</ul>'
    + runs.slice(-1).map(function(r){ return '<details><summary>Reader prompt (latest run)</summary><div class="pre">' + esc(r.prompt) + '</div></details>'; }).join("")
    + '<footer>Built ' + esc(D.built.replace("T", " ").slice(0, 16)) + ' UTC. Prices: ' + esc(D.price.note) + ' Ground truth is PubChem; the published Sonnet 5 readings are the rows on the <a href="/?tab=sonnet">Sonnet tab</a>.</footer>';
}

document.addEventListener("contextmenu", function(e){
  if (!e.target.closest("code, .pre")) e.preventDefault();
});
document.addEventListener("selectstart", function(e){
  if (!e.target.closest("code, .pre")) e.preventDefault();
});
fetch("/wall/sonnet55.json", {cache: "no-cache"}).then(function(r){
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}).then(render).catch(function(e){
  $("#view").innerHTML = '<div class="err">No Sonnet 5.5 results yet (' + esc(e.message) + ').</div>';
});
</script>
