<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C-MAGE: Sonnet compare</title>
<meta name="description" content="Sonnet 5.5 against Sonnet 5 on the same chemical structure drawings, through the same blind pipeline and scorer: paired over the corpus, and on a hand-picked set.">
<link rel="icon" href="/static/favicon.png">
<style>
/* Same palette, type and header as the benchmark page (index.html), so this reads as
   another view of one site rather than a separate app. */
:root{
  --bg:#0d1117; --panel:#161b22; --line:#26303d; --ink:#e6edf3; --dim:#8b98a5;
  --exact:#2ea043; --stereo:#d29922; --wrong:#da3633; --invalid:#6e7681; --acc:#388bfd;
  /* One spacing scale for the whole page; every gap and margin below is one of these. */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --gut:14px; --maxw:1400px; --hh:60px;
}
*{box-sizing:border-box;touch-action:manipulation}
/* Same loupe policy as index.html: killed globally, given back to the SMILES strings,
   which are the one thing a chemist wants to select and copy. */
html,body{-webkit-touch-callout:none}
body{user-select:none;-webkit-user-select:none}
code,.pre{user-select:text;-webkit-user-select:text;-webkit-touch-callout:default}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
a{color:#58a6ff}
/* Inline links keep their place in the line but get a 44px tall hit box. */
.lede a,.tnote a,.cmpnote a,.facts a,.caveat a,.parentline a,.notes a,.sectsub a,footer a,.dl li a{display:inline-block;padding:13px 0;margin:-13px 0}
/* NOT the padding/negative-margin trick here: a clamped -webkit-box hides overflow at its padding
   edge, so the third line showed through the padding and sat on the next row. The anchor is the
   whole 44px cell instead, lines centred inside it, two lines at most. */
.dl li a.hit{display:flex;align-items:center;min-height:44px;min-width:0;padding:0;margin:0}
.dl li a.hit .clamp{line-height:1.3;max-height:2.6em}
.dl li{min-height:44px}
sup{font-size:max(12px,.72em);line-height:0}
header{position:sticky;top:0;z-index:20;background:rgba(13,17,23,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:12px;max-width:var(--maxw);margin:0 auto;
  padding:8px calc(var(--gut) + env(safe-area-inset-right)) 8px calc(var(--gut) + env(safe-area-inset-left));
  padding-top:calc(8px + env(safe-area-inset-top))}
.hrow>*{min-width:0}
.brand{font-weight:700;letter-spacing:.3px;font-size:16px;white-space:nowrap;color:var(--ink);text-decoration:none;
  min-height:44px;display:flex;align-items:center}
.seg{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:2px;margin-left:auto}
/* 44px tall: every tap target on the page clears the 44px floor. */
.seg a{color:var(--dim);font-size:14px;padding:0 13px;border-radius:6px;min-height:44px;
  display:flex;align-items:center;white-space:nowrap;text-decoration:none;flex:0 0 auto}
.seg a:hover{color:var(--ink)}
.ghost{border:1px solid var(--line);color:var(--ink);font-size:13px;padding:0 12px;border-radius:7px;
  min-height:44px;display:flex;align-items:center;white-space:nowrap;text-decoration:none;flex:0 0 auto}
/* #1f6feb, not the accent #388bfd: white 12.5px text on the accent is 3.3:1 and fails AA. */
.seg a[aria-current=page]{background:#1f6feb;color:#fff;font-weight:600}
main{max-width:var(--maxw);margin:0 auto;
  padding:0 calc(var(--gut) + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom))
          calc(var(--gut) + env(safe-area-inset-left))}
/* In-page section nav: a second header row on wide screens only (phones get the inline
   .jump list under the title instead, so the sticky header stays one row tall there). */
.toc{display:none;border-top:1px solid var(--line)}
.toc .tin{display:flex;gap:4px;max-width:var(--maxw);margin:0 auto;overflow-x:auto;scrollbar-width:none;
  padding:2px calc(var(--gut) + env(safe-area-inset-right)) 2px calc(var(--gut) + env(safe-area-inset-left))}
.toc .tin>*{min-width:0}
.toc span{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.6px;align-self:center;
  margin-right:var(--s2);white-space:nowrap}
.toc a{color:var(--dim);font-size:13px;text-decoration:none;padding:0 10px;min-height:44px;display:flex;
  align-items:center;border-radius:6px;white-space:nowrap;flex:0 0 auto}
.toc a:hover{color:var(--ink);background:var(--panel)}
.toc a.on{color:var(--ink);background:#21262d}

/* page intro + sections: one column, one rhythm. Each section is a head (title + lede),
   then a two-column summary (left: verdict, stat boxes, caveat; right: tables and their
   notes), then anything full width (lists, cards). */
.intro{padding:var(--s5) 0 0}
h1{font-size:24px;line-height:1.2;margin:0 0 var(--s2);letter-spacing:-.3px}
.lede{color:var(--dim);font-size:14.5px;margin:0;max-width:880px}
.sec{padding-top:var(--s6);margin-top:var(--s6);border-top:1px solid var(--line)}
.sec-head{margin-bottom:var(--s4)}
.sec-head h2{font-size:20px;line-height:1.25;font-weight:750;margin:0 0 var(--s2);letter-spacing:-.2px}
.split{display:grid;gap:var(--s5)}
.split>*{min-width:0}
.col{display:flex;flex-direction:column;gap:var(--s4);min-width:0}
.col>*{margin:0 !important}
.subh{font-size:16px;line-height:1.3;font-weight:700;margin:0 0 var(--s1)}
.block{margin-top:var(--s5)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.cmp .side{background:var(--panel);border:1px solid var(--line);padding:13px 14px;min-width:0;
  display:flex;flex-direction:column}
.cmp .track{margin-top:auto !important}
.cmp .of{margin-bottom:9px}
.cmp .who{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.cmp .pc{font-size:34px;font-weight:800;line-height:1;letter-spacing:-1px}
.cmp .pc small{font-size:16px;font-weight:600;color:var(--dim);letter-spacing:0;margin-left:3px}
.cmp .of{color:var(--dim);font-size:12.5px;margin-top:6px}
.cmpnote{color:var(--dim);font-size:12.5px;margin:0}
.cmpnote b{color:var(--ink)}
/* Callouts: one box, two meanings. Blue = the finding; amber = what limits it. Same width
   (the column), padding and spacing everywhere on the page. */
.verdict,.caveat{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);
  padding:var(--s3) var(--s4);margin:0;font-size:14px;line-height:1.55;color:var(--ink)}
.caveat{border-left-color:#d29922}
.verdict b{white-space:nowrap}
.cmp .track{height:7px;background:#0b0f14;margin-top:9px;overflow:hidden}
.cmp .track i{display:block;height:100%;background:var(--acc)}
.cmp .side.lead .track i{background:var(--exact)}
/* Outcome tally: one line per outcome, number first, so the three facts that answer
   "is 5.5 better on these" are readable without decoding a chart. */
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);margin:0}
.tally div{background:var(--panel);padding:10px 12px;min-width:0}
.tally b{display:block;font-size:22px;font-weight:800;line-height:1.1}
.tally span{color:var(--dim);font-size:12.5px;line-height:1.35;display:block;margin-top:3px}
.tally .up b{color:#3fb950} .tally .down b{color:#f87171}
.facts{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.facts li{font-size:13.5px;color:var(--dim);line-height:1.5}
.facts li b{color:var(--ink);font-weight:650}

/* cards */
.sectsub{color:var(--dim);font-size:13px;margin:0 0 var(--s3)}
.cards{display:grid;gap:var(--s4)}
.cards>*{min-width:0}
/* Flex column so the "SMILES" disclosure sits on the card's bottom edge and cards in one
   row end on one line. */
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);
  padding:var(--s3) var(--s4);min-width:0;display:flex;flex-direction:column}
.card>.body{margin-bottom:var(--s3)}
.sides .side-read{margin:0 0 var(--s2)}
.card>details{margin-top:auto}
.card.up{border-left-color:#3fb950} .card.down{border-left-color:#f87171}
.chead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.chead h3{margin:0;font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.ctype{color:var(--dim);font-size:12.5px;margin:3px 0 10px}
.delta{flex:0 0 auto;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.delta.up{background:#0f3d20;color:#4ade80}
.delta.down{background:#4a1513;color:#f87171}
.delta.same{background:#21262d;color:#c9d1d9}
/* Square corners on every white surface over the dark page: a radius leaves a pale
   fringe at each corner (SKILL, "the webapp"). */
figure{margin:0;background:#fff}
figure img{width:100%;display:block;aspect-ratio:1;object-fit:contain}
.src figure img{max-height:230px}
.src .cap,.arm .cap{color:var(--dim);font-size:12px;margin:5px 0 0}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.arm{min-width:0}
/* Label on one line, verdict on the next, in BOTH columns. Side by side on one line, a
   long badge ("stereo only") wrapped in one column and not the other, and the two
   drawings stopped lining up -- the one thing this layout is for. */
.alab{display:grid;gap:4px;justify-items:start;margin-bottom:6px;font-size:12.5px;font-weight:650}
.nofig{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:#0b0f14;
  border:1px dashed var(--line);color:var(--dim);font-size:12px;text-align:center;padding:8px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;
  text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
.badge.exact{background:#0f3d20;color:#4ade80} .badge.stereo{background:#3d3010;color:#fbbf24}
.badge.wrong{background:#4a1513;color:#f87171} .badge.invalid{background:#21262d;color:#c9d1d9}
.badge.truth{background:#12233c;color:#79b8ff}
.side-read{margin-top:8px;font-size:12.5px;color:var(--dim)}
.side-read b{color:var(--ink);font-weight:600}
details{margin-top:10px;border-top:1px solid var(--line)}
summary{cursor:pointer;color:#58a6ff;font-size:13.5px;padding:10px 0 4px;min-height:44px;
  display:flex;align-items:center}
.kv{margin:8px 0}
.kv label{display:block;color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.kv code{display:block;background:#0b0f14;border:1px solid var(--line);padding:8px 9px;
  font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;overflow-wrap:anywhere;color:var(--ink)}
.kv .note{color:var(--dim);font-size:12px;margin-top:3px}

/* runs + method */
table{border-collapse:collapse;width:100%;font-size:12.5px}
/* The runs table is wide: it spans the column, and scrolls sideways inside this wrapper
   only when the column is narrower than the table (phones). */
.tscroll{overflow-x:auto;max-width:100%}
table.runs{white-space:nowrap}
th,td{text-align:left;padding:7px 11px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.pre{background:#0b0f14;border:1px solid var(--line);padding:12px;margin-top:8px;
  font:12px/1.55 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;
  color:#c9d1d9;max-height:52vh;overflow-y:auto}
.notes{margin:var(--s2) 0 0 18px;padding:0}
.notes li{font-size:13px;color:var(--dim);line-height:1.5;margin:0 0 var(--s2);break-inside:avoid}
.notes li b{color:var(--ink)}
/* breakdown + calibration tables: fit 390 px without sideways scroll */
table.bd{white-space:normal}
table.bd th,table.bd td{padding:7px 7px}
table.bd td:first-child{min-width:0}
table.bd tr.tot td{font-weight:650;color:var(--ink)}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
table.bd .dim,.dim{color:var(--dim)}
table.bd td b{color:#4ade80}
.tnote{color:var(--dim);font-size:12.5px;margin:var(--s2) 0 0;line-height:1.5}
.tnote b{color:var(--ink)}
/* A long list shown capped, with a button that opens it in place: the corpus pairing's 42
   batches and ~110 differing images no longer push the next section 5,000 px down. */
.capbox{position:relative}
.capbox .cap-in{max-height:var(--cap,420px);overflow:hidden;
  -webkit-mask-image:linear-gradient(#000 calc(100% - 64px),transparent);
          mask-image:linear-gradient(#000 calc(100% - 64px),transparent)}
.capbox.open .cap-in,.capbox.fits .cap-in{max-height:none;-webkit-mask-image:none;mask-image:none}
.capbox.fits .more{display:none}
.more{margin-top:var(--s2);background:var(--panel);border:1px solid var(--line);color:#58a6ff;
  font:inherit;font-size:13px;min-height:44px;padding:0 var(--s4);cursor:pointer;border-radius:6px}
.more:hover{border-color:#58a6ff}
/* "Where they differ": a flat list, laid out 1 / 2 / 3 across by width. */
.dl{display:grid;grid-template-columns:minmax(0,1fr);column-gap:var(--s5);margin:0;padding:0;list-style:none}
.dl li{display:grid;grid-template-columns:minmax(0,1fr) 112px 64px;gap:var(--s2);align-items:center;
  padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px;min-width:0}
.dl li>*{min-width:0}
.dl li.dh{color:var(--dim);font-weight:600;padding:6px 0}
.dl li.dh.x{display:none}
.bt{display:inline-block;font-size:12px;font-weight:700;color:#c9d1d9;background:#21262d;padding:1px 7px;
  border-radius:20px;margin-right:4px;letter-spacing:.3px}
footer{color:var(--dim);font-size:12.5px;padding:var(--s5) 0 0;border-top:1px solid var(--line);margin-top:var(--s6)}
/* Novel structures: three headline boxes (kind A, kind B, corpus) and a card per molecule. */
[id]{scroll-margin-top:calc(var(--hh) + 12px)}
.cmp.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.jump{display:flex;flex-wrap:wrap;gap:0 10px;font-size:13px;margin:var(--s1) 0 0}
.jump a{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px}
/* Collapsed detail under a chart or verdict: the long version lives here, one tap away. */
details.fold{margin-top:var(--s2);border-top:1px solid var(--line)}
details.fold>summary{list-style:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"▸";display:inline-block;width:1.1em;color:var(--dim);transition:transform .15s}
details.fold[open]>summary::before{transform:rotate(90deg)}
details.fold>*:not(summary){margin-top:var(--s2)}
details.fold .caveat,details.fold .cmpnote,details.fold .tnote,details.fold .facts{margin-top:var(--s2) !important}
.kind{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:20px;margin-right:4px;
  letter-spacing:.3px;background:#12233c;color:#79b8ff}
.kind.b{background:#2a1f3d;color:#d2a8ff}
.kind.c{background:#3d2a10;color:#f0b35a}
.delta.auto{background:#4a1513;color:#f87171}
.parentline{color:var(--dim);font-size:12.5px;margin:-4px 0 var(--s3)}
.parentline b{color:var(--ink);font-weight:600}
.err{background:#4a1513;color:#f87171;padding:12px 14px;margin:16px 0}

@media(max-width:560px){
  /* Same header as index.html at this width: five tabs that scroll sideways (the active one
     scrolled into view, the right edge fading while there is more), the upload button, no
     wordmark. flex-start, not center: centring an overflowing row strands its first tab. */
  .hrow{gap:8px;padding:6px 12px}
  .brand{display:none}
  .seg{margin-left:0;flex:1 1 auto;justify-content:flex-start;min-width:0;overflow-x:auto;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 22px);
            mask-image:linear-gradient(90deg,transparent,#000 22px)}
  .seg.at-start{-webkit-mask-image:none;mask-image:none}
  .seg::-webkit-scrollbar{display:none}
  .seg a{padding:0 9px;font-size:12.5px}
  .ghost{padding:0 9px;font-size:12px}
  h1{font-size:21px}
  .cmp .pc{font-size:28px}
  .cmp .side{padding:11px 10px}
  /* Three boxes at 390px: a label may take two lines, so every label reserves two and the
     numbers stay on one baseline across the row. */
  .cmp .who{font-size:12px;letter-spacing:.3px;line-height:1.35;min-height:2.7em}
  .tally b{font-size:20px}
  .sec{padding-top:var(--s5);margin-top:var(--s5)}
  .sec-head h2{font-size:18px}
  .card{padding:var(--s3)}
}
@media(max-width:359px){ .seg a{padding:0 6px;font-size:12px}
  .cmp.three{gap:var(--s2)} .cmp.three .side{padding:10px 8px} }
@media(min-width:640px){
  .dl{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dl li.dh.x2{display:grid}
}
/* Tablet: two cards per row, each keeping the phone's inner layout (drawing on top). */
@media(min-width:700px){
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  /* Every card has the same five parts (title, type line, parent line or re-runs, drawings,
     SMILES), so each row of cards shares one set of row tracks: the drawings start level
     and the SMILES disclosures end level, whatever wraps in the text above them. */
  @supports (grid-template-rows:subgrid){
    .card{display:grid;grid-template-rows:subgrid;grid-row:span 5;row-gap:0;align-content:start}
  }
}
/* Desktop: the section summary splits into two equal columns (the same split in every
   section, so column edges line up down the page); two cards per row, and inside each card
   the drawing and both readings sit side by side, so the whole comparison is one glance. */
@media(min-width:900px){
  :root{--gut:24px}
  h1{font-size:28px}
  .split{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s6);align-items:start}
  .body{display:grid;grid-template-columns:1fr 2fr;gap:10px;align-items:start}
  .pair{margin-top:0}
  .src figure img{max-height:none}
  .notes{columns:2;column-gap:var(--s6)}
  .sec{padding-top:var(--s7);margin-top:var(--s7)}
  .sec-head h2{font-size:22px}
  .intro+.sec{padding-top:var(--s6);margin-top:var(--s6)}
}
@media(min-width:1000px){
  .toc{display:block}
  .jump{display:none}
}
@media(min-width:1200px){
  :root{--gut:32px}
  .dl{grid-template-columns:repeat(3,minmax(0,1fr))}
  .dl li.dh.x3{display:grid}
}
</style>

<script>
"use strict";
var $ = function(s){ return document.querySelector(s); };
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
var VLABEL = {exact: "exact", stereo: "stereo only", wrong: "wrong", invalid: "unparseable"};
function badge(v){ return '<span class="badge ' + esc(v) + '">' + esc(VLABEL[v] || v) + '</span>'; }
function mins(s){ return s >= 90 ? Math.round(s / 60) + " min" : Math.round(s) + " s"; }
function money(x){ return "$" + Number(x).toFixed(2); }

/* What the reading got wrong, in words, computed from the payload rather than asserted:
   the relation build_wall.relate() found and the graded ladder's formula check. */
function detail(a){
  if (a.v === "exact") return "Identical to the reference after RDKit canonicalisation.";
  if (a.v === "invalid") return "RDKit cannot parse this SMILES.";
  var bits = [];
  if (a.r && a.r.stereo) bits.push(a.r.stereo[0] + " of " + a.r.stereo[1] + " stereocentres disagree");
  if (a.r && a.r.geom) bits.push(a.r.geom + " double-bond geometr" + (a.r.geom === 1 ? "y differs" : "ies differ"));
  if (a.formula === false) bits.push("formula differs (" + (a.heavy > 0 ? "+" : "") + a.heavy + " heavy atoms)");
  else if (a.v === "wrong") bits.push("same formula, different connectivity");
  return bits.join("; ") + ".";
}

function arm(label, a, dir, k){
  var img = a.p
    ? '<figure><img loading="lazy" decoding="async" src="/wall/' + dir + '/' + encodeURIComponent(k)
      + '.png" alt="' + esc(label) + ' reading, drawn back with RDKit"></figure>'
    : '<div class="nofig">no drawable SMILES</div>';
  var conf = a.conf != null && a.conf !== "" ? "confidence " + esc(a.conf) : "no confidence given";
  return '<div class="arm"><div class="alab"><span>' + esc(label) + '</span>' + badge(a.v) + '</div>'
    + img + '<p class="cap">' + conf + '</p></div>';
}

/* The badge compares 5.5 with the SAME-PROMPT re-run when one exists, not with the published
   run: the published run is why an image was picked, so it flatters any second attempt. */
function baseRead(r, D){
  var lab = D.stats && D.stats.base;
  return (r.side || []).filter(function(x){ return x.label === lab; })[0] || null;
}
function card(r, D){
  var base = baseRead(r, D), bv = base ? base.v : r.s5.v, who = base ? "re-run" : "Sonnet 5";
  var up = r.s55.v === "exact" && bv !== "exact", down = r.s55.v !== "exact" && bv === "exact";
  var d = up ? ["up", "5.5 ahead of " + who] : down ? ["down", "5.5 behind " + who]
        : ["same", r.s55.v === "exact" ? "both right" : "both miss"];
  var side = (r.side || []).map(function(x){
    return '<div class="side-read">' + esc(x.label) + ' (same prompt as 5.5): ' + badge(x.v)
      + (x.conf != null ? ' confidence ' + esc(x.conf) : '') + '</div>'; }).join("");
  var kv = function(lab, smi, note){
    return '<div class="kv"><label>' + esc(lab) + '</label><code>' + esc(smi || "(none)") + '</code>'
      + (note ? '<div class="note">' + esc(note) + '</div>' : '') + '</div>'; };
  var why = r.role === "control" ? "Sonnet 5 read it exactly, at confidence " + (r.s5.conf == null ? "?" : r.s5.conf)
                                 : "Sonnet 5 miss: " + r.type;
  return '<article class="card ' + (d[0] === "same" ? "" : d[0]) + '" id="' + esc(r.k) + '">'
    + '<div class="chead"><h3>' + esc(r.n) + '</h3><span class="delta ' + d[0] + '">' + d[1] + '</span></div>'
    + '<div class="ctype"><span class="bt">Batch ' + esc(r.batch) + '</span> ' + esc(why) + '</div>'
    + '<div class="body"><div class="src"><div class="alab"><span>The drawing</span>'
    + '<span class="badge truth">what all read</span></div>'
    + '<figure><img loading="lazy" decoding="async" src="/wall/sonnet55/'
    + encodeURIComponent(r.k) + '.png" alt="The drawing the models read: ' + esc(r.n) + '"></figure></div>'
    + '<div class="pair">' + arm("Sonnet 5, published", r.s5, "sonnet55_s5", r.k) + arm("Sonnet 5.5", r.s55, "sonnet55_pred", r.k) + '</div></div>'
    + '<div class="sides">' + side + '</div>'
    + '<details><summary>SMILES and what differs</summary>'
    + kv("Ground truth", r.t)
    + kv("Sonnet 5, published", r.s5.s, detail(r.s5))
    + (r.side || []).map(function(x){ return kv(x.label, x.s, x.v === "exact" ? "Identical to the reference after RDKit canonicalisation." : "Verdict: " + (VLABEL[x.v] || x.v) + "."); }).join("")
    + kv("Sonnet 5.5", r.s55.s, detail(r.s55))
    + kv("CXMolScribe (pipeline), " + (VLABEL[r.cx.v] || r.cx.v), r.cx.s)
    + '</details></article>';
}

function pfmt(p){
  if (p >= 0.995) return "1.0";
  if (p < 0.001) { var e = p.toExponential(1).split("e"); return e[0] + "&times;10<sup>" + e[1].replace("-", "&minus;") + "</sup>"; }
  return p.toFixed(p < 0.1 ? 3 : 2);
}
function perReader(xs){ return xs.map(function(x){ return x.exact + "/" + x.n; }).join(", "); }
/* Name the images only while the list is short; past six it buries the verdict on a phone,
   and every card below carries its own "ahead"/"behind" badge. */
function names(xs){ return xs.length && xs.length <= 6 ? ' (' + esc(xs.join(", ")) + ')' : ''; }

/* The corpus pairing: Sonnet 5.5's corpus arm (the Sonnet 5.5 tab) against the Sonnet 5 arm on
   the same images. Kept visibly apart from the hand-picked set below it, because those were
   chosen on Sonnet 5's failures and these were not chosen at all. Covers ONLY the images both arms
   read: the Sonnet 5 arm stopped, and Sonnet 5.5 rows past it are tallied apart (C.pairing), never here. */
/* A capped list with an in-place "show all" (see .capbox). The button is hidden by
   fitCaps() when the content is shorter than the cap. */
function capbox(inner, n, noun, cap){
  return '<div class="capbox" style="--cap:' + cap + 'px"><div class="cap-in">' + inner + '</div>'
    + '<button type="button" class="more" aria-expanded="false" data-all="Show all ' + n + ' ' + esc(noun) + '">Show all '
    + n + ' ' + esc(noun) + '</button></div>';
}
function fitCaps(){
  document.querySelectorAll(".capbox").forEach(function(b){
    var i = b.querySelector(".cap-in");
    b.classList.toggle("fits", !b.classList.contains("open") && i.scrollHeight <= i.clientHeight + 2);
  });
}
document.addEventListener("click", function(e){
  var btn = e.target.closest(".capbox .more");
  if (!btn) return;
  var b = btn.parentNode, open = !b.classList.contains("open");
  b.classList.toggle("open", open);
  btn.setAttribute("aria-expanded", open ? "true" : "false");
  btn.textContent = open ? "Show fewer" : btn.getAttribute("data-all");
  if (!open && b.getBoundingClientRect().top < 0) b.scrollIntoView();
});

function intro(){
  return '<section class="intro"><h1>Sonnet 5.5 vs Sonnet 5</h1>'
    + '<p class="lede">Three sets, kept apart: the <b>corpus, paired</b> image for image on the images both models read (nothing skipped); <b>novel structures</b> no model can have memorised; and <b>28 hand-picked</b> images chosen on Sonnet 5’s failures. '
    + 'Same images, same blind pipeline, same RDKit scorer. The <a href="/sonnet-report#failures">findings report</a> classifies every miss and shows the missed drawings.</p>'
    + '<nav class="jump" aria-label="Sections"><a href="#corpus">Corpus, paired</a><a href="#novel">Novel structures</a><a href="#kindc">Hard edits</a><a href="#handpicked">Hand-picked</a><a href="/sonnet-report">Findings report</a></nav>'
    + '</section>';
}

      + capbox('<ul class="dl">' + dh('') + dh(' x x2') + dh(' x x3')
        + C.diff.map(function(x){ return '<li><a class="hit" title="' + esc(x.n) + '" href="/?tab=sonnet55"><span class="clamp">'
          + esc(x.n) + '</span></a><span>' + badge(x.s5) + '</span><span>' + badge(x.s55) + '</span></li>'; }).join("") + '</ul>',
        C.diff.length, "images", 440)
      + '</div>' : '';
  var caveat = '<div class="caveat"><b>Unselected, but still one reading each.</b> '

    + (C.pairing && C.pairing.only_text ? esc(C.pairing.only_text) + ' They are on the Sonnet 5.5 tab. '

    + (C.protocol ? '<p class="cmpnote"><b>Single-image readers from row ' + C.protocol.s55c_from_row + '</b> of the Sonnet 5.5 tab and row '

      + (C.protocol.s5_stopped_at ? '; until Sonnet 5 stopped (' + esc(C.protocol.s5_stopped_at.slice(0, 10)) + ') both models read each new image at the same time. '

/* NOVEL STRUCTURES (wall/sonnet_novel.json, tools/build_novel.py): molecules Sonnet 5.5 cannot have
   memorised, drawn with the corpus renderer. Kind A is a famous corpus drug with ONE edit; an answer
   equal to the PARENT instead of the edit is flagged "autocorrected to parent". Kind B is de novo. */
function novelCard(r){
  var ok = r.s55.v === "exact";
  var d = r.auto ? ["auto", "autocorrected to parent"] : ok ? ["up", "5.5 exact"] : ["down", "5.5 " + (VLABEL[r.s55.v] || r.s55.v)];
  var edited = r.kind === "A" || r.kind === "C";
  var title = edited ? r.parent + ", edited" : "De novo " + r.k.replace("novel_", "");
  var sub = edited ? r.edit : r.fragments;
  var kv = function(lab, smi, note){
    return '<div class="kv"><label>' + esc(lab) + '</label><code>' + esc(smi || "(none)") + '</code>'
      + (note ? '<div class="note">' + esc(note) + '</div>' : '') + '</div>'; };
  /* One scale on every card: CXMolScribe's 0-1 score is stored x100, the same 0-100 the reader states. */
  var cxArm = {v: r.cx.v, p: r.cx.p, conf: r.cx.conf};
  var pr = r.parent_read;
  var pl = edited ? '<p class="parentline">Parent: <b>' + esc(r.parent) + '</b>'
      + (pr ? ' (5.5 read the unedited parent ' + esc(VLABEL[pr.v] || pr.v) + ', ' + esc(pr.source) + '; CXMolScribe ' + esc(VLABEL[r.parent_cx] || r.parent_cx) + ')'
            : r.parent_corpus ? ' (5.5 read the parent ' + esc(VLABEL[r.parent_corpus] || r.parent_corpus) + ' in the corpus)' : '')
      + (r.fail ? '. <b>5.5 miss: ' + esc(r.fail) + '</b>' : '')
      + (r.named_parent ? '. 5.5 recognised it as an analogue of the parent' : '') + '.</p>'
    : '<p class="parentline">' + (r.pubchem.length ? 'PubChem CID ' + esc(r.pubchem.join(", ")) : '<b>No PubChem record</b> for this InChIKey')
      + '; ' + r.heavy + ' heavy atoms, ' + r.stereocentres + ' stereocentre' + (r.stereocentres === 1 ? '' : 's') + '.</p>';
  return '<article class="card ' + (ok ? "up" : "down") + '" id="' + esc(r.k) + '">'
    + '<div class="chead"><h3>' + esc(title) + '</h3><span class="delta ' + d[0] + '">' + esc(d[1]) + '</span></div>'
    + '<div class="ctype"><span class="kind' + (r.kind === "B" ? " b" : r.kind === "C" ? " c" : "") + '">' + (r.kind === "A" ? "Edited drug" : r.kind === "C" ? "Hard edit" : "De novo") + '</span> ' + esc(sub) + '</div>'
    + pl
    + '<div class="body"><div class="src"><div class="alab"><span>The drawing</span><span class="badge truth">what both read</span></div>'
    + '<figure><img loading="lazy" decoding="async" src="/wall/novel/' + encodeURIComponent(r.k)
    + '.png" alt="The drawing: ' + esc(title) + '"></figure></div>'
    + '<div class="pair">' + arm("Sonnet 5.5", r.s55, "novel_pred", r.k) + arm("CXMolScribe", cxArm, "novel_cx", r.k) + '</div></div>'
    + '<details><summary>SMILES and what differs</summary>'
    + kv("Ground truth (the edited molecule)", r.t)
    + (edited ? kv("Parent drug, " + r.parent, r.parent_t, r.auto ? "Sonnet 5.5's answer is this molecule: it drew the drug it knows, not the edit." : "") : "")
    + (pr ? kv("Sonnet 5.5 on the unedited parent (" + pr.source + "), " + (VLABEL[pr.v] || pr.v), pr.s) : "")
    + kv("Sonnet 5.5" + (r.s55.name ? ", named it: " + r.s55.name : ""), r.s55.s, detail(r.s55))
    + kv("CXMolScribe (pipeline), " + (VLABEL[r.cx.v] || r.cx.v), r.cx.s)
    + '</details></article>';
}
function novelSection(N, live){
  var pct = function(a, n){ return n ? Math.round(a / n * 1000) / 10 : 0; };
  var box = function(lab, x, n, note, lead){
    return '<div class="side' + (lead ? ' lead' : '') + '"><div class="who">' + esc(lab) + '</div>'
      + '<div class="pc">' + x + '<small>/ ' + n + '</small></div><div class="of">' + esc(note) + '</div>'
      + '<div class="track"><i style="width:' + Math.round(x / n * 100) + '%"></i></div></div>'; };
  /* The corpus figure is taken LIVE from sonnet_compare.json, which the corpus cadence rebuilds every publish,
     so it cannot go stale beside this fixed set; the snapshot in sonnet_novel.json is only the fallback. */
  /* The live corpus pairing is the figure to set these against. It used to be taken only when the
     pairing had no unpaired rows, which stopped being true for good once the dual-arm cadence ran
     the two arms a few keys apart, so the section fell back to a 420-row snapshot. Paired n is the
     right denominator whether or not a few 5.5 rows are still waiting for their Sonnet 5 reading. */
  var A = N.A, B = N.B, C = live && live.n ? {n: live.n, s55: live.s55, cx: live.cx} : N.corpus;
  var verdict = 'Sonnet 5.5: <b>' + A.s55 + '/' + A.n + '</b> edited drugs, <b>' + B.s55 + '/' + B.n
    + '</b> de novo, against <b>' + C.s55 + '/' + C.n + '</b> (' + pct(C.s55, C.n) + '%) on the corpus. '
    + (A.auto ? '<b>' + A.auto + '</b> edited drugs came back as the PARENT: it drew what it remembered. '
              : '<b>None</b> came back as the parent drug. ')
    + 'CXMolScribe, with no names to recall: ' + A.cx + '/' + A.n + ' and ' + B.cx + '/' + B.n + '.';
  var rows = N.rows.slice().sort(function(a, b){
    var bad = function(x){ return x.auto ? 0 : x.s55.v !== "exact" ? 1 : 2; };
    return bad(a) - bad(b) || (a.kind < b.kind ? -1 : a.kind > b.kind ? 1 : 0) || (a.k < b.k ? -1 : 1); });
  return '<section class="sec" id="novel"><div class="sec-head">'
    + '<h2>Novel structures: reading, not recall</h2>'
    + '<p class="lede">' + N.all.n + ' molecules no model can have memorised: <b>' + A.n + ' corpus drugs with one edit</b> and <b>' + B.n + ' de novo</b> assemblies with no PubChem record, drawn by the corpus renderer and read blind through the same pipeline.</p>'
    + '</div><div class="split"><div class="col">'
    + '<div class="verdict">' + verdict + '</div>'
    + '<div class="cmp three">' + box("Edited drugs", A.s55, A.n, "Sonnet 5.5", A.s55 === A.n)
    + box("De novo", B.s55, B.n, "Sonnet 5.5", B.s55 === B.n) + box("Corpus", C.s55, C.n, "Sonnet 5.5 tab", false) + '</div>'
    + '</div><div class="col"><div>'
    + '<table class="bd"><thead><tr><th>Set</th><th class="num">n</th><th class="num">5.5 exact</th><th class="num">Parent</th><th class="num">CXMS</th></tr></thead><tbody>'
    + '<tr><td>Edited drugs (A)</td><td class="num">' + A.n + '</td><td class="num"><b>' + A.s55 + '</b></td><td class="num">' + A.auto + '</td><td class="num dim">' + A.cx + '</td></tr>'
    + '<tr><td>De novo (B)</td><td class="num">' + B.n + '</td><td class="num"><b>' + B.s55 + '</b></td><td class="num dim">n/a</td><td class="num dim">' + B.cx + '</td></tr>'
    + '<tr class="tot"><td>Corpus, paired</td><td class="num">' + C.n + '</td><td class="num"><b>' + C.s55 + '</b></td><td class="num dim">n/a</td><td class="num dim">' + C.cx + '</td></tr>'
    + '</tbody></table>'
    + '<details class="fold"><summary>What the edits are, “parent”, cost, caveats</summary>'
    + '<p class="tnote">Edits: a halogen swapped, a substituent moved, N for CH, a methyl added or removed, one stereocentre inverted, a ring resized. '
    + '<b>Parent</b> counts answers that equal the unedited drug (scored against it with the same RDKit rule). '
    + 'The corpus arm (alphabetical) has reached ' + N.parents.n + ' of the ' + A.n + ' parents so far'
    + (N.parents.n ? ' and read ' + N.parents.s55 + ' of ' + N.parents.n + ' exactly' : '') + '. '
    + '5.5 named ' + N.named_parent + ' of the ' + A.n + ' edited drugs as analogues of their parent'
    + (N.rows.some(function(x){ return x.named_parent && x.s55.v !== "exact"; }) ? '. ' : ', and drew the edit every time. ')
    + (function(){ var X = N.spend ? N.spend.AB : {cost: N.cost, seconds: N.seconds, readers: N.runs.length, images: N.images};
        return 'Cost ' + money(X.cost) + ' at list price, ' + mins(X.seconds) + ' of reader time over ' + X.readers + ' readers of ' + Math.round(X.images / X.readers) + ' images each. '; })()
    + 'CXMolScribe is one stage-3 run on the same files; it is not deterministic.</p>'
    + '<div class="caveat"><b>Twenty images, and easy ones.</b> One reading each, so one miss moves a kind by 8 to 12 points. '
    + (A.cx + B.cx === N.all.n ? 'CXMolScribe, which has nothing to recall, also read every one, so these clean drug-like drawings sit near the ceiling for both readers. ' : '')
    + 'What the set does test is substitution: whether a model that recognises the parent draws the parent. The hard follow-up is <a href="#kindc">kind C</a> below.</div>'
    + '</details></div>'
    + '</div></div>'
    + '<div class="cards block">' + rows.filter(function(r){ return r.kind !== "C"; }).map(novelCard).join("") + '</div>'
    + '</section>' + (N.C && N.C.n ? kindC(N, rows.filter(function(r){ return r.kind === "C"; }), C) : '');
}
/* KIND C, HARD EDITS: one edit in the hard part of a CXMolScribe-failing corpus drug (macrocycle,
   dense stereo, glycoside, peptide). The recall signal is the PARENT-vs-EDIT gap: the same model on
   the unedited drawing against the edited one. Stereo-agnostic and autocorrect counts beside it. */
function kindC(N, rows, K){
  var C = N.C, pct = function(a, n){ return n ? Math.round(a / n * 100) : 0; };
  var gap = pct(C.edit_s55, C.paired) - pct(C.parent_s55, C.paired);
  var box = function(lab, x, n, note){
    return '<div class="side"><div class="who">' + esc(lab) + '</div>'
      + '<div class="pc">' + x + '<small>/ ' + n + '</small></div><div class="of">' + esc(note) + '</div>'
      + '<div class="track"><i style="width:' + Math.round(x / n * 100) + '%"></i></div></div>'; };
  var nd = C.edit_only.length + C.parent_only.length;
  var named = rows.filter(function(x){ return x.named_parent; }).length;
  var verdict = 'Same ' + C.paired + ' molecules: Sonnet 5.5 read the parent exactly <b>' + C.parent_s55 + '</b> times and the one-edit version <b>'
    + C.edit_s55 + '</b> times (<b>' + (gap > 0 ? '+' : gap < 0 ? '&minus;' : '&plusmn;') + Math.abs(gap) + ' points</b> on the edit'
    + (nd ? '; right only on the parent ' + C.parent_only.length + ', only on the edit ' + C.edit_only.length + ', exact McNemar p = ' + pfmt(C.p) + '). ' : '). ')
    + (C.auto ? '<b>' + C.auto + '</b> edited answer' + (C.auto === 1 ? ' was' : 's were') + ' the parent drug itself (autocorrected). '
              : '<b>No</b> answer was the parent itself' + (named ? ', though ' + named + ' of ' + C.n + ' named the parent and drew the edit anyway. ' : '. '))
    + 'CXMolScribe: ' + C.cx + '/' + C.n + ' edits, ' + C.parent_cx + '/' + C.n + ' parents (every parent was picked as a CXMolScribe miss).';
  var A = N.A, B = N.B, pc = function(a, n){ return n ? Math.round(a / n * 1000) / 10 : 0; };
  var SP = N.spend || {}, sc = SP.C || {}, sp = SP.P || {};
  var compare = '<p class="tnote"><b>Against the easy sets and the corpus:</b> Sonnet 5.5 exact on kind A '
    + A.s55 + '/' + A.n + ', kind B ' + B.s55 + '/' + B.n + ', kind C <b>' + C.s55 + '/' + C.n + '</b> (' + pc(C.s55, C.n) + '%), corpus '
    + K.s55 + '/' + K.n + ' (' + pc(K.s55, K.n) + '%). CXMolScribe ' + A.cx + '/' + A.n + ', ' + B.cx + '/' + B.n + ', <b>' + C.cx + '/' + C.n + '</b>, corpus '
    + K.cx + '/' + K.n + '.'
    + (C.conf_right != null ? ' Stated confidence (0-100): ' + C.conf_right + ' on average when right' + (C.conf_wrong != null ? ', ' + C.conf_wrong + ' when wrong (highest ' + C.conf_wrong_max + ')' : '') + '; CXMolScribe averaged ' + C.cx_conf_mean + ' on the same scale.' : '')
    + (sc.readers ? ' Cost ' + money(sc.cost) + ' and ' + mins(sc.seconds) + ' of reader time for the ' + sc.images + ' hard edits (' + sc.readers + ' readers), '
       + money(sc.cost / sc.images) + ' an image against ' + money(SP.AB.cost / SP.AB.images) + ' on kinds A and B' + (sp.readers ? '; the ' + sp.images + ' fresh parents ' + money(sp.cost) : '') + '.' : '')
    + '</p>';
  var fl = C.fails.length ? '<table class="bd"><thead><tr><th>5.5 missed</th><th>What went wrong</th><th class="num">Conf</th></tr></thead><tbody>'
      + C.fails.map(function(f){ return '<tr><td><a class="clamp" href="#' + esc(f.k) + '">' + esc(f.parent) + '</a><span class="dim clamp">' + esc(f.edit) + '</span></td><td>'
        + esc(f.fail) + '</td><td class="num">' + esc(f.conf) + '</td></tr>'; }).join("") + '</tbody></table>'
    : '<p class="tnote">Sonnet 5.5 missed none of the hard edits.</p>';
  var cxm = {}; rows.forEach(function(x){ if (x.cx.v !== "exact") cxm[x.cx.v] = (cxm[x.cx.v] || 0) + 1; });
  var cxl = Object.keys(cxm).sort(function(a, b){ return cxm[b] - cxm[a]; })
    .map(function(v){ return cxm[v] + ' ' + (VLABEL[v] || v).toLowerCase(); }).join(", ");
  fl += cxl ? '<p class="tnote">CXMolScribe\u2019s ' + (C.n - C.cx) + ' misses on the same drawings: ' + esc(cxl) + '.</p>' : '';
  var cards = rows.slice().sort(function(a, b){ var bad = function(x){ return x.auto ? 0 : x.s55.v !== "exact" ? 1 : 2; };
    return bad(a) - bad(b) || (a.k < b.k ? -1 : 1); });
  return '<section class="sec" id="kindc"><div class="sec-head">'
    + '<h2>Kind C: hard edits</h2>'
    + '<p class="lede">' + C.n + ' corpus drugs CXMolScribe fails (macrocycles, dense-stereo steroids, bridged polycycles, glycosides, cyclic peptides), each with <b>one edit in the hard part</b>; '
    + C.stereo_only_edits + ' of ' + C.n + ' edits are stereo-only. Same renderer, prompt, sandbox, gate and scorer.</p>'
    + '</div><div class="split"><div class="col">'
    + '<div class="verdict">' + verdict + '</div>'
    + '<div><div class="cmp three">' + box("Unedited parents", C.parent_s55, C.paired, "Sonnet 5.5")
    + box("Hard edits", C.edit_s55, C.paired, "Sonnet 5.5") + box("Hard edits", C.cx, C.n, "CXMolScribe") + '</div>'
    + '<details class="fold"><summary>Against the easy sets and the corpus; confidence; cost</summary>' + compare + '</details></div>'
    + '</div><div class="col"><div>'
    + '<table class="bd"><thead><tr><th>Kind C, n = ' + C.n + '</th><th class="num">5.5</th><th class="num">CXMS</th></tr></thead><tbody>'
    + '<tr><td>Exact</td><td class="num"><b>' + C.s55 + '</b></td><td class="num dim">' + C.cx + '</td></tr>'
    + '<tr><td>Exact ignoring stereo</td><td class="num"><b>' + C.stereo_agnostic + '</b></td><td class="num dim">' + C.cx_stereo_agnostic + '</td></tr>'
    + '<tr><td>Answer is the parent</td><td class="num"><b>' + C.auto + '</b></td><td class="num dim">' + C.cx_auto + '</td></tr>'
    + '<tr class="tot"><td>Unedited parents, exact</td><td class="num"><b>' + C.parent_s55 + '</b></td><td class="num dim">' + C.parent_cx + '</td></tr>'
    + '</tbody></table>'
    + '<details class="fold"><summary>Where the parent readings come from</summary><p class="tnote">' + C.parent_from_corpus + ' come from the Sonnet 5.5 corpus lane, which already read those corpus images with the same prompt file; the other '
    + (C.paired - C.parent_from_corpus) + ' were read fresh here, in a reader of their own, never beside their edits. CXMolScribe on the parents is the corpus row; every parent was picked as a CXMolScribe corpus miss, so its parent score is zero by construction. '
    + 'Stereo-agnostic counts an answer right once stereochemistry is dropped from both sides.</p></details></div>'
    + '<div><h3 class="subh">Where 5.5 went wrong</h3>' + fl + '</div>'
    + '</div></div>'
    + '<div class="cards block">' + cards.map(novelCard).join("") + '</div>'
    + '</section>';
}
function loadNovel(live){
  var slot = $("#novelslot");
  if (!slot) return;
  fetch("/wall/sonnet_novel.json", {cache: "no-cache"}).then(function(r){
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then(function(N){
      slot.innerHTML = novelSection(N, live); fitCaps(); spy();
      /* The anchor may only exist now that this section has rendered. */
      var h = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
      if (h && slot.contains(h)) h.scrollIntoView(); })
    .catch(function(e){ slot.innerHTML = '<div class="err">Novel structures: no results yet (' + esc(e.message) + ').</div>'; });
}

function render(D){
  var S = D.summary, T = D.stats, v = $("#view");
  var O = T ? T.overall : null;
  var sideOf = function(lab){ return (D.side || []).filter(function(x){ return x.label === lab; })[0]; };
  var B = T ? sideOf(T.base) : null;
  var runs = D.runs || [];
  var verdict, cmp = "", tally = "";
  var more = '';
  if (O) {
    var N = T.noise;
    verdict = 'Identical prompt, ' + O.n + ' images: Sonnet 5.5 <b>' + O.s55 + '/' + O.n + '</b>, Sonnet 5 re-run <b>' + O.base + '/' + O.n
      + '</b>; 5.5 ahead on ' + O.ahead + ', behind on ' + O.behind + ' (exact McNemar <b>p = ' + pfmt(O.p) + '</b>'
      + (O.p < 0.05 ? ', not run-to-run noise).' : ', not significant).');
    more = '<p class="tnote">5.5 ahead on' + names(O.ahead_names) + (O.ahead_names.length > 6 ? ' ' + O.ahead + ' images' : '') + '; behind on ' + O.behind + names(O.behind_names) + '. '
      + (T.readers ? 'McNemar treats images as independent, but each reader reads its batch in one context; per reader, '
        + 'Sonnet 5.5 scored ' + perReader(T.readers["Sonnet 5.5"]) + ' and the Sonnet 5 re-run '
        + perReader(T.readers[T.base])
        + (Math.min.apply(null, T.readers["Sonnet 5.5"].map(function(x){ return x.exact / x.n; }))
             > Math.max.apply(null, T.readers[T.base].map(function(x){ return x.exact / x.n; }))
           ? ', so every 5.5 reader beat every re-run reader. ' : ', so the reader-level picture is mixed. ') : '')
      + 'Sonnet 5 on its own is noisy here: the re-run fixed ' + N.published_miss_rerun_right + ' of the ' + N.published_miss_n
      + ' published misses and lost ' + N.published_right_rerun_miss + ' of the ' + N.published_right_n + ' published rights.</p>';
    var sides = [["Sonnet 5, re-run", O.base, "same prompt as 5.5"], ["Sonnet 5.5", O.s55, "same prompt"]];
    var best = Math.max(O.base, O.s55);
    cmp = sides.map(function(x){
      return '<div class="side' + (x[1] === best ? " lead" : "") + '"><div class="who">' + esc(x[0]) + '</div>'
        + '<div class="pc">' + x[1] + '<small>/ ' + O.n + '</small></div>'
        + '<div class="of">' + esc(x[2]) + '</div>'
        + '<div class="track"><i style="width:' + Math.round(x[1] / O.n * 100) + '%"></i></div></div>'; }).join("");
    tally = '<div class="tally"><div class="' + (O.ahead ? 'up' : '') + '"><b>' + O.ahead + '</b><span>5.5 right, re-run wrong</span></div>'
      + '<div class="' + (O.behind ? 'down' : '') + '"><b>' + O.behind + '</b><span>re-run right, 5.5 wrong</span></div>'
      + '<div><b>' + (O.n - O.ahead - O.behind) + '</b><span>same result</span></div></div>';
  } else {
    verdict = 'No same-prompt Sonnet 5 re-run yet, so this cannot separate a model difference from noise.';
  }
  if (T && T.rerun_vs_rerun) more += '<p class="tnote">On batch 1, two independent Sonnet 5 re-runs agreed on '
    + T.rerun_vs_rerun.agree + ' of ' + T.rerun_vs_rerun.n + '.</p>';

  /* Breakdown: one row per slice, the published run shown only for context. */
  var bd = T ? '<table class="bd"><thead><tr><th>Slice</th><th class="num">n</th><th class="num">Pub&shy;lished</th>'
      + '<th class="num">Re-run</th><th class="num">5.5</th><th class="num">p</th></tr></thead><tbody>'
      + T.groups.map(function(g){
          return '<tr' + (g.label === "All images" ? ' class="tot"' : '') + '><td>' + esc(g.label) + '</td><td class="num">' + g.n + '</td><td class="num dim">' + g.published
            + '</td><td class="num">' + g.base + '</td><td class="num"><b>' + g.s55 + '</b></td><td class="num">' + pfmt(g.p) + '</td></tr>'; }).join("")
      + '</tbody></table>'
      + '<p class="tnote">Counts are exact reads. <b>p</b> is the two-sided exact McNemar test, 5.5 against the re-run, on the images where exactly one of them was right. '
      + 'Published is the Sonnet 5 run the images were picked from, so it is low or high by construction.</p>' : '';

  /* Calibration: is 5.5 surer when right than when wrong? */
  var cal = "";
  if (T) {
    var cm = T.calibration, labs = ["Sonnet 5.5", T.base];
    var line = function(lab){
      var c = cm[lab];
      return '<li><b>' + esc(lab === T.base ? "Sonnet 5 re-run" : lab) + ':</b> right ' + c.right_n + '&times;, mean confidence '
        + (c.right_mean == null ? "n/a" : c.right_mean) + (c.right_min != null ? ' (lowest ' + c.right_min + ')' : '')
        + '; wrong ' + c.wrong_n + '&times;, mean ' + (c.wrong_mean == null ? "n/a" : c.wrong_mean)
        + (c.wrong_max != null ? ' (highest ' + c.wrong_max + ')' : '') + '. Brier score ' + (c.brier == null ? "n/a" : c.brier.toFixed(3)) + '.</li>'; };
    var c55 = cm["Sonnet 5.5"], lowest = D.rows.slice().sort(function(a, b){ return (+a.s55.conf) - (+b.s55.conf); })[0];
    var untestable = c55.wrong_n === 0
      ? '<p class="tnote" style="margin:10px 0 10px">Sonnet 5.5 was never wrong here, so whether it is less sure when wrong '
        + 'cannot be tested on this sample. Its least confident answer (' + esc(lowest.s55.conf) + ', ' + esc(lowest.n) + ') was right.</p>' : '';
    cal = '<ul class="facts">' + labs.map(line).join("") + '</ul>' + untestable
      + '<table class="bd cal"><thead><tr><th>Stated confidence</th>' + labs.map(function(l){ return '<th class="num">' + esc(l === T.base ? "Re-run" : "5.5") + ' exact</th>'; }).join("") + '</tr></thead><tbody>'
      + cm[labs[0]].bins.map(function(b, i){
          return '<tr><td>' + esc(b.bin) + '</td>' + labs.map(function(l){ var x = cm[l].bins[i];
            return '<td class="num">' + (x.n ? x.exact + ' of ' + x.n : '<span class="dim">none</span>') + '</td>'; }).join("") + '</tr>'; }).join("")
      + '</tbody></table>'
      + '<p class="tnote">Brier score is the mean squared gap between stated confidence (as a probability) and the outcome; lower is better, 0 is perfect. '
      + 'Confidence is what each reader wrote for itself, 0-100, asked to be its probability of an exact match.</p>';
  }

  var costs = '<li><b>Sonnet 5.5:</b> ' + money(S.s55_cost_per_image) + ' and ' + mins(S.s55_time_per_image) + ' per image ('
      + money(S.s55_cost) + ', ' + mins(S.s55_seconds) + ' of reader time over ' + runs.length + (runs.length === 1 ? ' run' : ' runs') + ').</li>'
    + (D.side || []).map(function(x){ return '<li><b>' + esc(x.label) + ':</b> ' + money(x.cost / x.n) + ' and '
        + mins(x.seconds / x.n) + ' per image (' + money(x.cost) + ' over ' + x.n + ' images).</li>'; }).join("")
    + '<li><b>Published Sonnet 5 batches</b> these came from: ' + money(S.s5_cost_per_image) + ' and ' + mins(S.s5_time_per_image) + ' per image.</li>';

  var bnotes = Object.keys(D.batches || {}).map(function(b){
    return '<li><b>Batch ' + esc(b) + ':</b> ' + esc(D.batches[b]) + '</li>'; }).join("");

  v.innerHTML = intro() + corpusSection(D.corpus)
    + '<div id="novelslot"></div>'
    + '<section class="sec" id="handpicked"><div class="sec-head">'
    + '<h2>Hand-picked: ' + S.n + ' images</h2>'
    + '<p class="lede">' + S.n + ' images, mostly ones Sonnet 5 read <b>wrong</b>, given to Sonnet 5.5 and to Sonnet 5 again: same images, prompt, effort and scorer.</p>'
    + '</div><div class="split"><div class="col">'
    + '<div class="verdict">' + verdict + '</div>'
    + (cmp ? '<div class="cmp">' + cmp + '</div>' + tally : '')
    + '<p class="cmpnote">Published Sonnet 5 on these images: <b>' + S.s5_exact + '/' + S.n + '</b>; that is why they were picked, not a baseline (' + S.failures + ' misses, ' + S.controls + ' controls).</p>'
    + '<details class="fold"><summary>Which images, per reader, run-to-run noise, caveats</summary>' + more
    + '<p class="tnote"><b>Reading or recall?</b> Every image is a known drug. Sonnet 5.5 named ' + S.s55_named + ' of ' + S.n
    + ', published Sonnet 5 named ' + S.s5_named + ' and still drew ' + S.s5_named_wrong + ' of those wrong. The prompt allows recognising a molecule and cross-checking it, so this measures reading plus recall.</p>'
    + '<div class="caveat"><b>Small, hand-picked sample.</b> ' + S.n + ' images, one reading per model per image, '
    + S.failures + ' of them chosen because Sonnet 5 had missed them. Picking on failure favours any second attempt, which is why the '
    + 'comparison is with a same-prompt re-run and not with the published score. It is not an accuracy figure for 5.5 and should not '
    + 'be set against the Sonnet tab’s corpus percentage.</div></details>'
    + '</div><div class="col"><div>'
    + '<h3 class="subh">By batch and by kind</h3>' + bd
    + '</div></div></div>'
    + '<div class="split block"><div><h3 class="subh">Confidence</h3><p class="sectsub">Is each model surer when it is right?</p>'
    + '<details class="fold"><summary>Calibration: means, extremes, Brier, by stated confidence</summary>' + cal + '</details></div>'
    + '<div><h3 class="subh">Cost and time</h3><p class="sectsub">API list price of the tokens each reader used; the same per-token price for both models.</p>'
    + '<ul class="facts">' + costs + '</ul></div></div>'
    + '<div class="block"><h3 class="subh" id="perimage">Per image</h3><p class="sectsub">Misses first, then images Sonnet 5 read right. Each reading is drawn back with RDKit, so a wrong atom shows up against the drawing at a glance.</p>'
    + '<div class="cards">' + D.rows.map(function(r){ return card(r, D); }).join("") + '</div></div>'
    + '<div class="block"><h3 class="subh" id="runs">Runs</h3><p class="sectsub">Every reader, with the model the API says served it. The page renders from <a href="/wall/sonnet_compare.json">sonnet_compare.json</a>, rebuilt by <code>tools/build_sonnet55.py</code>.</p>'
    + '<div class="tscroll"><table class="runs"><thead><tr><th>Run</th><th>Batch</th><th>Started (UTC)</th><th>Model served</th><th>Effort</th><th>CLI</th><th class="num">Images</th><th class="num">Cost</th><th class="num">Wall-clock</th></tr></thead><tbody>'
    + runs.map(function(r){ return '<tr><td>Sonnet 5.5</td><td>' + esc(r.batch) + '</td><td>' + esc(r.started.replace("T", " ").slice(0, 16)) + '</td><td>' + esc(r.models.join(", "))
        + '</td><td>' + esc(r.effort.join(", ")) + '</td><td>' + esc(r.cli) + '</td><td class="num">' + r.images + '</td><td class="num">' + money(r.cost_usd)
        + '</td><td class="num">' + mins(r.duration_s) + '</td></tr>'; }).join("")
    + (D.side || []).map(function(x){ return (x.runs || []).map(function(r){ return '<tr><td>' + esc(x.label) + '</td><td>' + esc(r.batch) + '</td><td>' + esc(r.started.replace("T", " ").slice(0, 16)) + '</td><td>' + esc(r.models.join(", "))
        + '</td><td>' + esc(r.effort.join(", ")) + '</td><td>' + esc(r.cli) + '</td><td class="num">' + r.images + '</td><td class="num">' + money(r.cost_usd)
        + '</td><td class="num">' + mins(r.duration_s) + '</td></tr>'; }).join(""); }).join("")
    + (D.s5runs || []).map(function(r){ return '<tr><td>Sonnet 5, published: ' + esc((r["for"] || []).join(", ")) + '</td><td>—</td><td>' + esc((r.started || "").replace("T", " ").slice(0, 16)) + '</td><td>' + esc((r.models || []).join(", "))
        + '</td><td>' + esc((r.effort || []).join(", ")) + '</td><td>' + esc(r.cli) + '</td><td class="num">' + r.images + '</td><td class="num">' + money(r.cost_usd)
        + '</td><td class="num">' + mins(r.duration_s) + '</td></tr>'; }).join("")
    + '</tbody></table></div></div>'
    + '<div class="block"><h3 class="subh" id="method">Method</h3>'
    + '<ul class="notes">' + bnotes
    + '<li><b>Same images.</b> Byte-identical copies of the corpus drawings Sonnet 5 read, handed over under anonymised names (fig01…), because the corpus files are named after their compounds.</li>'
    + '<li><b>Same prompt.</b> The Sonnet 5 batches’ reader prompt, word for word, with only the image count, paths and answers file changed. Shown below.</li>'
    + '<li><b>Same agent and effort.</b> A Claude Code subagent with a shell, Python and RDKit, at max effort, spawned on an exact model id. The model is read from the API’s stamp on every response in the transcript, not from what the model says.</li>'
    + '<li><b>Same scorer.</b> RDKit canonical SMILES: exact, stereo-only, wrong or unparseable. Every run passed the same gate as the Sonnet 5 batches: no lookups in its transcript, every answer present in it.</li>'
    + '<li><b>What differs.</b> Batch size (published Sonnet 5 runs read ten per reader; in batch 1 the 5.5 run and the re-run read all eight together, in batch 2 each read ten per reader, two readers each), the Claude Code release, and the image names. The re-run and 5.5 share the prompt exactly.</li>'
    + '</ul>'
    + runs.slice(-1).map(function(r){ return '<details><summary>Reader prompt (latest run)</summary><div class="pre">' + esc(r.prompt) + '</div></details>'; }).join("")
    + '</div></section>'
    + '<footer>Built ' + esc(D.built.replace("T", " ").slice(0, 16)) + ' UTC. Prices: ' + esc(D.price.note) + ' Ground truth is PubChem; the published Sonnet 5 readings are the rows on the <a href="/?tab=sonnet">Sonnet tab</a>.</footer>';
}

/* The active tab (Sonnet compare) is the LAST one, so on a phone the strip starts scrolled to
   its end and fades on the left instead, where the hidden tabs are. */
(function(){ var seg = $(".seg");
  var fade = function(){ seg.classList.toggle("at-start", seg.scrollLeft <= 2); };
  seg.scrollLeft = seg.scrollWidth; fade();
  seg.addEventListener("scroll", fade, {passive: true}); window.addEventListener("resize", fade); })();
/* Header height (one row on phones, two with the section nav) sets the anchor offset. */
function measure(){
  document.documentElement.style.setProperty("--hh", $("header").offsetHeight + "px");
  fitCaps();
}
/* Section nav: highlight the section the reader is in. */
var SPY = ["corpus", "novel", "kindc", "handpicked", "perimage", "runs", "method"];
function spy(){
  var links = document.querySelectorAll(".toc a");
  if (!links.length || !links[0].offsetParent) return;
  var line = $("header").offsetHeight + 24, cur = null;
  SPY.forEach(function(id){ var e = document.getElementById(id);
    if (e && e.getBoundingClientRect().top <= line) cur = id; });
  links.forEach(function(a){ a.classList.toggle("on", a.getAttribute("href") === "#" + cur); });
}
var spyQueued = false;
window.addEventListener("scroll", function(){
  if (spyQueued) return; spyQueued = true;
  requestAnimationFrame(function(){ spyQueued = false; spy(); });
}, {passive: true});
window.addEventListener("resize", function(){ measure(); spy(); });
measure();
fetch("/wall/sonnet_compare.json", {cache: "no-cache"}).then(function(r){
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}).then(function(D){ render(D); measure(); spy(); loadNovel(D.corpus); }).catch(function(e){
  $("#view").innerHTML = '<div class="err">No Sonnet 5.5 results yet (' + esc(e.message) + ').</div>';
});
